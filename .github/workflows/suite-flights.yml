name: Suite - Flights
run-name: ${{ inputs.nightly_batch && format('Suite - Flights · nightly {0}', inputs.nightly_batch) || 'Suite - Flights' }}

# One of the four nightly domain suites. suite-scheduler.yml dispatches all four
# (Flights, Hotels, Shell, Transportation) in parallel on its schedule;
# this one is also manually dispatchable on its own. It starts and finishes
# independently — no domain waits on another any more, and nothing downstream
# depends on this run. See suite-scheduler.yml for why the schedule lives there
# and why dispatch uses workflow_dispatch rather than the workflow_run event.
#
# Stability levers vs. the legacy Test Suite:
#   - lower parallelism (non-booking 4→2, booking 2→1) to cut contention flakes
#   - --retry 1 (the run plus one rerun of a failing scenario) absorbs flakes
#     in-run; on the nightly, whatever still fails is rerun again later by
#     Rerun - Flights, started by rerun-nightly-gate.yml once all four domains
#     are done (see the hand-off job at the bottom)
#
# Two directories are sharded across legs (`"shard": "i/n"`), both for the same
# reason: cucumber writes its json/junit formatters only at the very end, so a
# step-timeout kill uploads an empty report and every scenario in that leg
# silently vanishes from the domain totals.
#
#   flights_general_non_booking (2 legs) — at 75 pickles it is by far the biggest
#   non-booking directory, more than twice the next one, and at parallel 2 it was
#   landing on 78-96 min against a 95 min step cap. It lost its whole report to a
#   timeout in 3 of the 8 runs before 2026-08-28 (run 33125855057 uploaded a
#   0-byte cucumber-junit.xml). Split: ~48 min per leg.
#
#   flights_sabre_booking (2 legs) — only 25 pickles, but 22 of them currently
#   fail, and every failing scenario burns its full retry budget. Under the old
#   --retry 3 (4 attempts) that amplification, not volume, is what put it over
#   the cap: run 34892432967
#   (2026-09-14) spent 189.7 attempt-minutes against the 190 min cap and was
#   killed with its last scenario still retrying, losing the whole report.
#   Measured per-scenario times put the worst of two round-robin shards at
#   ~110 min, ~58% of the cap. Re-check the split if those tests get fixed
#   (they will get much faster) or if more are added.
#
# Sharding cuts the wall clock without raising parallel, which is the lever that
# causes contention flakes. Add more shards, don't raise parallel, if a leg
# creeps back toward the cap — and remember to add the new suite_ids to
# expected-suites, or the reconciliation step fails the report job.

on:
  workflow_dispatch:
    inputs:
      nightly_batch:
        description: 'Set by the Suite Scheduler. Leave blank for a one-off run (no automatic rerun).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-flights
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Flights
      history-workflow: suite-flights.yml
      expected-suites: >-
        flights-amadeus-non-booking flights-general-non-booking-1 flights-general-non-booking-2
        flights-galileo-non-booking
        flights-sabre-non-booking flights-ypsilon-non-booking flights-travelfusion-non-booking
        flights-aa-ndc-non-booking flights-afkl-ndc-non-booking flights-ba-ndc-non-booking
        flights-ib-ndc-non-booking flights-lh-ndc-non-booking flights-ua-ndc-non-booking
        flights-amadeus-booking flights-general-booking flights-galileo-booking
        flights-sabre-booking-1 flights-sabre-booking-2 flights-ypsilon-booking flights-travelfusion-booking
        flights-afkl-ndc-booking flights-ba-ndc-booking flights-ib-ndc-booking
        flights-lh-ndc-booking flights-ua-ndc-booking
      matrix: |
        {
          "include": [
            { "suite_id": "flights-amadeus-non-booking",     "suite_name": "Flights Amadeus Non Booking",     "test_path": "tests/features/flights/flights_amadeus/flights_amadeus_non_booking/",         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-general-non-booking-1",   "suite_name": "Flights General Non Booking 1of2", "test_path": "tests/features/flights/flights_general/flights_general_non_booking/",         "shard": "1/2", "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-general-non-booking-2",   "suite_name": "Flights General Non Booking 2of2", "test_path": "tests/features/flights/flights_general/flights_general_non_booking/",         "shard": "2/2", "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-galileo-non-booking",     "suite_name": "Flights Galileo Non Booking",     "test_path": "tests/features/flights/flights_galileo/flights_galileo_non_booking/",         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-sabre-non-booking",       "suite_name": "Flights Sabre Non Booking",       "test_path": "tests/features/flights/flights_sabre/flights_sabre_non_booking/",             "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-ypsilon-non-booking",     "suite_name": "Flights Ypsilon Non Booking",     "test_path": "tests/features/flights/flights_ypsilon/flights_ypsilon_non_booking/",         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-travelfusion-non-booking","suite_name": "Flights Travelfusion Non Booking","test_path": "tests/features/flights/flights_travelfusion/flights_travelfusion_non_booking/","parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-aa-ndc-non-booking",      "suite_name": "Flights AA NDC Non Booking",      "test_path": "tests/features/flights/flights_aa_ndc/flights_aa_ndc_non_booking/",           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-afkl-ndc-non-booking",    "suite_name": "Flights AFKL NDC Non Booking",    "test_path": "tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_non_booking/",       "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-ba-ndc-non-booking",      "suite_name": "Flights BA NDC Non Booking",      "test_path": "tests/features/flights/flights_ba_ndc/flights_ba_ndc_non_booking/",           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-ib-ndc-non-booking",      "suite_name": "Flights IB NDC Non Booking",      "test_path": "tests/features/flights/flights_ib_ndc/flights_ib_ndc_non_booking/",           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-lh-ndc-non-booking",      "suite_name": "Flights LH NDC Non Booking",      "test_path": "tests/features/flights/flights_lh_ndc/flights_lh_ndc_non_booking/",           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-ua-ndc-non-booking",      "suite_name": "Flights UA NDC Non Booking",      "test_path": "tests/features/flights/flights_ua_ndc/flights_ua_ndc_non_booking/",           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "flights-amadeus-booking",         "suite_name": "Flights Amadeus Booking",         "test_path": "tests/features/flights/flights_amadeus/flights_amadeus_booking/",             "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-general-booking",         "suite_name": "Flights General Booking",         "test_path": "tests/features/flights/flights_general/flights_general_booking/",             "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-galileo-booking",         "suite_name": "Flights Galileo Booking",         "test_path": "tests/features/flights/flights_galileo/flights_galileo_booking/",             "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-sabre-booking-1",         "suite_name": "Flights Sabre Booking 1of2",      "test_path": "tests/features/flights/flights_sabre/flights_sabre_booking/",                 "shard": "1/2", "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-sabre-booking-2",         "suite_name": "Flights Sabre Booking 2of2",      "test_path": "tests/features/flights/flights_sabre/flights_sabre_booking/",                 "shard": "2/2", "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-ypsilon-booking",         "suite_name": "Flights Ypsilon Booking",         "test_path": "tests/features/flights/flights_ypsilon/flights_ypsilon_booking/",             "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-travelfusion-booking",    "suite_name": "Flights Travelfusion Booking",    "test_path": "tests/features/flights/flights_travelfusion/flights_travelfusion_booking/",   "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-afkl-ndc-booking",        "suite_name": "Flights AFKL NDC Booking",        "test_path": "tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_booking/",           "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-ba-ndc-booking",          "suite_name": "Flights BA NDC Booking",          "test_path": "tests/features/flights/flights_ba_ndc/flights_ba_ndc_booking/",               "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-ib-ndc-booking",          "suite_name": "Flights IB NDC Booking",          "test_path": "tests/features/flights/flights_ib_ndc/flights_ib_ndc_booking/",               "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-lh-ndc-booking",          "suite_name": "Flights LH NDC Booking",          "test_path": "tests/features/flights/flights_lh_ndc/flights_lh_ndc_booking/",               "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 },
            { "suite_id": "flights-ua-ndc-booking",          "suite_name": "Flights UA NDC Booking",          "test_path": "tests/features/flights/flights_ua_ndc/flights_ua_ndc_booking/",               "parallel": 1, "retry": 1, "job_timeout_minutes": 200, "step_timeout_minutes": 190 }
          ]
        }

  # Nightly only (the scheduler passes nightly_batch). Once this domain has
  # finished, ask the gate to start the reruns. The gate starts them only when
  # ALL FOUR domains of this nightly have finished, so whichever domain ends
  # last is the one that actually kicks them off. The gate finds this job by
  # its name — keep the name in sync with HANDOFF_JOB in rerun-nightly-gate.yml.
  rerun-handoff:
    name: Hand off to the nightly rerun gate
    needs: suite
    if: ${{ always() && inputs.nightly_batch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # gh workflow run dispatches the gate
    steps:
      - name: Ask the gate to start this nightly's reruns
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.nightly_batch }}
        run: |
          # Retry: a transient GitHub API 5xx must not cost the night its reruns.
          for attempt in 1 2 3 4 5; do
            if gh workflow run rerun-nightly-gate.yml --ref main --repo "$GITHUB_REPOSITORY" -f batch="$BATCH"; then
              echo "Gate dispatched for nightly batch $BATCH (attempt $attempt)."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::Could not dispatch the nightly rerun gate after 5 attempts. Start it by hand: Nightly Rerun Gate, batch $BATCH."
          exit 1
