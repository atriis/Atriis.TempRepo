name: Test Suite

on:
  # push:
  #  branches: [ main ]
  # pull_request:
  #  branches: [ main ]
  schedule:
    - cron: '30 18 */2 * *'  # Run every other day at 18:30 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode (single worker + backtrace)'
        required: false
        type: boolean
        default: false
      product:
        description: 'Product to run'
        required: false
        type: choice
        default: all
        options:
          - all
          - flights
          - hotels
          - cars
          - rails
          - shell
      run_non_booking:
        description: 'Run non-booking suites'
        required: false
        type: boolean
        default: true
      run_booking:
        description: 'Run booking suites'
        required: false
        type: boolean
        default: true
      labels_or_test_id:
        description: 'Optional filter: @tag expression or test id/scenario name'
        required: false
        type: string
        default: ''

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-non-booking:
    name: '[Non-Booking] ${{ matrix.suite_name }}'
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_non_booking == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          # GDS Flights - Non Booking
          - suite_id: flights-amadeus-non-booking
            suite_name: Flights Amadeus Non Booking
            test_path: tests/features/flights/flights_amadeus/flights_amadeus_non_booking/
          - suite_id: flights-general-non-booking
            suite_name: Flights General Non Booking
            test_path: tests/features/flights/flights_general/flights_general_non_booking/
          - suite_id: flights-galileo-non-booking
            suite_name: Flights Galileo Non Booking
            test_path: tests/features/flights/flights_galileo/flights_galileo_non_booking/
          - suite_id: flights-sabre-non-booking
            suite_name: Flights Sabre Non Booking
            test_path: tests/features/flights/flights_sabre/flights_sabre_non_booking/
          # LCC Flights - Non Booking
          - suite_id: flights-ypsilon-non-booking
            suite_name: Flights Ypsilon Non Booking
            test_path: tests/features/flights/flights_ypsilon/flights_ypsilon_non_booking/
          - suite_id: flights-travelfusion-non-booking
            suite_name: Flights Travelfusion Non Booking
            test_path: tests/features/flights/flights_travelfusion/flights_travelfusion_non_booking/
          # NDC Flights - Non Booking
          - suite_id: flights-aa-ndc-non-booking
            suite_name: Flights AA NDC Non Booking
            test_path: tests/features/flights/flights_aa_ndc/flights_aa_ndc_non_booking/
          - suite_id: flights-afkl-ndc-non-booking
            suite_name: Flights AFKL NDC Non Booking
            test_path: tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_non_booking/
          - suite_id: flights-ba-ndc-non-booking
            suite_name: Flights BA NDC Non Booking
            test_path: tests/features/flights/flights_ba_ndc/flights_ba_ndc_non_booking/
          - suite_id: flights-ib-ndc-non-booking
            suite_name: Flights IB NDC Non Booking
            test_path: tests/features/flights/flights_ib_ndc/flights_ib_ndc_non_booking/
          - suite_id: flights-lh-ndc-non-booking
            suite_name: Flights LH NDC Non Booking
            test_path: tests/features/flights/flights_lh_ndc/flights_lh_ndc_non_booking/
          - suite_id: flights-ua-ndc-non-booking
            suite_name: Flights UA NDC Non Booking
            test_path: tests/features/flights/flights_ua_ndc/flights_ua_ndc_non_booking/
          # Hotels - Non Booking
          - suite_id: hotels-non-booking
            suite_name: Hotels Non Booking
            test_path: tests/features/hotels/hotels_non_booking/
          # Other
          - suite_id: cars-booking
            suite_name: Cars Booking
            test_path: tests/features/cars/cars_booking/
          - suite_id: cars-daily
            suite_name: Cars Daily
            test_path: tests/features/cars/daily_cars/
          - suite_id: rails-daily
            suite_name: Rails Daily
            test_path: tests/features/rails/daily_rails/
          # Shell
          - suite_id: shell-fop-issues
            suite_name: Shell FOP Issues
            test_path: tests/features/shell/shell_fop_issues/
          - suite_id: shell-frequent-programs
            suite_name: Shell Frequent Programs
            test_path: tests/features/shell/shell_frequent_programs/
          - suite_id: shell-manual-quote
            suite_name: Shell Manual Quote
            test_path: tests/features/shell/shell_manual_quote/
          - suite_id: shell-user-profile
            suite_name: Shell User Profile
            test_path: tests/features/shell/shell_user_profile/
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: 60
        run: |
          set -o pipefail
          SELECTED_PRODUCT="${{ github.event.inputs.product || 'all' }}"
          FILTER_INPUT="${{ github.event.inputs.labels_or_test_id || '' }}"
          SUITE_ID="${{ matrix.suite_id }}"
          TEST_PATH="${{ matrix.test_path }}"

          case "${SUITE_ID}" in
            flights-*) SUITE_PRODUCT="flights" ;;
            hotels-*) SUITE_PRODUCT="hotels" ;;
            cars-*) SUITE_PRODUCT="cars" ;;
            rails-*) SUITE_PRODUCT="rails" ;;
            shell-*) SUITE_PRODUCT="shell" ;;
            *) SUITE_PRODUCT="all" ;;
          esac

          if [[ "${SELECTED_PRODUCT}" != "all" && "${SELECTED_PRODUCT}" != "${SUITE_PRODUCT}" ]]; then
            echo "Skipping suite ${SUITE_ID} for selected product '${SELECTED_PRODUCT}'"
            exit 0
          fi

          if [[ "${{ github.event.inputs.debug || 'false' }}" == "true" ]]; then
            PARALLEL=1
            DEBUG_ARGS=(--format progress --backtrace)
          else
            PARALLEL=4
            DEBUG_ARGS=(--format progress)
          fi

          FILTER_ARGS=()
          TARGET_PATHS=("${TEST_PATH}")
          REQUIRE_FILE_MATCH=false

          if [[ -n "${FILTER_INPUT}" ]]; then
            FILTER_INPUT_TRIMMED="$(printf '%s' "${FILTER_INPUT}" | sed -E 's/^\s+|\s+$//g')"

            if [[ "${FILTER_INPUT}" == @* ]]; then
              FILTER_ARGS=(--tags "${FILTER_INPUT_TRIMMED}")
              echo "Applying tag filter: ${FILTER_INPUT_TRIMMED}"
            else
              USE_NAME_FILTER=true
              LOWER_FILTER="$(printf '%s' "${FILTER_INPUT_TRIMMED}" | tr '[:upper:]' '[:lower:]')"

              if [[ "${FILTER_INPUT_TRIMMED}" =~ ^[0-9]+$ ]] || [[ "${FILTER_INPUT_TRIMMED}" =~ ^TC-?[0-9]+$ ]]; then
                USE_NAME_FILTER=false
                REQUIRE_FILE_MATCH=true
                FILTER_ID="${FILTER_INPUT_TRIMMED//[^0-9]/}"
                echo "Applying test-id filter: ${FILTER_ID}"
                if command -v rg >/dev/null 2>&1; then
                  mapfile -t MATCHED_FILES < <(rg -l --glob '*.feature' --fixed-strings "${FILTER_ID}" "${TEST_PATH}" || true)
                else
                  mapfile -t MATCHED_FILES < <(grep -RIl --include='*.feature' --fixed-strings "${FILTER_ID}" "${TEST_PATH}" || true)
                fi
              else
                # Label shorthand without '@' (e.g. galileo) is treated as a tag when matching tags exist.
                TAG_CANDIDATE="@${LOWER_FILTER}"
                if command -v rg >/dev/null 2>&1; then
                  tag_match_count=$(rg -n --glob '*.feature' --fixed-strings "${TAG_CANDIDATE}" "${TEST_PATH}" | wc -l)
                else
                  tag_match_count=$(grep -RIn --include='*.feature' --fixed-strings "${TAG_CANDIDATE}" "${TEST_PATH}" | wc -l)
                fi

                if [[ "${tag_match_count}" -gt 0 ]]; then
                  USE_NAME_FILTER=false
                  FILTER_ARGS=(--tags "${TAG_CANDIDATE}")
                  echo "Applying label-as-tag filter: ${TAG_CANDIDATE}"
                else
                  echo "Applying scenario/name filter: ${FILTER_INPUT_TRIMMED}"
                  if command -v rg >/dev/null 2>&1; then
                    mapfile -t MATCHED_FILES < <(rg -l --glob '*.feature' --fixed-strings "${FILTER_INPUT_TRIMMED}" "${TEST_PATH}" || true)
                  else
                    mapfile -t MATCHED_FILES < <(grep -RIl --include='*.feature' --fixed-strings "${FILTER_INPUT_TRIMMED}" "${TEST_PATH}" || true)
                  fi
                fi
              fi

              if [[ ${#MATCHED_FILES[@]} -gt 0 ]]; then
                TARGET_PATHS=("${MATCHED_FILES[@]}")
                echo "Matched feature files: ${#TARGET_PATHS[@]}"
              else
                if [[ "${REQUIRE_FILE_MATCH}" == "true" ]]; then
                  echo "No feature files matched test-id filter under ${TEST_PATH}; skipping suite ${SUITE_ID}."
                  exit 0
                fi
                echo "No feature files matched filter text under ${TEST_PATH}; using suite path"
              fi

              if [[ "${USE_NAME_FILTER}" == "true" ]]; then
                ESCAPED_FILTER="$(printf '%s' "${FILTER_INPUT_TRIMMED}" | sed -E 's/[][(){}.^$*+?|\\/]/\\\\&/g')"
                FILTER_ARGS=(--name "${ESCAPED_FILTER}")
              fi
            fi

            PREFLIGHT_OUTPUT="$(npx cucumber-js \
              "${TARGET_PATHS[@]}" \
              --parallel 1 \
              --retry 0 \
              --dry-run \
              --format summary \
              "${FILTER_ARGS[@]}" \
              2>&1 || true)"
            printf '%s\n' "${PREFLIGHT_OUTPUT}" > test-results/cucumber-filter-preflight.log

            if echo "${PREFLIGHT_OUTPUT}" | grep -Eq '(^|[^0-9])0 scenarios([^0-9]|$)'; then
              echo "No scenarios matched labels_or_test_id='${FILTER_INPUT}' for suite ${SUITE_ID}; skipping suite."
              exit 0
            fi

            touch test-results/filter-match.txt
          fi

          echo "Debug mode: ${{ github.event.inputs.debug || 'false' }}"
          echo "Cucumber parallel workers: ${PARALLEL}"

          npx cucumber-js \
            "${TARGET_PATHS[@]}" \
            --parallel "${PARALLEL}" \
            --retry 2 \
            "${DEBUG_ARGS[@]}" \
            "${FILTER_ARGS[@]}" \
            2>&1 | tee test-results/cucumber-raw.log
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} Raw Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-raw-log
          path: test-results/cucumber-raw.log
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Filter Match Marker
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-filter-match
          path: test-results/filter-match.txt
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

  test-booking:
    name: '[Booking] ${{ matrix.suite_name }}'
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_booking == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # GDS Flights - Booking
          - suite_id: flights-amadeus-booking
            suite_name: Flights Amadeus Booking
            test_path: tests/features/flights/flights_amadeus/flights_amadeus_booking/
          - suite_id: flights-general-booking
            suite_name: Flights General Booking
            test_path: tests/features/flights/flights_general/flights_general_booking/
          - suite_id: flights-galileo-booking
            suite_name: Flights Galileo Booking
            test_path: tests/features/flights/flights_galileo/flights_galileo_booking/
          - suite_id: flights-sabre-booking
            suite_name: Flights Sabre Booking
            test_path: tests/features/flights/flights_sabre/flights_sabre_booking/
          # LCC Flights - Booking
          - suite_id: flights-ypsilon-booking
            suite_name: Flights Ypsilon Booking
            test_path: tests/features/flights/flights_ypsilon/flights_ypsilon_booking/
          - suite_id: flights-travelfusion-booking
            suite_name: Flights Travelfusion Booking
            test_path: tests/features/flights/flights_travelfusion/flights_travelfusion_booking/
          # NDC Flights - Booking
          - suite_id: flights-afkl-ndc-booking
            suite_name: Flights AFKL NDC Booking
            test_path: tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_booking/
          - suite_id: flights-ba-ndc-booking
            suite_name: Flights BA NDC Booking
            test_path: tests/features/flights/flights_ba_ndc/flights_ba_ndc_booking/
          - suite_id: flights-ib-ndc-booking
            suite_name: Flights IB NDC Booking
            test_path: tests/features/flights/flights_ib_ndc/flights_ib_ndc_booking/
          - suite_id: flights-lh-ndc-booking
            suite_name: Flights LH NDC Booking
            test_path: tests/features/flights/flights_lh_ndc/flights_lh_ndc_booking/
          - suite_id: flights-ua-ndc-booking
            suite_name: Flights UA NDC Booking
            test_path: tests/features/flights/flights_ua_ndc/flights_ua_ndc_booking/
          # Hotels - Booking
          - suite_id: hotels-booking
            suite_name: Hotels Booking
            test_path: tests/features/hotels/hotels_booking/
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: 80
        run: |
          set -o pipefail
          SELECTED_PRODUCT="${{ github.event.inputs.product || 'all' }}"
          FILTER_INPUT="${{ github.event.inputs.labels_or_test_id || '' }}"
          SUITE_ID="${{ matrix.suite_id }}"
          TEST_PATH="${{ matrix.test_path }}"

          case "${SUITE_ID}" in
            flights-*) SUITE_PRODUCT="flights" ;;
            hotels-*) SUITE_PRODUCT="hotels" ;;
            cars-*) SUITE_PRODUCT="cars" ;;
            rails-*) SUITE_PRODUCT="rails" ;;
            shell-*) SUITE_PRODUCT="shell" ;;
            *) SUITE_PRODUCT="all" ;;
          esac

          if [[ "${SELECTED_PRODUCT}" != "all" && "${SELECTED_PRODUCT}" != "${SUITE_PRODUCT}" ]]; then
            echo "Skipping suite ${SUITE_ID} for selected product '${SELECTED_PRODUCT}'"
            exit 0
          fi

          if [[ "${{ github.event.inputs.debug || 'false' }}" == "true" ]]; then
            PARALLEL=1
            DEBUG_ARGS=(--format progress --backtrace)
          else
            PARALLEL=2
            DEBUG_ARGS=(--format progress)
          fi

          FILTER_ARGS=()
          TARGET_PATHS=("${TEST_PATH}")
          REQUIRE_FILE_MATCH=false

          if [[ -n "${FILTER_INPUT}" ]]; then
            FILTER_INPUT_TRIMMED="$(printf '%s' "${FILTER_INPUT}" | sed -E 's/^\s+|\s+$//g')"

            if [[ "${FILTER_INPUT}" == @* ]]; then
              FILTER_ARGS=(--tags "${FILTER_INPUT_TRIMMED}")
              echo "Applying tag filter: ${FILTER_INPUT_TRIMMED}"
            else
              USE_NAME_FILTER=true
              LOWER_FILTER="$(printf '%s' "${FILTER_INPUT_TRIMMED}" | tr '[:upper:]' '[:lower:]')"

              if [[ "${FILTER_INPUT_TRIMMED}" =~ ^[0-9]+$ ]] || [[ "${FILTER_INPUT_TRIMMED}" =~ ^TC-?[0-9]+$ ]]; then
                USE_NAME_FILTER=false
                REQUIRE_FILE_MATCH=true
                FILTER_ID="${FILTER_INPUT_TRIMMED//[^0-9]/}"
                echo "Applying test-id filter: ${FILTER_ID}"
                if command -v rg >/dev/null 2>&1; then
                  mapfile -t MATCHED_FILES < <(rg -l --glob '*.feature' --fixed-strings "${FILTER_ID}" "${TEST_PATH}" || true)
                else
                  mapfile -t MATCHED_FILES < <(grep -RIl --include='*.feature' --fixed-strings "${FILTER_ID}" "${TEST_PATH}" || true)
                fi
              else
                # Label shorthand without '@' (e.g. galileo) is treated as a tag when matching tags exist.
                TAG_CANDIDATE="@${LOWER_FILTER}"
                if command -v rg >/dev/null 2>&1; then
                  tag_match_count=$(rg -n --glob '*.feature' --fixed-strings "${TAG_CANDIDATE}" "${TEST_PATH}" | wc -l)
                else
                  tag_match_count=$(grep -RIn --include='*.feature' --fixed-strings "${TAG_CANDIDATE}" "${TEST_PATH}" | wc -l)
                fi

                if [[ "${tag_match_count}" -gt 0 ]]; then
                  USE_NAME_FILTER=false
                  FILTER_ARGS=(--tags "${TAG_CANDIDATE}")
                  echo "Applying label-as-tag filter: ${TAG_CANDIDATE}"
                else
                  echo "Applying scenario/name filter: ${FILTER_INPUT_TRIMMED}"
                  if command -v rg >/dev/null 2>&1; then
                    mapfile -t MATCHED_FILES < <(rg -l --glob '*.feature' --fixed-strings "${FILTER_INPUT_TRIMMED}" "${TEST_PATH}" || true)
                  else
                    mapfile -t MATCHED_FILES < <(grep -RIl --include='*.feature' --fixed-strings "${FILTER_INPUT_TRIMMED}" "${TEST_PATH}" || true)
                  fi
                fi
              fi

              if [[ ${#MATCHED_FILES[@]} -gt 0 ]]; then
                TARGET_PATHS=("${MATCHED_FILES[@]}")
                echo "Matched feature files: ${#TARGET_PATHS[@]}"
              else
                if [[ "${REQUIRE_FILE_MATCH}" == "true" ]]; then
                  echo "No feature files matched test-id filter under ${TEST_PATH}; skipping suite ${SUITE_ID}."
                  exit 0
                fi
