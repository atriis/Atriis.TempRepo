name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC (21:00 Portugal winter / 22:00 Portugal summer)
  workflow_dispatch:

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Smoke Tests
        id: run-smoke
        timeout-minutes: 15
        run: npx cucumber-js tests/features/smoke/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/cucumber-junit.xml

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: test-results/cucumber-report.json

      - name: Upload Smoke Screenshots
        if: failure() && steps.run-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/screenshots/

      - name: Upload Smoke Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-results
          path: allure-results/
          if-no-files-found: ignore

  daily-cars-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Cars Tests
        id: run-daily-cars
        timeout-minutes: 25
        run: npx cucumber-js tests/features/cars/daily_cars/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Cars Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Cars Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Cars Screenshots
        if: failure() && steps.run-daily-cars.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-screenshots
          path: test-results/screenshots/

      - name: Upload Daily Cars Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-allure-results
          path: allure-results/
          if-no-files-found: ignore

  daily-flights-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Flights Tests
        id: run-daily-flights
        timeout-minutes: 35
        run: npx cucumber-js tests/features/flights/daily_flights/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_RUIMENDES: ${{ secrets.USER_RUIMENDES }}
          USER_AMADEUS_GDS: ${{ secrets.USER_AMADEUS_GDS }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_LUCAS: ${{ secrets.USER_LUCAS }}
          USER_CLARA: ${{ secrets.USER_CLARA }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Flights Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Flights Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Flights Screenshots
        if: failure() && steps.run-daily-flights.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-screenshots
          path: test-results/screenshots/

      - name: Upload Daily Flights Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-allure-results
          path: allure-results/
          if-no-files-found: ignore

  daily-shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Shell Tests
        id: run-daily-shell
        timeout-minutes: 20
        run: npx cucumber-js tests/features/shell/daily_shell/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_HARRYPOTTER: ${{ secrets.USER_HARRYPOTTER }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Shell Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Shell Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Shell Screenshots
        if: failure() && steps.run-daily-shell.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-screenshots
          path: test-results/screenshots/

      - name: Upload Daily Shell Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-allure-results
          path: allure-results/
          if-no-files-found: ignore

  daily-hotels-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Hotel Tests
        id: run-daily-hotels
        timeout-minutes: 60
        run: npx cucumber-js tests/features/hotels/daily_hotels/ --parallel 4
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_RUIMENDES: ${{ secrets.USER_RUIMENDES }}
          USER_HELENATEREZA: ${{ secrets.USER_HELENATEREZA }}
          USER_PCW: ${{ secrets.USER_PCW }}
          USER_BRUNA_TELDAR: ${{ secrets.USER_BRUNA_TELDAR }}
          USER_HCORPO: ${{ secrets.USER_HCORPO }}
          USER_AMY: ${{ secrets.USER_AMY }}
          USER_AMYLOYAL: ${{ secrets.USER_AMYLOYAL }}
          USER_JOAO: ${{ secrets.USER_JOAO }}
          USER_SABRIN: ${{ secrets.USER_SABRIN }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          USER_LIDI: ${{ secrets.USER_LIDI }}
          USER_EXPEDIA: ${{ secrets.USER_EXPEDIA }}
          USER_NATALIA: ${{ secrets.USER_NATALIA }}
          USER_ROBBYSILVA: ${{ secrets.USER_ROBBYSILVA }}
          USER_BRUNA_CO2: ${{ secrets.USER_BRUNA_CO2 }}
          USER_EDI: ${{ secrets.USER_EDI }}
          USER_CINTIA: ${{ secrets.USER_CINTIA }}
          USER_ALEXANDRE: ${{ secrets.USER_ALEXANDRE }}
          USER_BRUNANINA: ${{ secrets.USER_BRUNANINA }}
          USER_DISCOVER: ${{ secrets.USER_DISCOVER }}
          USER_STRICTION: ${{ secrets.USER_STRICTION }}
          USER_ELI: ${{ secrets.USER_ELI }}
          USER_PLUTO: ${{ secrets.USER_PLUTO }}
          USER_BRUNA_PREMIER: ${{ secrets.USER_BRUNA_PREMIER }}
          USER_PREMIER: ${{ secrets.USER_PREMIER }}
          USER_SHANI: ${{ secrets.USER_SHANI }}
          USER_FELIPE: ${{ secrets.USER_FELIPE }}
          USER_ZAC: ${{ secrets.USER_ZAC }}
          USER_LILY: ${{ secrets.USER_LILY }}
          USER_CALEB: ${{ secrets.USER_CALEB }}
          USER_TEL: ${{ secrets.USER_TEL }}
          USER_VERED: ${{ secrets.USER_VERED }}
          USER_PAPATINHO: ${{ secrets.USER_PAPATINHO }}
          USER_POICORP: ${{ secrets.USER_POICORP }}
          USER_MAGALIMONICA: ${{ secrets.USER_MAGALIMONICA }}
          USER_INESSA: ${{ secrets.USER_INESSA }}
          USER_REBECCACARDIN: ${{ secrets.USER_REBECCACARDIN }}
          USER_EDWARDCULLEN: ${{ secrets.USER_EDWARDCULLEN }}
          USER_CANISSO: ${{ secrets.USER_CANISSO }}
          USER_SAMMAU: ${{ secrets.USER_SAMMAU }}
          USER_CAROLDYNAMICS: ${{ secrets.USER_CAROLDYNAMICS }}
          USER_SHANI_NL: ${{ secrets.USER_SHANI_NL }}
          USER_TLGG: ${{ secrets.USER_TLGG }}
          USER_LUCIANA: ${{ secrets.USER_LUCIANA }}
          USER_GALILEOGALIEI: ${{ secrets.USER_GALILEOGALIEI }}
          USER_MARKSUNHOT: ${{ secrets.USER_MARKSUNHOT }}
          USER_GALILEO: ${{ secrets.USER_GALILEO }}
          USER_AMOS: ${{ secrets.USER_AMOS }}
          USER_SUZANAVOND: ${{ secrets.USER_SUZANAVOND }}
          USER_DANIELAOLIVEIRA: ${{ secrets.USER_DANIELAOLIVEIRA }}
          USER_VALERIA: ${{ secrets.USER_VALERIA }}
          USER_BRUNAFILTERNONAGREEMENT: ${{ secrets.USER_BRUNAFILTERNONAGREEMENT }}
          USER_BRUNA_NLGOV: ${{ secrets.USER_BRUNA_NLGOV }}
          USER_CHRISTREE: ${{ secrets.USER_CHRISTREE }}
          USER_JULIANAPREMIER: ${{ secrets.USER_JULIANAPREMIER }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Hotels Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Hotels Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Hotels Screenshots
        if: failure() && steps.run-daily-hotels.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-screenshots
          path: test-results/screenshots/

      - name: Upload Daily Hotels Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-allure-results
          path: allure-results/
          if-no-files-found: ignore

  daily-rails-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Rails Tests
        id: run-daily-rails
        timeout-minutes: 25
        run: npx cucumber-js tests/features/rails/daily_rails/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_MARCOLUIS: ${{ secrets.USER_MARCOLUIS }}
          USER_JIM: ${{ secrets.USER_JIM }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Rails Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Rails Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Rails Screenshots
        if: failure() && steps.run-daily-rails.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-screenshots
          path: test-results/screenshots/

      - name: Upload Daily Rails Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-allure-results
          path: allure-results/
          if-no-files-found: ignore

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - smoke-tests
      - daily-cars-tests
      - daily-flights-tests
      - daily-shell-tests
      - daily-hotels-tests
      - daily-rails-tests
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results
        continue-on-error: true

      - name: Download Allure Results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      - name: Download previous Allure history
        if: always()
        uses: dawidd6/action-download-artifact@v6
        with:
          name: allure-history
          path: previous-history
          workflow: test-suite.yml
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always()
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo "📂 Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo "✅ History copied"
          else
            echo "ℹ️ No previous history found (first run)"
          fi

      - name: Setup Node.js for Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install allure@3

      - name: Debug Allure Results
        if: always()
        shell: bash
        run: |
          echo "📂 Checking allure-results directory..."
          if [ -d "allure-results" ]; then
            file_count=$(find allure-results -type f 2>/dev/null | wc -l)
            echo "✅ Found $file_count file(s) in allure-results/"
            find allure-results -type f 2>/dev/null | head -20 || true
          else
            echo "⚠️ allure-results/ directory does not exist"
          fi

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            npx allure generate ./allure-results -o allure-report
            if [ -f "allure-report/index.html" ]; then
              echo "✅ Allure report generated successfully"
            else
              echo "❌ Allure report generation produced no index.html"
            fi
          else
            echo "⚠️ No Allure result files found — skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1><p>No test jobs produced Allure result files for this run.</p></body></html>" > allure-report/index.html
          fi

      - name: Generate Cucumber HTML Report
        if: always()
        shell: bash
        run: |
          echo "📊 Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report

          # Merge all cucumber JSON files and generate HTML report
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find all-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) { console.log('⚠️ No cucumber JSON files found'); process.exit(0); }

            let merged = [];
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                merged = merged.concat(Array.isArray(data) ? data : [data]);
              } catch(e) { console.log('⚠️ Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log('✅ Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            // Parse results
            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const hasFail = steps.some(s => s.result && s.result.status === 'failed');
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped' || s.result.status === 'undefined');
                if (hasFail) { failed++; ff++; }
                else if (allSkip) { skipped++; fsk++; }
                else { passed++; fp++; }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows }));

            // Generate HTML
            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Cucumber Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1>🥒 Cucumber Test Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] +
              ' | Trigger: ' + (process.env.GITHUB_EVENT_NAME || 'unknown') + '</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\">✅ ' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\">❌ ' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\">⏭️ ' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log('✅ Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Post Reports Summary
        if: always()
        shell: bash
        run: |
          echo "## 📋 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse cucumber summary if available
          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              const status = s.failed > 0 ? '❌ SOME TESTS FAILED' : '✅ ALL TESTS PASSED';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| **Status** | ' + status + ' |');
              console.log('| Total Scenarios | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| Pass Rate | **' + passRate + '%** |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Cucumber results summary available" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | How to View |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🥒 **Cucumber HTML** | Download **cucumber-html-report** artifact → open \`index.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 **Allure Report** | Download **allure-report** artifact → run \`npx allure open allure-report\` |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | \`${{ needs.smoke-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily Cars | \`${{ needs.daily-cars-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily Flights | \`${{ needs.daily-flights-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily Shell | \`${{ needs.daily-shell-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily Hotels | \`${{ needs.daily-hotels-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily Rails | \`${{ needs.daily-rails-tests.result }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Parse JUnit Results into Summary
        if: always()
        shell: bash
        run: |
          XML_FILES=$(find all-results -name "cucumber-junit.xml" -type f 2>/dev/null)
          if [ -z "$XML_FILES" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📄 JUnit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No JUnit XML files found" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📄 JUnit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const files = process.argv.slice(1);
              const rows = [];
              let totalTests = 0, totalFail = 0, totalError = 0, totalSkipped = 0, totalTime = 0;

              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                // Extract suite-level attributes from each <testsuite>
                const suiteRegex = /<testsuite\s+([^>]+)>/g;
                let match;
                while ((match = suiteRegex.exec(xml)) !== null) {
                  const attrs = match[1];
                  const get = (name) => { const m = attrs.match(new RegExp(name + '=\"([^\"]*)\"|' + name + \"='([^']*)'\"));  return m ? (m[1] || m[2] || '') : ''; };
                  const name = get('name') || 'Unknown';
                  const tests = parseInt(get('tests')) || 0;
                  const failures = parseInt(get('failures')) || 0;
                  const errors = parseInt(get('errors')) || 0;
                  const skipped = parseInt(get('skipped')) || 0;
                  const time = parseFloat(get('time')) || 0;
                  const passed = tests - failures - errors - skipped;
                  totalTests += tests; totalFail += failures; totalError += errors; totalSkipped += skipped; totalTime += time;
                  const status = (failures + errors) > 0 ? '❌ FAIL' : '✅ PASS';
                  rows.push('| ' + name.substring(0, 60) + ' | ' + tests + ' | ' + passed + ' | ' + (failures + errors) + ' | ' + skipped + ' | ' + time.toFixed(1) + 's | ' + status + ' |');
                }
              }

              const totalPassed = totalTests - totalFail - totalError - totalSkipped;
              console.log('| Suite | Tests | Passed | Failed | Skipped | Time | Status |');
              console.log('|-------|-------|--------|--------|---------|------|--------|');
              rows.forEach(r => console.log(r));
              console.log('| **Total** | **' + totalTests + '** | **' + totalPassed + '** | **' + (totalFail + totalError) + '** | **' + totalSkipped + '** | **' + totalTime.toFixed(1) + 's** | ' + ((totalFail + totalError) > 0 ? '❌' : '✅') + ' |');
            " $XML_FILES >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo "📁 Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"
            
            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo "✅ Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "⚠️ No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"