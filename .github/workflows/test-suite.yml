
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 19 * * *'  # Daily at 19:00 UTC (19:00 Portugal winter / 20:00 Portugal summer)
  workflow_dispatch:  # Allow manual runs via GitHub UI or `gh workflow run`

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Smoke Tests
        run: npx playwright test --project=Smoke
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # General User
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-playwright-report
          path: playwright-report/

  rails-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Rails (Benerail and Amtrak only) Tests
        run: npx playwright test --project=rails:benerail --project=rails:amtrak 
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # Rail Suppliers
          BENERAIL_USER_ONE_EMAIL: ${{ secrets.BENERAIL_USER_ONE_EMAIL }}
          AMTRAK_USER_ONE_EMAIL: ${{ secrets.AMTRAK_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Rails Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-playwright-report
          path: playwright-report/

  sabre-car-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Sabre Car Tests
        run: npx playwright test --project=cars:sabre
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # Cars Suppliers
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Sabre Car Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabre-car-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabre-car-playwright-report
          path: playwright-report/

