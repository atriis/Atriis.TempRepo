name: Test Suite

on:
  # push:
  #  branches: [ main ]
  # pull_request:
  #  branches: [ main ]
  schedule:
    - cron: '30 18 */2 * *'  # Run every other day at 18:30 UTC
  workflow_dispatch:

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the job matrices dynamically from .github/suites.json. build-matrix.js
  # counts the scenarios (Scenario Outline examples expanded) in each suite folder
  # and computes the shard count automatically (ceil(scenarios / target)), so
  # shard counts are never hand-tuned and a suite can't outgrow its step timeout.
  # It also writes expected-suites.json (the expanded suite list) which is uploaded
  # as an artifact and reconciled against the actual results in the report job, so
  # the "expected suites" list can never drift from what actually runs.
  setup:
    name: Build suite matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      non_booking: ${{ steps.build.outputs.non_booking }}
      booking: ${{ steps.build.outputs.booking }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build matrix from scenario counts
        id: build
        run: node .github/scripts/build-matrix.js

      - name: Upload expected-suites manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expected-suites
          path: expected-suites.json
          if-no-files-found: error

  test-non-booking:
    name: '[Non-Booking] ${{ matrix.suite_name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.non_booking) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: 60
        # --parallel 2: each scenario launches its own 1920x1080 Chromium, and the
        # GitHub-hosted runner has only 2 vCPUs. Running 4 browsers here starved the
        # CPU and caused random click/visibility timeouts (different step each run).
        # The matrix already fans suites across separate runners for throughput.
        # --shard i/N: cucumber-js splits this suite's scenarios (pickles) across N
        # shards at the SCENARIO level, so even a heavy Scenario Outline file is
        # spread evenly. N is computed per suite by build-matrix.js from the
        # scenario COUNT (target 14, non-booking). Note: this bounds count, not
        # wall time — a full shard of slow/flaky scenarios (--retry 1) can still
        # approach this timeout; the step timeout + reconciliation is the real
        # guard (a timeout goes red, never a silent under-count). Lower the target
        # in suites.json if a shard trends hot.
        shell: bash
        # Wrap the run to measure wall time and warn BEFORE a shard actually
        # times out: if it uses >70% of the step timeout it's trending hot and
        # its group target in suites.json should be lowered. STEP_TIMEOUT_MIN
        # must match timeout-minutes above.
        run: |
          STEP_TIMEOUT_MIN=60
          WARN_PCT=70
          start=$SECONDS
          set +e
          npx cucumber-js "${{ matrix.test_path }}" --shard ${{ matrix.shard }}/${{ matrix.shards }} --parallel 2 --retry 1
          code=$?
          set -e
          elapsed=$(( SECONDS - start )); mins=$(( elapsed / 60 ))
          thresh=$(( STEP_TIMEOUT_MIN * 60 * WARN_PCT / 100 ))
          echo "Shard wall time: ${mins}m (${elapsed}s) of ${STEP_TIMEOUT_MIN}m step timeout"
          if [ "$elapsed" -gt "$thresh" ]; then
            echo "::warning title=Shard approaching timeout::${{ matrix.suite_name }} ran ${mins}m — over ${WARN_PCT}% of the ${STEP_TIMEOUT_MIN}m step timeout. Lower target_scenarios_per_shard / cpu_minutes_per_shard for non-booking in .github/suites.json."
            echo "⚠️ **${{ matrix.suite_name }}** ran **${mins}m** (>${WARN_PCT}% of ${STEP_TIMEOUT_MIN}m timeout) — shard trending hot; lower the non-booking target in suites.json." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      # Incremental message stream. Unlike the JSON report (flushed only at the
      # end), this is written scenario-by-scenario, so it survives a step
      # timeout and lets the report job recover the scenarios that completed.
      - name: Upload ${{ matrix.suite_name }} Message Stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-messages
          path: test-results/messages.ndjson
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Playwright Traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-traces
          path: test-results/traces/
          if-no-files-found: ignore

  test-booking:
    name: '[Booking] ${{ matrix.suite_name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.booking) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: 80
        # --parallel 1: booking flows are the heaviest (real PNR + cancel) and were
        # the worst hit by CPU contention on the 2-vCPU runner. Run them serially so
        # each browser gets a full core; the matrix still parallelises across suites.
        # --shard i/N: cucumber-js splits this suite's scenarios across N shards at
        # the scenario level. N is computed per suite by build-matrix.js from the
        # scenario COUNT (booking uses a smaller target, 6, since each real-PNR
        # scenario is slow). Note: this bounds count, not wall time — with --retry 1
        # and booking's high observed failure rates, a full shard can still run long;
        # the step timeout + reconciliation is the real guard (a timeout goes red,
        # never a silent under-count). Lower the target in suites.json if hot.
        shell: bash
        # Wrap the run to measure wall time and warn BEFORE a shard actually
        # times out: if it uses >70% of the step timeout it's trending hot and
        # its group target in suites.json should be lowered. STEP_TIMEOUT_MIN
        # must match timeout-minutes above.
        run: |
          STEP_TIMEOUT_MIN=80
          WARN_PCT=70
          start=$SECONDS
          set +e
          npx cucumber-js "${{ matrix.test_path }}" --shard ${{ matrix.shard }}/${{ matrix.shards }} --parallel 1 --retry 1
          code=$?
          set -e
          elapsed=$(( SECONDS - start )); mins=$(( elapsed / 60 ))
          thresh=$(( STEP_TIMEOUT_MIN * 60 * WARN_PCT / 100 ))
          echo "Shard wall time: ${mins}m (${elapsed}s) of ${STEP_TIMEOUT_MIN}m step timeout"
          if [ "$elapsed" -gt "$thresh" ]; then
            echo "::warning title=Shard approaching timeout::${{ matrix.suite_name }} ran ${mins}m — over ${WARN_PCT}% of the ${STEP_TIMEOUT_MIN}m step timeout. Lower target_scenarios_per_shard / cpu_minutes_per_shard for booking in .github/suites.json."
            echo "⚠️ **${{ matrix.suite_name }}** ran **${mins}m** (>${WARN_PCT}% of ${STEP_TIMEOUT_MIN}m timeout) — shard trending hot; lower the booking target in suites.json." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      # Incremental message stream. Unlike the JSON report (flushed only at the
      # end), this is written scenario-by-scenario, so it survives a step
      # timeout and lets the report job recover the scenarios that completed.
      - name: Upload ${{ matrix.suite_name }} Message Stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-messages
          path: test-results/messages.ndjson
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Playwright Traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-traces
          path: test-results/traces/
          if-no-files-found: ignore

  report:
    name: Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, test-non-booking, test-booking]
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-results
        continue-on-error: true

      # The expanded suite list that setup actually fanned out into (one entry per
      # shard). Reconciliation compares THIS against the artifacts that arrived, so
      # the "expected suites" list is exactly what ran — it can't drift.
      - name: Download expected-suites manifest
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: expected-suites
          path: .
        continue-on-error: true

      # Authoritative result: reconcile the suites that were expected to run
      # (expected-suites.json from setup) against the artifacts that arrived.
      # Recovers partial counts from the message stream for timed-out suites and
      # FAILS this job (red run + notification) if any suite produced no results,
      # so a silent under-count like run #439 can never happen again.
      - name: Reconcile suite coverage
        if: always()
        run: node .github/scripts/reconcile-suites.js
        env:
          SUITES_MANIFEST: expected-suites.json

      - name: Download Allure Results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      - name: Download previous Allure history
        if: always()
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          name: allure-history
          path: previous-history
          workflow: test-suite.yml
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always()
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo " Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo " History copied"
          else
            echo " No previous history found (first run)"
          fi

      - name: Setup Node.js for Allure
        if: always()
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install allure@3

      - name: Debug Allure Results
        if: always()
        shell: bash
        run: |
          echo " Checking allure-results directory..."
          if [ -d "allure-results" ]; then
            file_count=$(find allure-results -type f 2>/dev/null | wc -l)
            echo " Found $file_count file(s) in allure-results/"
            find allure-results -type f 2>/dev/null | head -20 || true
          else
            echo " allure-results/ directory does not exist"
          fi

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            npx allure generate ./allure-results -o allure-report
            if [ -f "allure-report/index.html" ]; then
              echo " Allure report generated successfully"
            else
              echo " Allure report generation produced no index.html"
            fi
          else
            echo " No Allure result files found  skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1><p>No test jobs produced Allure result files for this run.</p></body></html>" > allure-report/index.html
          fi

      - name: Generate Cucumber HTML Report
        if: always()
        shell: bash
        run: |
          echo " Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report

          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find all-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) { console.log(' No cucumber JSON files found'); process.exit(0); }

            let merged = [];
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                merged = merged.concat(Array.isArray(data) ? data : [data]);
              } catch(e) { console.log(' Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log(' Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const hasFail = steps.some(s => s.result && s.result.status === 'failed');
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped' || s.result.status === 'undefined');
                if (hasFail) { failed++; ff++; }
                else if (allSkip) { skipped++; fsk++; }
                else { passed++; fp++; }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows }));

            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Cucumber Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1> Cucumber Test Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] +
              ' | Trigger: ' + (process.env.GITHUB_EVENT_NAME || 'unknown') + '</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\"> ' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\"> ' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\"> ' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log(' Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Post Reports Summary
        if: always()
        shell: bash
        run: |
          echo "## 📚 Cucumber Report Detail" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Counts below come from the merged Cucumber report and reflect **only suites that uploaded results**. The authoritative run status and coverage are in the **Test Coverage Reconciliation** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| 🧪 Scenarios in merged report | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| 📊 Pass Rate | **' + passRate + '%** |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo " No Cucumber results summary available" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | How to View |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "|  **Cucumber HTML** | Download **cucumber-html-report** artifact  open \`index.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "|  **Allure Report** | Download **allure-report** artifact  run \`npx allure open allure-report\` |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Matrix | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Non-Booking Suites | \`${{ needs.test-non-booking.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Booking Suites | \`${{ needs.test-booking.result }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Parse JUnit Results into Summary
        if: always()
        shell: bash
        run: |
          XML_FILES=$(find all-results -name "cucumber-junit.xml" -type f 2>/dev/null)
          if [ -z "$XML_FILES" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "###  JUnit Test Results" >> $GITHUB_STEP_SUMMARY
            echo " No JUnit XML files found" >> $GITHUB_STEP_SUMMARY
          else
            node -e "
              const fs = require('fs');
              const files = process.argv.slice(1);
              const out = [];
              let totalTests = 0, totalFail = 0, totalSkipped = 0, totalTime = 0;
              const allFailures = [];

              const fileRows = [];
              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                let fTests = 0, fFail = 0, fSkip = 0, fTime = 0;

                const suiteRegex = /<testsuite\s+([^>]+)>/g;
                let match;
                while ((match = suiteRegex.exec(xml)) !== null) {
                  const attrs = match[1];
                  const get = (n) => { const m = attrs.match(new RegExp(n + '=\"([^\"]*)\"|' + n + \"='([^']*)'\")); return m ? (m[1] || m[2] || '') : ''; };
                  fTests += parseInt(get('tests')) || 0;
                  fFail += (parseInt(get('failures')) || 0) + (parseInt(get('errors')) || 0);
                  fSkip += parseInt(get('skipped')) || 0;
                  fTime += parseFloat(get('time')) || 0;
                }

                const tcRegex = /<testcase\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
                let tc;
                while ((tc = tcRegex.exec(xml)) !== null) {
                  const tcAttrs = tc[1];
                  const tcBody = tc[2] || '';
                  const getName = (n) => { const m = tcAttrs.match(new RegExp(n + '=\"([^\"]*)\"|' + n + \"='([^']*)'\")); return m ? (m[1] || m[2] || '') : ''; };
                  if (tcBody.includes('<failure') || tcBody.includes('<error')) {
                    const tcName = getName('name') || 'Unknown test';
                    const msgMatch = tcBody.match(/message=\"([^\"]*)\"/);
                    const msg = msgMatch ? msgMatch[1].substring(0, 200) : '';
                    allFailures.push({ file: file.replace('all-results/', ''), name: tcName, message: msg });
                  }
                }

                const fPassed = fTests - fFail - fSkip;
                totalTests += fTests; totalFail += fFail; totalSkipped += fSkip; totalTime += fTime;
                const label = file.replace('all-results/', '');
                const passedIcon = fPassed > 0 ? '✅ ' + fPassed : '';
                const failedIcon = fFail > 0 ? '❌ ' + fFail : '';
                fileRows.push('| ' + label + ' | ' + passedIcon + ' | ' + failedIcon + ' | ' + (fSkip || '') + ' | ' + Math.round(fTime) + 's |');
              }

              const totalPassed = totalTests - totalFail - totalSkipped;
              out.push('');
              out.push('###  Test Results');
              out.push('');
              out.push('**' + totalTests + ' tests** — ✅ ' + totalPassed + ' passed  ❌ ' + totalFail + ' failed  ⏭️ ' + totalSkipped + ' skipped');
              out.push('');
              out.push('| Report | Passed | Failed | Skipped | Time |');
              out.push('|--------|--------|--------|---------|------|');
              fileRows.forEach(r => out.push(r));
              out.push('| **Total** | **✅ ' + totalPassed + '** | **❌ ' + totalFail + '** | **⏭️ ' + totalSkipped + '** | **' + Math.round(totalTime) + 's** |');

              if (allFailures.length > 0) {
                out.push('');
                out.push('###  Failed Tests');
                out.push('');
                out.push('| Test | Error | Source |');
                out.push('|------|-------|--------|');
                for (const f of allFailures) {
                  const escapedMsg = f.message.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                  out.push('| ' + f.name.substring(0, 80) + ' | ' + escapedMsg.substring(0, 120) + ' | ' + f.file + ' |');
                }
              }

              console.log(out.join('\n'));
            " $XML_FILES >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo " Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"

            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo " Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo " No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo " No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"
