name: Test Suite

# LEGACY SUITE DISABLED 2026-07-16 while validating the new per-domain suites
# (Suite - Flights, Hotels, Shell, Transportation). The old ~200-scenario
# booking suite must not run automatically and compete with the new runs for test
# accounts / real bookings. The file is intentionally left in place.
#
# It is set to `workflow_dispatch` ONLY: it never fires on push, pull_request, or
# schedule — it runs solely if someone deliberately clicks "Run workflow".
#
# ⚠️ Do NOT "disable" this with an empty `on: {}`. GitHub treats an empty trigger
# map as INVALID and emits a red startup-failure run (0 jobs, no tests executed)
# on EVERY push to ANY branch — that is what littered the Actions tab. A lone
# `workflow_dispatch:` is the correct "present but off" state.
#
# To bring the legacy suite back on a cadence, un-comment the schedule lines.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 18 */2 * *'  # Run every other day at 18:30 UTC

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-non-booking:
    name: '[Non-Booking] ${{ matrix.suite_name }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          # GDS Flights - Non Booking
          - suite_id: flights-amadeus-non-booking
            suite_name: Flights Amadeus Non Booking
            test_path: tests/features/flights/flights_amadeus/flights_amadeus_non_booking/
          - suite_id: flights-general-non-booking
            suite_name: Flights General Non Booking
            test_path: tests/features/flights/flights_general/flights_general_non_booking/
          - suite_id: flights-galileo-non-booking
            suite_name: Flights Galileo Non Booking
            test_path: tests/features/flights/flights_galileo/flights_galileo_non_booking/
          - suite_id: flights-sabre-non-booking
            suite_name: Flights Sabre Non Booking
            test_path: tests/features/flights/flights_sabre/flights_sabre_non_booking/
          # LCC Flights - Non Booking
          - suite_id: flights-ypsilon-non-booking
            suite_name: Flights Ypsilon Non Booking
            test_path: tests/features/flights/flights_ypsilon/flights_ypsilon_non_booking/
          - suite_id: flights-travelfusion-non-booking
            suite_name: Flights Travelfusion Non Booking
            test_path: tests/features/flights/flights_travelfusion/flights_travelfusion_non_booking/
          # NDC Flights - Non Booking
          - suite_id: flights-aa-ndc-non-booking
            suite_name: Flights AA NDC Non Booking
            test_path: tests/features/flights/flights_aa_ndc/flights_aa_ndc_non_booking/
          - suite_id: flights-afkl-ndc-non-booking
            suite_name: Flights AFKL NDC Non Booking
            test_path: tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_non_booking/
          - suite_id: flights-ba-ndc-non-booking
            suite_name: Flights BA NDC Non Booking
            test_path: tests/features/flights/flights_ba_ndc/flights_ba_ndc_non_booking/
          - suite_id: flights-ib-ndc-non-booking
            suite_name: Flights IB NDC Non Booking
            test_path: tests/features/flights/flights_ib_ndc/flights_ib_ndc_non_booking/
          - suite_id: flights-lh-ndc-non-booking
            suite_name: Flights LH NDC Non Booking
            test_path: tests/features/flights/flights_lh_ndc/flights_lh_ndc_non_booking/
          - suite_id: flights-ua-ndc-non-booking
            suite_name: Flights UA NDC Non Booking
            test_path: tests/features/flights/flights_ua_ndc/flights_ua_ndc_non_booking/
          # Hotels - Non Booking
          - suite_id: hotels-non-booking
            suite_name: Hotels Non Booking
            test_path: tests/features/hotels/hotels_non_booking/
          # Other
          - suite_id: cars-daily
            suite_name: Cars Daily
            # cars_blocked/, payload_test/ and sunny_cars/sunny_cars_blocked/ are
            # deliberately excluded — sunny_cars therefore globs *.feature at its
            # root rather than passing the folder, which would recurse into the
            # blocked subfolder.
            test_path: >-
              tests/features/transportation/cars/amadeus/ tests/features/transportation/cars/galileo/
              tests/features/transportation/cars/general/
              tests/features/transportation/cars/sabre/ tests/features/transportation/cars/sunny_cars/*.feature
          # daily_rails/ dissolved into the per-supplier amtrak/, benerail/ and
          # evolvi/ folders. Only benerail runs; glob *.feature at the folder
          # root so benerail_blocked/ is not recursed into.
          - suite_id: rails-benerail
            suite_name: Rails Benerail
            test_path: tests/features/transportation/rails/benerail/*.feature
          # Shell
          - suite_id: shell-agent-assistance-and-suggestions
            suite_name: Shell Agent Assistance And Suggestions
            test_path: tests/features/shell/shell_agent_assistance_and_suggestions/
          - suite_id: shell-conversation
            suite_name: Shell Conversation
            test_path: tests/features/shell/shell_conversation/
          - suite_id: shell-fop-issues
            suite_name: Shell FOP Issues
            test_path: tests/features/shell/shell_fop_issues/
          - suite_id: shell-frequent-programs
            suite_name: Shell Frequent Programs
            test_path: tests/features/shell/shell_frequent_programs/
          - suite_id: shell-joy-search-defaults
            suite_name: Shell Joy Search Defaults
            test_path: tests/features/shell/shell_joy_search_defaults/
          - suite_id: shell-manual-quote
            suite_name: Shell Manual Quote
            test_path: tests/features/shell/shell_manual_quote/
          - suite_id: shell-multiproducts
            suite_name: Shell Multiproducts
            test_path: tests/features/shell/shell_multiproducts/
          - suite_id: shell-per-diem
            suite_name: Shell Per Diem
            test_path: tests/features/shell/shell_per_diem/
          - suite_id: shell-reference-fields
            suite_name: Shell Reference Fields
            test_path: tests/features/shell/shell_reference_fields/
          - suite_id: shell-share-quote-or-itinerary
            suite_name: Shell Share Quote Or Itinerary
            test_path: tests/features/shell/shell_share_quote_or_itinerary/
          - suite_id: shell-travel-policy
            suite_name: Shell Travel Policy
            test_path: tests/features/shell/shell_travel_policy/
          - suite_id: shell-ui-issues
            suite_name: Shell UI Issues
            test_path: tests/features/shell/shell_ui_issues/
          - suite_id: shell-user-profile
            suite_name: Shell User Profile
            test_path: tests/features/shell/shell_user_profile/
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: 60
        run: npx cucumber-js ${{ matrix.test_path }} --profile ci --parallel 4 --retry 2
        env:
          CI: "true"

      # Scenarios that assert a call made minutes after they finish (the passive hotel
      # PNR_AddMultiElements of 85676) register the check instead of waiting for it.
      # Verify them now that the run is over; a failure is written onto the scenario
      # in the reports uploaded below. Instant when no scenario registered one.
      - name: Verify deferred payload checks
        if: always()
        timeout-minutes: 25
        run: node scripts/verify-deferred-payload-checks.js
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

  test-booking:
    name: '[Booking] ${{ matrix.suite_name }}'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout_minutes || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GDS Flights - Booking
          - suite_id: flights-amadeus-booking
            suite_name: Flights Amadeus Booking
            test_path: tests/features/flights/flights_amadeus/flights_amadeus_booking/
          - suite_id: flights-general-booking
            suite_name: Flights General Booking
            test_path: tests/features/flights/flights_general/flights_general_booking/
          - suite_id: flights-galileo-booking
            suite_name: Flights Galileo Booking
            test_path: tests/features/flights/flights_galileo/flights_galileo_booking/
          - suite_id: flights-sabre-booking
            suite_name: Flights Sabre Booking
            test_path: tests/features/flights/flights_sabre/flights_sabre_booking/
          # LCC Flights - Booking
          - suite_id: flights-ypsilon-booking
            suite_name: Flights Ypsilon Booking
            test_path: tests/features/flights/flights_ypsilon/flights_ypsilon_booking/
          - suite_id: flights-travelfusion-booking
            suite_name: Flights Travelfusion Booking
            test_path: tests/features/flights/flights_travelfusion/flights_travelfusion_booking/
          # NDC Flights - Booking
          - suite_id: flights-afkl-ndc-booking
            suite_name: Flights AFKL NDC Booking
            test_path: tests/features/flights/flights_afkl_ndc/flights_afkl_ndc_booking/
          - suite_id: flights-ba-ndc-booking
            suite_name: Flights BA NDC Booking
            test_path: tests/features/flights/flights_ba_ndc/flights_ba_ndc_booking/
          - suite_id: flights-ib-ndc-booking
            suite_name: Flights IB NDC Booking
            test_path: tests/features/flights/flights_ib_ndc/flights_ib_ndc_booking/
          - suite_id: flights-lh-ndc-booking
            suite_name: Flights LH NDC Booking
            test_path: tests/features/flights/flights_lh_ndc/flights_lh_ndc_booking/
          - suite_id: flights-ua-ndc-booking
            suite_name: Flights UA NDC Booking
            test_path: tests/features/flights/flights_ua_ndc/flights_ua_ndc_booking/
          # Hotels - Booking
          # Runs close to the shared 80/90 min limits (measured 76-81 min); given extra headroom to avoid mid-run kills.
          - suite_id: hotels-booking
            suite_name: Hotels Booking
            test_path: tests/features/hotels/hotels_booking/
            job_timeout_minutes: 110
            step_timeout_minutes: 100
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        # ENV secret contains only app config: AUTOMATION_APP_BASEURL, GENERAL_PASSWORD, AUTOMATION_* vars.
        # User emails are written directly in feature files — no USER_* entries needed.
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: ${{ matrix.step_timeout_minutes || 80 }}
        run: npx cucumber-js ${{ matrix.test_path }} --profile ci --parallel 2 --retry 2
        env:
          CI: "true"

      # See the matching step in the non-booking job above.
      - name: Verify deferred payload checks
        if: always()
        timeout-minutes: 25
        run: node scripts/verify-deferred-payload-checks.js
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

  report:
    name: Test Report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test-non-booking, test-booking]
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # Only the JUnit XML and the Cucumber JSON are ever read from all-results/, so
      # screenshots and traces are excluded here - they are the bulk of the bytes and
      # this job never opens them. Fewer, smaller requests also means far less
      # exposure to the artifact service throttling below.
      - name: Download result artifacts
        id: download-1
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true

      # GitHub's artifact service 403s intermittently ("Error from intermediary with
      # HTTP status code 403"), and the download action classes 403 as non-retryable
      # and gives up immediately - so the retry has to happen at the step level.
      # Without it a healthy run reports zero results for every suite.
      - name: Back off before retrying the artifact download
        if: always() && steps.download-1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Download result artifacts (retry)
        id: download-2
        if: always() && steps.download-1.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true

      - name: Back off before the final artifact download attempt
        if: always() && steps.download-2.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Download result artifacts (final attempt)
        id: download-3
        if: always() && steps.download-2.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true

      # Every download step is continue-on-error, so without this the job would sail
      # on and blame the suites for the missing results.
      - name: Record artifact download status
        id: download-status
        if: always()
        shell: bash
        env:
          OUTCOME_1: ${{ steps.download-1.outcome }}
          OUTCOME_2: ${{ steps.download-2.outcome }}
          OUTCOME_3: ${{ steps.download-3.outcome }}
        run: |
          if [ "$OUTCOME_1" = "success" ] || [ "$OUTCOME_2" = "success" ] || [ "$OUTCOME_3" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not download result artifacts after 3 attempts (attempts: $OUTCOME_1, $OUTCOME_2, $OUTCOME_3). The suite artifacts are still attached to this run - re-run this report job alone to publish the report."
          fi

      - name: Download Allure Results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      - name: Download previous Allure history
        if: always()
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: allure-history
          path: previous-history
          workflow: test-suite.yml
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always()
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo " Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo " History copied"
          else
            echo " No previous history found (first run)"
          fi

      - name: Setup Node.js for Allure
        if: always()
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install allure@3

      - name: Debug Allure Results
        if: always()
        shell: bash
        run: |
          echo " Checking allure-results directory..."
          if [ -d "allure-results" ]; then
            file_count=$(find allure-results -type f 2>/dev/null | wc -l)
            echo " Found $file_count file(s) in allure-results/"
            find allure-results -type f 2>/dev/null | head -20 || true
          else
            echo " allure-results/ directory does not exist"
          fi

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            node .github/allure/keep-failure-screenshots.cjs allure-results
            npx allure generate ./allure-results -o allure-report --config .github/allure/allurerc.mjs
            if [ -f "allure-report/index.html" ]; then
              echo " Allure report generated successfully"
            else
              echo " Allure report generation produced no index.html"
            fi
          else
            echo " No Allure result files found  skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1><p>No test jobs produced Allure result files for this run.</p></body></html>" > allure-report/index.html
          fi
          # Single-file report (.github/allure/allurerc.mjs), uploaded unzipped
          # under this name so the summary link downloads one openable file.
          if [ -f "allure-report/index.html" ]; then cp allure-report/index.html allure-report.html; fi

      - name: Generate Cucumber HTML Report
        if: always()
        shell: bash
        run: |
          echo " Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report

          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find all-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) { console.log(' No cucumber JSON files found'); process.exit(0); }

            let merged = [];
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                merged = merged.concat(Array.isArray(data) ? data : [data]);
              } catch(e) { console.log(' Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log(' Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const hasFail = steps.some(s => s.result && s.result.status === 'failed');
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped' || s.result.status === 'undefined');
                if (hasFail) { failed++; ff++; }
                else if (allSkip) { skipped++; fsk++; }
                else { passed++; fp++; }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows }));

            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Cucumber Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1> Cucumber Test Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] +
              ' | Trigger: ' + (process.env.GITHUB_EVENT_NAME || 'unknown') + '</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\"> ' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\"> ' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\"> ' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log(' Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      # archive: false uploads the one HTML file unzipped; the artifact takes
      # the file's name and `name` is ignored.
      - name: Upload Allure Report
        id: allure-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: allure-report.html
          archive: false
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Post Reports Summary
        if: always()
        shell: bash
        env:
          ALLURE_URL: ${{ steps.allure-upload.outputs.artifact-url }}
        run: |
          echo "##  Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              const status = s.failed > 0 ? '🔴 SOME TESTS FAILED' : '🟢 ALL TESTS PASSED';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| 🏷️ **Status** | ' + status + ' |');
              console.log('| 🧪 Total Scenarios | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| 📊 Pass Rate | **' + passRate + '%** |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo " No Cucumber results summary available" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "###  Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | How to View |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "|  **Cucumber HTML** | Download **cucumber-html-report** artifact  open \`index.html\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$ALLURE_URL" ]; then
            echo "| 📊 **Allure Report** | [Download allure-report.html](${ALLURE_URL}) → open it in your browser (screenshots included) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "|  **Allure Report** | Not uploaded for this run |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Matrix | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Non-Booking Suites | \`${{ needs.test-non-booking.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Booking Suites | \`${{ needs.test-booking.result }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Reconcile Expected Suites
        if: always()
        shell: bash
        env:
          DOWNLOAD_OK: ${{ steps.download-status.outputs.ok }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            // If the artifacts never made it onto this runner, all-results/ is empty and
            // every suite would look like it produced nothing. That reads as a total test
            // failure when the suites in fact ran fine and their artifacts are still
            // attached to the run, so say what actually broke instead.
            if (process.env.DOWNLOAD_OK === 'false') {
              const note = ['', '### Suite Reconciliation', '', 'Could not determine suite results: downloading the result artifacts failed (see the download steps above). The suites are NOT known to have failed - their artifacts are still attached to this run. Re-run the report job alone to publish the report.', ''];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, note.join('\n') + '\n');
              console.log('::error::Result artifacts could not be downloaded, so suite results are unknown. Re-run the report job to publish the report.');
              process.exit(1);
            }

            // Must match the suite_id values in the test-non-booking and test-booking matrices above.
            const expectedSuites = [
              'flights-amadeus-non-booking','flights-general-non-booking','flights-galileo-non-booking','flights-sabre-non-booking',
              'flights-ypsilon-non-booking','flights-travelfusion-non-booking',
              'flights-aa-ndc-non-booking','flights-afkl-ndc-non-booking','flights-ba-ndc-non-booking',
              'flights-ib-ndc-non-booking','flights-lh-ndc-non-booking','flights-ua-ndc-non-booking',
              'hotels-non-booking','cars-booking','cars-daily','rails-daily',
              'shell-agent-assistance-and-suggestions','shell-conversation','shell-fop-issues',
              'shell-frequent-programs','shell-joy-search-defaults','shell-manual-quote',
              'shell-multiproducts','shell-per-diem','shell-reference-fields',
              'shell-share-quote-or-itinerary','shell-travel-policy',
              'shell-ui-issues','shell-user-profile',
              'flights-amadeus-booking','flights-general-booking','flights-galileo-booking','flights-sabre-booking',
              'flights-ypsilon-booking','flights-travelfusion-booking',
              'flights-afkl-ndc-booking','flights-ba-ndc-booking','flights-ib-ndc-booking',
              'flights-lh-ndc-booking','flights-ua-ndc-booking','hotels-booking'
            ];

            // A suite uploads its JUnit XML and its Cucumber report as two separate
            // artifacts, and GitHub's FinalizeArtifact call 403s intermittently, so the
            // report can go missing for a suite that ran perfectly well. Fall back to the
            // JUnit artifact before declaring that a suite produced no results at all.
            const junitCounts = (suiteId) => {
              const junitPath = path.join('all-results', suiteId + '-results', 'cucumber-junit.xml');
              if (!fs.existsSync(junitPath)) return null;
              const xml = fs.readFileSync(junitPath, 'utf8');
              const total = xml.split('<testcase').length - 1;
              if (total === 0) return null;
              return { total: total, failed: xml.split('<failure').length - 1, skipped: xml.split('<skipped').length - 1 };
            };

            const missing = [];
            const recovered = [];
            for (const suiteId of expectedSuites) {
              const reportPath = path.join('all-results', suiteId + '-report', 'cucumber-report.json');
              let reason = null;
              if (!fs.existsSync(reportPath)) {
                reason = 'no report artifact found';
              } else {
                const raw = fs.readFileSync(reportPath, 'utf8');
                if (raw.trim().length === 0) {
                  reason = 'empty report file (job likely hit its step timeout mid-run)';
                } else {
                  try {
                    const data = JSON.parse(raw);
                    const features = Array.isArray(data) ? data : [data];
                    const scenarioCount = features.reduce((sum, f) => sum + (f.elements || []).filter(e => e.type === 'scenario').length, 0);
                    if (scenarioCount === 0) reason = 'report contains no scenarios';
                  } catch (e) {
                    reason = 'invalid JSON (' + e.message + ')';
                  }
                }
              }
              if (!reason) continue;
              const junit = junitCounts(suiteId);
              if (junit) recovered.push({ suiteId: suiteId, reason: reason, junit: junit });
              else missing.push({ suiteId: suiteId, reason: reason });
            }

            const lines = ['', '### Suite Reconciliation', ''];
            if (missing.length === 0 && recovered.length === 0) {
              lines.push('All ' + expectedSuites.length + ' expected suites produced results.');
            }
            if (missing.length > 0) {
              lines.push(missing.length + ' of ' + expectedSuites.length + ' expected suites produced NO results - the scenario totals above are UNDERCOUNTED:');
              lines.push('');
              lines.push('| Suite | Reason |');
              lines.push('|-------|--------|');
              for (const m of missing) lines.push('| ' + m.suiteId + ' | ' + m.reason + ' |');
              lines.push('');
            }
            if (recovered.length > 0) {
              const recoveredScenarios = recovered.reduce((sum, r) => sum + r.junit.total, 0);
              lines.push(recovered.length + ' suite(s) ran but lost their Cucumber report artifact - the scenario totals above are missing these ' + recoveredScenarios + ' scenarios, recovered here from JUnit:');
              lines.push('');
              lines.push('| Suite | Report problem | Scenarios | Failed | Skipped |');
              lines.push('|-------|----------------|-----------|--------|---------|');
              for (const r of recovered) lines.push('| ' + r.suiteId + ' | ' + r.reason + ' | ' + r.junit.total + ' | ' + r.junit.failed + ' | ' + r.junit.skipped + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');

            if (recovered.length > 0) {
              console.log('::warning::' + recovered.length + ' suite(s) ran but their Cucumber report artifact is missing or unusable; counts recovered from JUnit: ' + recovered.map(r => r.suiteId).join(', '));
            }
            if (missing.length > 0) {
              console.log('::error::' + missing.length + ' suite(s) produced no results: ' + missing.map(m => m.suiteId).join(', '));
              process.exit(1);
            }
          "

      - name: Parse JUnit Results into Summary
        if: always()
        shell: bash
        run: |
          XML_FILES=$(find all-results -name "cucumber-junit.xml" -type f 2>/dev/null)
          if [ -z "$XML_FILES" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "###  JUnit Test Results" >> $GITHUB_STEP_SUMMARY
            echo " No JUnit XML files found" >> $GITHUB_STEP_SUMMARY
          else
            node -e "
              const fs = require('fs');
              const files = process.argv.slice(1);
              const out = [];
              let totalTests = 0, totalFail = 0, totalSkipped = 0, totalTime = 0;
              const allFailures = [];

              const fileRows = [];
              for (const file of files) {
                const xml = fs.readFileSync(file, 'utf8');
                let fTests = 0, fFail = 0, fSkip = 0, fTime = 0;

                const suiteRegex = /<testsuite\s+([^>]+)>/g;
                let match;
                while ((match = suiteRegex.exec(xml)) !== null) {
                  const attrs = match[1];
                  const get = (n) => { const m = attrs.match(new RegExp(n + '=\"([^\"]*)\"|' + n + \"='([^']*)'\")); return m ? (m[1] || m[2] || '') : ''; };
                  fTests += parseInt(get('tests')) || 0;
                  fFail += (parseInt(get('failures')) || 0) + (parseInt(get('errors')) || 0);
                  fSkip += parseInt(get('skipped')) || 0;
                  fTime += parseFloat(get('time')) || 0;
                }

                const tcRegex = /<testcase\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
                let tc;
                while ((tc = tcRegex.exec(xml)) !== null) {
                  const tcAttrs = tc[1];
                  const tcBody = tc[2] || '';
                  const getName = (n) => { const m = tcAttrs.match(new RegExp(n + '=\"([^\"]*)\"|' + n + \"='([^']*)'\")); return m ? (m[1] || m[2] || '') : ''; };
                  if (tcBody.includes('<failure') || tcBody.includes('<error')) {
                    const tcName = getName('name') || 'Unknown test';
                    const msgMatch = tcBody.match(/message=\"([^\"]*)\"/);
                    const msg = msgMatch ? msgMatch[1].substring(0, 200) : '';
                    allFailures.push({ file: file.replace('all-results/', ''), name: tcName, message: msg });
                  }
                }

                const fPassed = fTests - fFail - fSkip;
                totalTests += fTests; totalFail += fFail; totalSkipped += fSkip; totalTime += fTime;
                const label = file.replace('all-results/', '');
                const passedIcon = fPassed > 0 ? '✅ ' + fPassed : '';
                const failedIcon = fFail > 0 ? '❌ ' + fFail : '';
                fileRows.push('| ' + label + ' | ' + passedIcon + ' | ' + failedIcon + ' | ' + (fSkip || '') + ' | ' + Math.round(fTime) + 's |');
              }

              const totalPassed = totalTests - totalFail - totalSkipped;
              out.push('');
              out.push('###  Test Results');
              out.push('');
              out.push('**' + totalTests + ' tests** — ✅ ' + totalPassed + ' passed  ❌ ' + totalFail + ' failed  ⏭️ ' + totalSkipped + ' skipped');
              out.push('');
              out.push('| Report | Passed | Failed | Skipped | Time |');
              out.push('|--------|--------|--------|---------|------|');
              fileRows.forEach(r => out.push(r));
              out.push('| **Total** | **✅ ' + totalPassed + '** | **❌ ' + totalFail + '** | **⏭️ ' + totalSkipped + '** | **' + Math.round(totalTime) + 's** |');

              if (allFailures.length > 0) {
                out.push('');
                out.push('###  Failed Tests');
                out.push('');
                out.push('| Test | Error | Source |');
                out.push('|------|-------|--------|');
                for (const f of allFailures) {
                  const escapedMsg = f.message.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                  out.push('| ' + f.name.substring(0, 80) + ' | ' + escapedMsg.substring(0, 120) + ' | ' + f.file + ' |');
                }
              }

              console.log(out.join('\n'));
            " $XML_FILES >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo " Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"

            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo " Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo " No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo " No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          # With ~35 suites and 1000+ scenarios, listing every passing test overflows
          # GitHub's 65535-byte check-run limit ("summary exceeded limit ... will be
          # trimmed"). Show only failed suites/tests — that is what needs attention.
          list-suites: failed
          list-tests: failed
          # Preserve v1 behaviour: create the check run only. The job summary is already
          # composed by the custom steps above; v3 would otherwise append a duplicate.
          use-actions-summary: false
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"
