name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC (21:00 Portugal winter / 22:00 Portugal summer)
  workflow_dispatch:

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: json

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Smoke Tests
        id: run-smoke
        timeout-minutes: 15
        run: npx cucumber-js tests/features/smoke/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/cucumber-junit.xml

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: test-results/cucumber-report.json

      - name: Upload Smoke Screenshots
        if: failure() && steps.run-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/screenshots/

  daily-cars-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Cars Tests
        id: run-daily-cars
        timeout-minutes: 25
        run: npx cucumber-js tests/features/cars/daily_cars/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Cars Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Cars Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Cars Screenshots
        if: failure() && steps.run-daily-cars.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-screenshots
          path: test-results/screenshots/

  daily-flights-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Flights Tests
        id: run-daily-flights
        timeout-minutes: 35
        run: npx cucumber-js tests/features/flights/daily_flights/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          AMADEUS_RUI_MENDES_USER: ${{ secrets.AMADEUS_RUI_MENDES_USER }}
          AMADEUS_WITH_GDS_PROFILE: ${{ secrets.AMADEUS_WITH_GDS_PROFILE }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          AMADEUS_LIGHT_TICKETING_USER_ONE_EMAIL: ${{ secrets.AMADEUS_LIGHT_TICKETING_USER_ONE_EMAIL }}
          LUFTHANSA_USER_ONE_EMAIL: ${{ secrets.LUFTHANSA_USER_ONE_EMAIL }}
          AMADEUS_VALUE_HOTEL_JOAO_EMAIL: ${{ secrets.AMADEUS_VALUE_HOTEL_JOAO_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Flights Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Flights Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Flights Screenshots
        if: failure() && steps.run-daily-flights.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-screenshots
          path: test-results/screenshots/

  daily-shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Shell Tests
        id: run-daily-shell
        timeout-minutes: 20
        run: npx cucumber-js tests/features/shell/daily_shell/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          GENERAL_FLOWS_HARRY_POTTER_USER_EMAIL: ${{ secrets.GENERAL_FLOWS_HARRY_POTTER_USER_EMAIL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Shell Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Shell Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Shell Screenshots
        if: failure() && steps.run-daily-shell.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-screenshots
          path: test-results/screenshots/

  daily-hotels-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Hotel Tests
        id: run-daily-hotels
        timeout-minutes: 25
        run: npx cucumber-js tests/features/hotels/daily_hotels/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_VALUE_HOTEL_JOAO_EMAIL: ${{ secrets.AMADEUS_VALUE_HOTEL_JOAO_EMAIL }}
          AMADEUS_VALUE_HOTEL_PAPATINHO_EMAIL: ${{ secrets.AMADEUS_VALUE_HOTEL_PAPATINHO_EMAIL }}
          AMADEUS_RUI_MENDES_USER: ${{ secrets.AMADEUS_RUI_MENDES_USER }}
          AMADEUS_TELDAR_HOTEL_EMAIL: ${{ secrets.AMADEUS_TELDAR_HOTEL_EMAIL }}
          RATEHAWK_USER_ONE_EMAIL: ${{ secrets.RATEHAWK_USER_ONE_EMAIL }}
          GENERAL_HOTEL_PAID_BY_TRAVELER_EMAIL: ${{ secrets.GENERAL_HOTEL_PAID_BY_TRAVELER_EMAIL }}
          GENERAL_HOTEL_PAID_BY_TMC_EMAIL: ${{ secrets.GENERAL_HOTEL_PAID_BY_TMC_EMAIL }}
          EXPEDIA_USER_ONE_EMAIL: ${{ secrets.EXPEDIA_USER_ONE_EMAIL }}
          EXPEDIA_USER_TWO_EMAIL: ${{ secrets.EXPEDIA_USER_TWO_EMAIL }}
          EXPEDIA_USER_THREE_EMAIL: ${{ secrets.EXPEDIA_USER_THREE_EMAIL }}
          EXPEDIA_USER_CO2_EMAIL: ${{ secrets.EXPEDIA_USER_CO2_EMAIL }}
          GENERAL_HOTEL_SHANI_EMAIL: ${{ secrets.GENERAL_HOTEL_SHANI_EMAIL }}
          SABRE_USER_SABRIN_ORLY: ${{ secrets.SABRE_USER_SABRIN_ORLY }}
          EHOTEL_ELI_TEL_EMAIL: ${{ secrets.EHOTEL_ELI_TEL_EMAIL }}
          GENERAL_HOTEL_NO_FOP_EMAIL: ${{ secrets.GENERAL_HOTEL_NO_FOP_EMAIL }}
          PREMIERINN_USER_TWO_EMAIL: ${{ secrets.PREMIERINN_USER_TWO_EMAIL }}
          PREMIERINN_USER_THREE_EMAIL: ${{ secrets.PREMIERINN_USER_THREE_EMAIL }}
          GENERAL_HOTEL_FOP_EMAIL: ${{ secrets.GENERAL_HOTEL_FOP_EMAIL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          BOOKINGCOM_USER_ONE_EMAIL: ${{ secrets.BOOKINGCOM_USER_ONE_EMAIL }}
          BOOKINGCOM_USER_TWO_EMAIL: ${{ secrets.BOOKINGCOM_USER_TWO_EMAIL }}
          BOOKINGCOM_USER_SPECIFIC_EMAIL: ${{ secrets.BOOKINGCOM_USER_SPECIFIC_EMAIL }}
          BOOKINGCOM_USER_DISCOVER_EMAIL: ${{ secrets.BOOKINGCOM_USER_DISCOVER_EMAIL }}
          GENERAL_SHANI_CORP_NL_EMAIL: ${{ secrets.GENERAL_SHANI_CORP_NL_EMAIL }}
          BOOKINGCOM_USER_STRICTION_EMAIL: ${{ secrets.BOOKINGCOM_USER_STRICTION_EMAIL }}
          EXPEDIA_USER_WITHOUT_FOP_EMAIL: ${{ secrets.EXPEDIA_USER_WITHOUT_FOP_EMAIL }}
          GENERAL_HOTEL_CO2_TEL_EMAIL: ${{ secrets.GENERAL_HOTEL_CO2_TEL_EMAIL }}
          AMADEUS_AMY_GADASY_EMAIL: ${{ secrets.AMADEUS_AMY_GADASY_EMAIL }}
          TRAVELODGE_USER_ONE_EMAIL: ${{ secrets.TRAVELODGE_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Hotels Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Hotels Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Hotels Screenshots
        if: failure() && steps.run-daily-hotels.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-screenshots
          path: test-results/screenshots/

  daily-rails-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Rails Tests
        id: run-daily-rails
        timeout-minutes: 25
        run: npx cucumber-js tests/features/rails/daily_rails/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMTRAK_USER_ONE_EMAIL: ${{ secrets.AMTRAK_USER_ONE_EMAIL }}
          EVOLVI_USER_ONE_EMAIL: ${{ secrets.EVOLVI_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Rails Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Rails Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Rails Screenshots
        if: failure() && steps.run-daily-rails.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-screenshots
          path: test-results/screenshots/

  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - smoke-tests
      - daily-cars-tests
      - daily-flights-tests
      - daily-shell-tests
      - daily-hotels-tests
      - daily-rails-tests
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo "📁 Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"
            
            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo "✅ Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "⚠️ No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"