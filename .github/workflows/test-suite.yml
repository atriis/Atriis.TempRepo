name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Smoke Tests
        run: npx playwright test --project=Smoke
      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: test-results/

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Regression Tests
        run: npx playwright test --project=Regression
      - name: Upload Regression Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results/

  summary:
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
      - name: Display Summary
        run: |
          echo "### ✅ Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "![Smoke](https://img.shields.io/badge/Smoke-Completed-blue)" >> $GITHUB_STEP_SUMMARY
          echo "![Regression](https://img.shields.io/badge/Regression-Completed-green)" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts downloaded for dashboard generation." >> $GITHUB_STEP_SUMMARY
