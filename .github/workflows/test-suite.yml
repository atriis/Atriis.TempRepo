
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 19 * * *'  # Daily at 19:00 UTC (19:00 Portugal winter / 20:00 Portugal summer)
  workflow_dispatch:  # Allow manual runs via GitHub UI or `gh workflow run`

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Smoke Tests
        run: npx playwright test --project=Smoke
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # General User
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-playwright-report
          path: playwright-report/

  galileo-car-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Galileo Car Tests
        run: npx playwright test --project=cars:galileo
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # Cars Suppliers
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Galileo Car Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galileo-car-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galileo-car-playwright-report
          path: playwright-report/

  general-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run General Flight Tests
        run: npx playwright test tests/regression/flights/general
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # General User
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload General Flight Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-flight-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-flight-playwright-report
          path: playwright-report/

  lufthansa-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Lufthansa Flight Tests
        run: npx playwright test tests/regression/flights/ndc/lufthansa
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # General User
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.LUFTHANSA_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Lufthansa Flight Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lufthansa-flight-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lufthansa-flight-playwright-report
          path: playwright-report/

  cross-supplier-cars-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Cross-Supplier Cars Tests
        run: npx playwright test tests/regression/cars/cross-supplier --workers=1
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          # General User
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          SUNNY_CARS_USER_ONE_EMAIL: ${{ secrets.SUNNY_CARS_USER_ONE_EMAIL }}
          # General
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Cross-Supplier Cars Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-supplier-cars-results
          path: test-results/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-supplier-cars-playwright-report
          path: playwright-report/

  summary:
    runs-on: ubuntu-latest
    needs: [ smoke-tests, galileo-car-tests, general-flight-tests, lufthansa-flight-tests, cross-supplier-cars-tests ]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Display Summary
        run: |
          echo "### Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "!Smoke" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts downloaded for dashboard generation." >> $GITHUB_STEP_SUMMARY
