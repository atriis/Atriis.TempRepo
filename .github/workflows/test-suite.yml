name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC (21:00 Portugal winter / 22:00 Portugal summer)
  workflow_dispatch:

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Smoke Tests
        run: npx playwright test --project=smoke
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/results.xml

      - name: Upload Smoke Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: playwright-report/

  galileo-car-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Galileo Car Tests
        run: npx playwright test --project=cars:galileo
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Galileo Car Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galileo-car-results
          path: test-results/results.xml
          if-no-files-found: error

      - name: Upload Galileo Car Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galileo-car-playwright-report
          path: playwright-report/

  general-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run General Flight Tests
        run: npx playwright test tests/regression/flights/general
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload General Flight Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-flight-results
          path: test-results/results.xml
          if-no-files-found: error

      - name: Upload General Flight Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-flight-playwright-report
          path: playwright-report/

  lufthansa-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Lufthansa Flight Tests
        run: npx playwright test tests/regression/flights/lufthansa
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          LUFTHANSA_USER_ONE_EMAIL: ${{ secrets.LUFTHANSA_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Lufthansa Flight Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lufthansa-flight-results
          path: test-results/results.xml

      - name: Upload Lufthansa Flight Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lufthansa-flight-playwright-report
          path: playwright-report/

  cross-supplier-cars-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Cross-Supplier Cars Tests
        run: npx playwright test tests/regression/cars/cross-supplier --workers=1
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          SUNNY_CARS_USER_ONE_EMAIL: ${{ secrets.SUNNY_CARS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Cross-Supplier Cars Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-supplier-cars-results
          path: test-results/results.xml

      - name: Upload Cross-Supplier Cars Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-supplier-cars-playwright-report
          path: playwright-report/

  general-hotels-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run General Hotels Tests
        run: npx playwright test tests/regression/hotels/general
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          RATEHAWK_USER_ONE_EMAIL: ${{ secrets.RATEHAWK_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload General Hotels Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-hotels-results
          path: test-results/results.xml

      - name: Upload General Hotels Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-hotels-playwright-report
          path: playwright-report/

  galileo-hotel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Galileo Hotel Tests
        run: npx playwright test tests/regression/hotels/galileo
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Galileo Hotel Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galileo-hotel-results
          path: test-results/results.xml
          if-no-files-found: error

      - name: Upload Galileo Hotel Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galileo-hotel-playwright-report
          path: playwright-report/

  manual-quote-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Manual Quote Tests
        run: npx playwright test tests/regression/manual-quote
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Manual Quote Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-quote-results
          path: test-results/results.xml

      - name: Upload Manual Quote Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-quote-playwright-report
          path: playwright-report/

  additional-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Travel Policy & Credit Card FOP Regression Tests
        run: npx playwright test tests/regression/travel-policy/can-see-travel-policy-for-number-of-passengers.spec.js tests/regression/flights/amadeus/general-flight-add-to-cart-with-payment.spec.js
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          TRAVEL_POLICY_USER_ONE_EMAIL: ${{ secrets.TRAVEL_POLICY_USER_ONE_EMAIL }}
          AMADEUS_USER_THREE_EMAIL: ${{ secrets.AMADEUS_USER_THREE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Travel Policy & Credit Card FOP Regression Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-policy-credit-card-fop-regression-results
          path: test-results/results.xml

      - name: Upload Travel Policy & Credit Card FOP Regression Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-policy-credit-card-fop-regression-playwright-report
          path: playwright-report/

  daily-car-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Daily Car Tests
        run: npx cucumber-js tests/features/cars/daily_cars/
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Car Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-car-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Car Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-car-report
          path: test-results/cucumber-report.json

  daily-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Daily Flight Tests
        run: npx cucumber-js tests/features/flights/daily_flights/
        env:
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Flight Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flight-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Flight Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flight-report
          path: test-results/cucumber-report.json

  summary:
    runs-on: ubuntu-latest
    needs:
      - smoke-tests
      - galileo-car-tests
      - general-flight-tests
      - lufthansa-flight-tests
      - cross-supplier-cars-tests
      - general-hotels-tests
      - galileo-hotel-tests
      - manual-quote-tests
      - additional-regression-tests
      - daily-car-tests
      - daily-flight-tests
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Publish All Tests (One Report)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Atriis Test Automation Suite
          reporter: java-junit
          path: |
            all-results/**/results.xml
            all-results/**/cucumber-junit.xml
          fail-on-error: false