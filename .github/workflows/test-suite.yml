  summary:
    runs-on: ubuntu-latest
    needs: [ smoke-tests ]  # removed regression-tests from dependencies
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Display Summary
        run: |
          echo "### Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "!Smoke" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts downloaded for dashboard generation." >> $GITHUB_STEP_SUMMARY
