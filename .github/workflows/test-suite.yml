name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC (21:00 Portugal winter / 22:00 Portugal summer)
  workflow_dispatch:

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: json

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Smoke Tests
        run: npx cucumber-js tests/features/smoke/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/cucumber-junit.xml

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: test-results/cucumber-report.json

  daily-car-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Daily Car Tests
        run: npx cucumber-js tests/features/cars/daily_cars/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Car Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-car-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Car Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-car-report
          path: test-results/cucumber-report.json

  daily-flight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Daily Flight Tests
        run: npx cucumber-js tests/features/flights/daily_flights/ --parallel 3
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
          AMADEUS_RUI_MENDES_USER: ${{ secrets.AMADEUS_RUI_MENDES_USER }}
          AMADEUS_WITH_GDS_PROFILE: ${{ secrets.AMADEUS_WITH_GDS_PROFILE }}
          GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
          SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
          AMADEUS_LIGHT_TICKETING_USER_ONE_EMAIL: ${{ secrets.AMADEUS_LIGHT_TICKETING_USER_ONE_EMAIL }}
          LUFTHANSA_USER_ONE_EMAIL: ${{ secrets.LUFTHANSA_USER_ONE_EMAIL }}
          AMADEUS_VALUE_HOTEL_JOAO_EMAIL: ${{ secrets.AMADEUS_VALUE_HOTEL_JOAO_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Flight Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flight-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Flight Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flight-report
          path: test-results/cucumber-report.json

  daily-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Daily Shell Tests
        run: npx cucumber-js tests/features/shell/daily_shell/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          GENERAL_FLOWS_HARRY_POTTER_USER_EMAIL: ${{ secrets.GENERAL_FLOWS_HARRY_POTTER_USER_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Shell Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Shell Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-report
          path: test-results/cucumber-report.json

  daily-hotel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Daily Hotel Tests
        run: npx cucumber-js tests/features/hotels/daily_hotels/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMADEUS_VALUE_HOTEL_JOAO_EMAIL: ${{ secrets.AMADEUS_VALUE_HOTEL_JOAO_EMAIL }}
          EXPEDIA_USER_ONE_EMAIL: ${{ secrets.EXPEDIA_USER_ONE_EMAIL }}
          EXPEDIA_USER_TWO_EMAIL: ${{ secrets.EXPEDIA_USER_TWO_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Hotel Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotel-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Hotel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotel-report
          path: test-results/cucumber-report.json

  daily-rails-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results

      - name: Run Daily Rails Tests
        run: npx cucumber-js tests/features/rails/daily_rails/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "2000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          AMTRAK_USER_ONE_EMAIL: ${{ secrets.AMTRAK_USER_ONE_EMAIL }}
          EVOLVI_USER_ONE_EMAIL: ${{ secrets.EVOLVI_USER_ONE_EMAIL }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Rails Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Rails Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-report
          path: test-results/cucumber-report.json

  summary:
    runs-on: ubuntu-latest
    needs:
      - smoke-tests
      - daily-car-tests
      - daily-flight-tests
      - daily-shell-tests
      - daily-hotel-tests
      - daily-rails-tests
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo "📁 Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"
            
            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo "✅ Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "⚠️ No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"