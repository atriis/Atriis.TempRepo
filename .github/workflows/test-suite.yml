name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC (21:00 Portugal winter / 22:00 Portugal summer)
  workflow_dispatch:

# Structured logging configuration for all jobs
env:
  LOG_LEVEL: info
  LOG_FORMAT: json

# Make scheduled runs able to publish check runs (dorny/test-reporter)
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Smoke Tests
        id: run-smoke
        timeout-minutes: 15
        run: npx cucumber-js tests/features/smoke/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Smoke Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/cucumber-junit.xml

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: test-results/cucumber-report.json

      - name: Upload Smoke Screenshots
        if: failure() && steps.run-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/screenshots/

  daily-cars-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Cars Tests
        id: run-daily-cars
        timeout-minutes: 25
        run: npx cucumber-js tests/features/cars/daily_cars/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Cars Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Cars Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Cars Screenshots
        if: failure() && steps.run-daily-cars.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-cars-screenshots
          path: test-results/screenshots/

  daily-flights-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Flights Tests
        id: run-daily-flights
        timeout-minutes: 35
        run: npx cucumber-js tests/features/flights/daily_flights/ --parallel 2
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_RUIMENDES: ${{ secrets.USER_RUIMENDES }}
          USER_AMADEUS_GDS: ${{ secrets.USER_AMADEUS_GDS }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_LUCAS: ${{ secrets.USER_LUCAS }}
          USER_CLARA: ${{ secrets.USER_CLARA }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Flights Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Flights Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Flights Screenshots
        if: failure() && steps.run-daily-flights.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-flights-screenshots
          path: test-results/screenshots/

  daily-shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Shell Tests
        id: run-daily-shell
        timeout-minutes: 20
        run: npx cucumber-js tests/features/shell/daily_shell/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_HARRYPOTTER: ${{ secrets.USER_HARRYPOTTER }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Shell Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Shell Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Shell Screenshots
        if: failure() && steps.run-daily-shell.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-shell-screenshots
          path: test-results/screenshots/

  daily-hotels-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Hotel Tests
        id: run-daily-hotels
        timeout-minutes: 60
        run: npx cucumber-js tests/features/hotels/daily_hotels/ --parallel 4
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_RUIMARIANO: ${{ secrets.USER_RUIMARIANO }}
          USER_RUIMENDES: ${{ secrets.USER_RUIMENDES }}
          USER_HELENATEREZA: ${{ secrets.USER_HELENATEREZA }}
          USER_PCW: ${{ secrets.USER_PCW }}
          USER_BRUNA_TELDAR: ${{ secrets.USER_BRUNA_TELDAR }}
          USER_HCORPO: ${{ secrets.USER_HCORPO }}
          USER_AMY: ${{ secrets.USER_AMY }}
          USER_JOAO: ${{ secrets.USER_JOAO }}
          USER_SABRIN: ${{ secrets.USER_SABRIN }}
          USER_ROBSONCRUZ: ${{ secrets.USER_ROBSONCRUZ }}
          USER_BEATRIZ: ${{ secrets.USER_BEATRIZ }}
          USER_LIDI: ${{ secrets.USER_LIDI }}
          USER_EXPEDIA: ${{ secrets.USER_EXPEDIA }}
          USER_NATALIA: ${{ secrets.USER_NATALIA }}
          USER_ROBBYSILVA: ${{ secrets.USER_ROBBYSILVA }}
          USER_BRUNA_CO2: ${{ secrets.USER_BRUNA_CO2 }}
          USER_EDI: ${{ secrets.USER_EDI }}
          USER_CINTIA: ${{ secrets.USER_CINTIA }}
          USER_ALEXANDRE: ${{ secrets.USER_ALEXANDRE }}
          USER_BRUNANINA: ${{ secrets.USER_BRUNANINA }}
          USER_DISCOVER: ${{ secrets.USER_DISCOVER }}
          USER_STRICTION: ${{ secrets.USER_STRICTION }}
          USER_ELI: ${{ secrets.USER_ELI }}
          USER_PLUTO: ${{ secrets.USER_PLUTO }}
          USER_BRUNA_PREMIER: ${{ secrets.USER_BRUNA_PREMIER }}
          USER_PREMIER: ${{ secrets.USER_PREMIER }}
          USER_SHANI: ${{ secrets.USER_SHANI }}
          USER_FELIPE: ${{ secrets.USER_FELIPE }}
          USER_ZAC: ${{ secrets.USER_ZAC }}
          USER_LILY: ${{ secrets.USER_LILY }}
          USER_CALEB: ${{ secrets.USER_CALEB }}
          USER_TEL: ${{ secrets.USER_TEL }}
          USER_VERED: ${{ secrets.USER_VERED }}
          USER_MAGALIMONICA: ${{ secrets.USER_MAGALIMONICA }}
          USER_INESSA: ${{ secrets.USER_INESSA }}
          USER_REBECCACARDIN: ${{ secrets.USER_REBECCACARDIN }}
          USER_EDWARDCULLEN: ${{ secrets.USER_EDWARDCULLEN }}
          USER_CANISSO: ${{ secrets.USER_CANISSO }}
          USER_SAMMAU: ${{ secrets.USER_SAMMAU }}
          USER_CAROLDYNAMICS: ${{ secrets.USER_CAROLDYNAMICS }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Hotels Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Hotels Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Hotels Screenshots
        if: failure() && steps.run-daily-hotels.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-hotels-screenshots
          path: test-results/screenshots/

  daily-rails-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: mkdir -p test-results test-results/screenshots

      - name: Run Daily Rails Tests
        id: run-daily-rails
        timeout-minutes: 25
        run: npx cucumber-js tests/features/rails/daily_rails/
        env:
          CI: "true"
          RETRY_COUNT: "2"
          RETRY_DELAY: "3000"
          AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
          USER_MARCOLUIS: ${{ secrets.USER_MARCOLUIS }}
          USER_JIM: ${{ secrets.USER_JIM }}
          GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

      - name: Upload Daily Rails Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-results
          path: test-results/cucumber-junit.xml

      - name: Upload Daily Rails Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-report
          path: test-results/cucumber-report.json

      - name: Upload Daily Rails Screenshots
        if: failure() && steps.run-daily-rails.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-rails-screenshots
          path: test-results/screenshots/

  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - smoke-tests
      - daily-cars-tests
      - daily-flights-tests
      - daily-shell-tests
      - daily-hotels-tests
      - daily-rails-tests
    if: always()

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results
        continue-on-error: true

      - name: Check for test results
        if: always()
        id: check-results
        shell: bash
        run: |
          echo "📁 Checking for test results..."
          if [ -d "all-results" ]; then
            echo "Directory structure:"
            ls -la all-results/ || echo "Failed to list all-results"
            
            xml_count=$(find all-results -name "*.xml" -type f 2>/dev/null | wc -l)
            if [ "$xml_count" -gt 0 ]; then
              echo "found=true" >> $GITHUB_OUTPUT
              echo "✅ Found $xml_count test result file(s):"
              find all-results -name "*.xml" -type f 2>/dev/null | sed 's/^/  - /'
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "⚠️ No test result XML files found in artifacts"
              echo "Contents of all-results:"
              find all-results -type f 2>/dev/null | head -20 || echo "No files found"
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No artifacts directory found (all tests may have failed early)"
          fi

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Report No Results Found
        if: always() && steps.check-results.outputs.found == 'false'
        run: |
          echo "::warning::No test results found to publish. This typically means:"
          echo "  - Tests failed during setup (before generating XML files)"
          echo "  - Tests crashed or timed out early"
          echo "  - Check individual job logs for details"