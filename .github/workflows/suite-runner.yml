name: Domain Suite (reusable)

# Reusable engine behind the four domain suites (Flights, Hotels, Shell,
# Transportation). A thin caller passes in the domain name, its matrix of suite
# legs, and the list of expected suite_ids; this workflow then runs two jobs:
#
#   test   - the matrix of cucumber runs (per-leg parallelism/retry/timeout).
#            Transient flakes are absorbed in-run by cucumber's --retry; a
#            scenario is only reported failed if it fails EVERY attempt. There
#            is no rerun job inside this run (removed in 66afd9a1: it ran
#            minutes later, in the same bad staging window, and risked the
#            run's own timeout). The nightly's failures are instead rerun as
#            separate runs once all four domains are done — see
#            rerun-nightly-gate.yml.
#   report - one per-domain report (Allure + Cucumber HTML + dorny check-run +
#            reconciliation) built from THIS run's artifacts only; the job
#            summary lists every failed scenario with its error
#
# Keeping the logic here means a fix or tweak lands once, not four times.

on:
  workflow_call:
    inputs:
      domain:
        description: Human-readable domain label used in job names (e.g. "Flights").
        required: true
        type: string
      matrix:
        description: JSON string with an `include:` array of suite legs.
        required: true
        type: string
      expected-suites:
        description: Whitespace-separated suite_id list, for undercount reconciliation.
        required: true
        type: string
      history-workflow:
        description: Caller workflow filename (e.g. "suite-flights.yml"), for Allure trend history.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

jobs:
  test:
    name: '[${{ inputs.domain }}] ${{ matrix.suite_name }}'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-test-env
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        # Lower parallelism than the legacy Test Suite (contention is a top flake
        # source) and --retry 1 (the run plus one rerun) for stability.
        #
        # Optional `shard: "<i>/<n>"` splits one test_path across n matrix legs
        # (cucumber keeps pickle i, i+n, i+2n… of the path's full pickle list, so
        # the legs are a clean partition). Use it when a single directory can no
        # longer finish inside step_timeout_minutes: raising parallel instead
        # would bring back the contention flakes this suite was built to avoid,
        # and a step timeout is not a partial result — cucumber writes its JSON
        # and JUnit formatters only at the very end, so a killed leg uploads an
        # EMPTY report and every one of its scenarios silently disappears from
        # the domain totals. Legs without this key run the whole path.
        run: npx cucumber-js ${{ matrix.test_path }} --profile ci --parallel ${{ matrix.parallel }} --retry ${{ matrix.retry }}${{ matrix.shard && format(' --shard {0}', matrix.shard) || '' }}
        env:
          CI: "true"

      # Scenarios that assert a call made minutes after they finish (the passive hotel
      # PNR_AddMultiElements of 85676) register the check instead of waiting for it.
      # Verify them now that the run is over; a failure is written onto the scenario
      # in the reports uploaded below. Instant when no scenario registered one.
      - name: Verify deferred payload checks
        if: always()
        timeout-minutes: 25
        run: node scripts/verify-deferred-payload-checks.js
        env:
          CI: "true"

      # Every scenario of this job with the trip number(s) it booked, passed or
      # failed, on the job's own summary page. After the deferred verifier, which
      # can still turn a pass into a failure.
      - name: Post ${{ matrix.suite_name }} trip numbers
        if: always()
        run: node scripts/summarize-scenario-trips.js
        env:
          SUMMARY_TITLE: '[${{ inputs.domain }}] ${{ matrix.suite_name }} — trip numbers'

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-traces
          path: test-results/traces/
          if-no-files-found: ignore

  report:
    name: '[${{ inputs.domain }}] Report'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    # Report whenever the matrix actually ran (pass or fail). Skip only if the
    # matrix itself was skipped/cancelled (e.g. the run was cancelled).
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # Only the JUnit XML and the Cucumber JSON are ever read from all-results/,
      # so screenshots and traces are excluded here: on a full domain run they are
      # ~50 artifacts and ~245MB of downloads this job never opens. Fewer, smaller
      # requests also means far less exposure to the artifact service throttling
      # below. The pattern still matches *-allure-results, which is harmless.
      - name: Download result artifacts
        id: download-1
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true

      # GitHub's artifact service 403s intermittently ("Error from intermediary with
      # HTTP status code 403"), and the download action classes 403 as non-retryable
      # and gives up immediately -- so the retry has to happen at the step level.
      # Without it a healthy run reports zero results for every suite.
      - name: Back off before retrying the artifact download
        if: always() && steps.download-1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Download result artifacts (retry)
        id: download-2
        if: always() && steps.download-1.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true

      - name: Back off before the final artifact download attempt
        if: always() && steps.download-2.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Download result artifacts (final attempt)
        id: download-3
        if: always() && steps.download-2.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-{results,report}'
          path: all-results
        continue-on-error: true
        
      - name: Upload results to QEOS
        if: always() && vars.QEOS_URL != ''
        uses: carneiru/QA-Vision-Platform/collector-action@collector-v0.4.1
        with:
          url: ${{ vars.QEOS_URL }}
          patterns: all-results/**/cucumber-report.json
        env:
          QEOS_API_KEY: ${{ secrets.QEOS_API_KEY }}
          
      # Every download step is continue-on-error, so without this the job would
      # sail on and blame the suites for the missing results. Record whether any
      # attempt actually landed, so Reconcile can tell "the suites produced
      # nothing" apart from "this job could not fetch what they produced".
      - name: Record artifact download status
        id: download-status
        if: always()
        shell: bash
        env:
          OUTCOME_1: ${{ steps.download-1.outcome }}
          OUTCOME_2: ${{ steps.download-2.outcome }}
          OUTCOME_3: ${{ steps.download-3.outcome }}
        run: |
          if [ "$OUTCOME_1" = "success" ] || [ "$OUTCOME_2" = "success" ] || [ "$OUTCOME_3" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not download result artifacts after 3 attempts (attempts: $OUTCOME_1, $OUTCOME_2, $OUTCOME_3). The suite artifacts are still attached to this run - re-run this Report job alone to publish the report."
          fi

      - name: Download Allure Results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      # Per-domain Allure trend history — scoped to this caller workflow so each
      # domain keeps its own trend line.
      - name: Download previous Allure history
        if: always()
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: allure-history
          path: previous-history
          workflow: ${{ inputs.history-workflow }}
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always()
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo "Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo "History copied"
          else
            echo "No previous history found (first run)"
          fi

      - name: Setup Node.js for Allure
        if: always()
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install allure@3

      # Single-file mode (see .github/allure/allurerc.mjs): screenshots and data
      # are inlined into index.html, which is then copied to a domain-named file
      # and uploaded unzipped, so the summary link downloads a report that opens
      # straight from disk.
      - name: Generate Allure Report
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            node .github/allure/keep-failure-screenshots.cjs allure-results
            npx allure generate ./allure-results -o allure-report --config .github/allure/allurerc.mjs --report-name "${DOMAIN} Test Report"
            [ -f "allure-report/index.html" ] && echo "Allure report generated successfully" || echo "Allure report produced no index.html"
          else
            echo "No Allure result files found — skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1></body></html>" > allure-report/index.html
          fi
          slug=$(echo "$DOMAIN" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-')
          if [ -f "allure-report/index.html" ]; then cp allure-report/index.html "allure-report-${slug}.html"; fi
          echo "ALLURE_REPORT_FILE=allure-report-${slug}.html" >> "$GITHUB_ENV"

      - name: Generate Cucumber HTML Report
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          EXPECTED_SUITES: ${{ inputs.expected-suites }}
        run: |
          echo "Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find all-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);
            if (files.length === 0) { console.log('No cucumber JSON files found'); process.exit(0); }
            let merged = [];
            // Only expected suite reports feed the domain numbers — filter out
            // any non-suite report a broad artifact download might pull in.
            const expected = new Set((process.env.EXPECTED_SUITES || '').split(/\s+/).filter(Boolean));
            for (const file of files) {
              const suiteMatch = file.match(/all-results\/([^/]+)-report\//);
              const suiteId = suiteMatch ? suiteMatch[1] : '';
              if (expected.size > 0 && !expected.has(suiteId)) { console.log('Skipping non-suite report: ' + file); continue; }
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                for (const feature of (Array.isArray(data) ? data : [data])) {
                  feature.suiteId = suiteId;
                  merged.push(feature);
                }
              } catch(e) { console.log('Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log('Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            const failedScenarios = [];
            // Every passed scenario, with any trip number it booked (— if none)
            // so real bookings can be verified/cancelled after the run.
            const passedScenarios = [];
            // pending/undefined/ambiguous fail the cucumber run (strict mode)
            // and land in rerun.txt + JUnit failures — count them as failed
            // here too, or the summary over-reports passes.
            const FAIL_STATUSES = { failed: 1, ambiguous: 1, pending: 1, undefined: 1 };
            // Trip numbers are attached by the After hook as a 'TRIP_IDS:...'
            // text embedding (see tests/support/hooks.js). Scan a scenario's
            // step embeddings for that marker; text attachments come through raw
            // while some are base64-encoded, so try both. Returns 'a, b' or ''.
            const extractTripIds = (el) => {
              const ids = new Set();
              for (const step of (el.steps || [])) {
                for (const emb of (step.embeddings || [])) {
                  if (!emb || !emb.data) continue;
                  const mt = emb.mime_type || emb.media_type || '';
                  if (mt && mt.indexOf('text') === -1 && mt.indexOf('json') === -1) continue;
                  let text = String(emb.data);
                  if (text.indexOf('TRIP_IDS:') === -1) {
                    try { text = Buffer.from(emb.data, 'base64').toString('utf8'); } catch (e) { /* not base64 */ }
                  }
                  const m = text.match(/TRIP_IDS:([0-9,\s]+)/);
                  if (m) m[1].split(',').map(s => s.trim()).filter(Boolean).forEach(id => ids.add(id));
                }
              }
              return [...ids].join(', ');
            };
            // A scenario abandoned by a known supplier booking error returns
            // 'pending', and a pending step carries no error_message — so the
            // table could only ever say 'pending step: And I hold the trip'.
            // The step attaches the supplier's own words as a 'BOOKING_ERROR:'
            // text embedding (BookingErrorHandler.describeSkippedBooking); read it
            // back the same way as TRIP_IDS so the real reason reaches the table.
            const extractBookingError = (el) => {
              for (const step of (el.steps || [])) {
                for (const emb of (step.embeddings || [])) {
                  if (!emb || !emb.data) continue;
                  const mt = emb.mime_type || emb.media_type || '';
                  if (mt && mt.indexOf('text') === -1 && mt.indexOf('json') === -1) continue;
                  let text = String(emb.data);
                  if (text.indexOf('BOOKING_ERROR:') === -1) {
                    try { text = Buffer.from(emb.data, 'base64').toString('utf8'); } catch (e) { /* not base64 */ }
                  }
                  const m = text.match(/BOOKING_ERROR:([\s\S]+)/);
                  if (m) return m[1].split('\n')[0].trim();
                }
              }
              return '';
            };
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const failStep = steps.find(s => s.result && FAIL_STATUSES[s.result.status]);
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped');
                if (failStep) {
                  failed++; ff++;
                  const rawErr = ((failStep.result && failStep.result.error_message) || '').split('\n')[0];
                  const bookingErr = extractBookingError(el);
                  failedScenarios.push({
                    suite: feature.suiteId || '',
                    feature: name,
                    scenario: el.name || '',
                    location: (feature.uri || '') + ':' + (el.line || ''),
                    tripNumbers: extractTripIds(el),
                    error: (rawErr || bookingErr || (failStep.result.status + ' step: ' + ((failStep.keyword || '') + (failStep.name || '')).trim())).slice(0, 300)
                  });
                }
                else if (allSkip) { skipped++; fsk++; }
                else {
                  passed++; fp++;
                  passedScenarios.push({
                    suite: feature.suiteId || '',
                    feature: name,
                    scenario: el.name || '',
                    location: (feature.uri || '') + ':' + (el.line || ''),
                    tripNumbers: extractTripIds(el)
                  });
                }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows, failedScenarios, passedScenarios }));

            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const domain = process.env.DOMAIN || 'Domain';
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + domain + ' Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1>' + domain + ' Test Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] + '</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\">' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\">' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\">' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI — ' + domain + '</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log('Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      # archive: false uploads the one HTML file unzipped; the artifact takes
      # the file's name and `name` is ignored.
      - name: Upload Allure Report
        id: allure-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: ${{ env.ALLURE_REPORT_FILE || 'allure-report/index.html' }}
          archive: false
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Post Reports Summary
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          ALLURE_URL: ${{ steps.allure-upload.outputs.artifact-url }}
        run: |
          echo "## ${DOMAIN} — Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ALLURE_URL" ]; then
            echo "📊 **[Download Allure report](${ALLURE_URL})** — one HTML file with screenshots; open it in your browser." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              const status = s.failed > 0 ? '🔴 SOME TESTS FAILED' : '🟢 ALL TESTS PASSED';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| 🏷️ **Status** | ' + status + ' |');
              console.log('| 🧪 Total Scenarios | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| 📊 Pass Rate | **' + passRate + '%** |');
              // Markdown-table-safe cell text: pipes/angle brackets swapped for
              // lookalikes so a scenario name can never break the table layout.
              const esc = t => String(t || '').slice(0, 220).split('\n').join(' ').split('|').join('¦').split('<').join('&lt;').split('>').join('&gt;');
              const failedList = s.failedScenarios || [];
              if (failedList.length > 0) {
                console.log('');
                console.log('### ❌ Failed Scenarios (' + failedList.length + ')');
                console.log('');
                console.log('| Suite | Scenario | Location | Trip # | Error (last attempt) |');
                console.log('|-------|----------|----------|--------|----------------------|');
                const MAX_ROWS = 100;
                for (const f of failedList.slice(0, MAX_ROWS)) {
                  console.log('| ' + esc(f.suite) + ' | ' + esc(f.scenario) + ' | ' + esc(f.location) + ' | ' + esc(f.tripNumbers || '—') + ' | ' + esc(f.error) + ' |');
                }
                if (failedList.length > MAX_ROWS) {
                  console.log('');
                  console.log('…and ' + (failedList.length - MAX_ROWS) + ' more — download the cucumber-html-report artifact for the full list.');
                }
              }
              // All passed scenarios, with any trip number booked (— if none)
              // so real bookings can be verified/cancelled after the run.
              const passedList = s.passedScenarios || [];
              if (passedList.length > 0) {
                console.log('');
                console.log('### ✅ Passed Scenarios (' + passedList.length + ')');
                console.log('');
                console.log('| Suite | Scenario | Location | Trip # |');
                console.log('|-------|----------|----------|--------|');
                const MAX_PASS_ROWS = 200;
                for (const p of passedList.slice(0, MAX_PASS_ROWS)) {
                  console.log('| ' + esc(p.suite) + ' | ' + esc(p.scenario) + ' | ' + esc(p.location) + ' | ' + esc(p.tripNumbers || '—') + ' |');
                }
                if (passedList.length > MAX_PASS_ROWS) {
                  console.log('');
                  console.log('…and ' + (passedList.length - MAX_PASS_ROWS) + ' more — download the cucumber-html-report artifact for the full list.');
                }
              }
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Cucumber results summary available" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile Expected Suites
        if: always()
        shell: bash
        env:
          EXPECTED_SUITES: ${{ inputs.expected-suites }}
          DOWNLOAD_OK: ${{ steps.download-status.outputs.ok }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const expectedSuites = (process.env.EXPECTED_SUITES || '').split(/\s+/).filter(Boolean);
            // If the artifacts never made it onto this runner, all-results/ is empty and
            // every suite would look like it produced nothing. That reads as a total test
            // failure when the suites in fact ran fine and their artifacts are still
            // attached to the run, so say what actually broke instead.
            if (process.env.DOWNLOAD_OK === 'false') {
              const note = ['', '### Suite Reconciliation', '', 'Could not determine suite results: downloading the result artifacts failed (see the download steps above). The suites are NOT known to have failed - their artifacts are still attached to this run. Re-run the Report job alone to publish the report.', ''];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, note.join('\n') + '\n');
              console.log('::error::Result artifacts could not be downloaded, so suite results are unknown. Re-run the Report job to publish the report.');
              process.exit(1);
            }
            // A suite uploads its JUnit XML and its Cucumber report as two separate
            // artifacts, and GitHub's FinalizeArtifact call 403s intermittently, so the
            // report can go missing for a suite that ran perfectly well. Fall back to the
            // JUnit artifact before declaring that a suite produced no results at all.
            const junitCounts = (suiteId) => {
              const junitPath = path.join('all-results', suiteId + '-results', 'cucumber-junit.xml');
              if (!fs.existsSync(junitPath)) return null;
              const xml = fs.readFileSync(junitPath, 'utf8');
              const total = xml.split('<testcase').length - 1;
              if (total === 0) return null;
              return { total: total, failed: xml.split('<failure').length - 1, skipped: xml.split('<skipped').length - 1 };
            };
            const missing = [];
            const recovered = [];
            for (const suiteId of expectedSuites) {
              const reportPath = path.join('all-results', suiteId + '-report', 'cucumber-report.json');
              let reason = null;
              if (!fs.existsSync(reportPath)) {
                reason = 'no report artifact found';
              } else {
                const raw = fs.readFileSync(reportPath, 'utf8');
                if (raw.trim().length === 0) {
                  reason = 'empty report file (job likely hit its step timeout mid-run)';
                } else {
                  try {
                    const data = JSON.parse(raw);
                    const features = Array.isArray(data) ? data : [data];
                    const scenarioCount = features.reduce((sum, f) => sum + (f.elements || []).filter(e => e.type === 'scenario').length, 0);
                    if (scenarioCount === 0) reason = 'report contains no scenarios';
                  } catch (e) { reason = 'invalid JSON (' + e.message + ')'; }
                }
              }
              if (!reason) continue;
              const junit = junitCounts(suiteId);
              if (junit) recovered.push({ suiteId: suiteId, reason: reason, junit: junit });
              else missing.push({ suiteId: suiteId, reason: reason });
            }
            const lines = ['', '### Suite Reconciliation', ''];
            if (missing.length === 0 && recovered.length === 0) {
              lines.push('All ' + expectedSuites.length + ' expected suites produced results.');
            }
            if (missing.length > 0) {
              lines.push(missing.length + ' of ' + expectedSuites.length + ' expected suites produced NO results — scenario totals above are UNDERCOUNTED:');
              lines.push('');
              lines.push('| Suite | Reason |');
              lines.push('|-------|--------|');
              for (const m of missing) lines.push('| ' + m.suiteId + ' | ' + m.reason + ' |');
              lines.push('');
            }
            if (recovered.length > 0) {
              const recoveredScenarios = recovered.reduce((sum, r) => sum + r.junit.total, 0);
              lines.push(recovered.length + ' suite(s) ran but lost their Cucumber report artifact — the scenario totals above are missing these ' + recoveredScenarios + ' scenarios, recovered here from JUnit:');
              lines.push('');
              lines.push('| Suite | Report problem | Scenarios | Failed | Skipped |');
              lines.push('|-------|----------------|-----------|--------|---------|');
              for (const r of recovered) lines.push('| ' + r.suiteId + ' | ' + r.reason + ' | ' + r.junit.total + ' | ' + r.junit.failed + ' | ' + r.junit.skipped + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            if (recovered.length > 0) {
              console.log('::warning::' + recovered.length + ' suite(s) ran but their Cucumber report artifact is missing or unusable; counts recovered from JUnit: ' + recovered.map(r => r.suiteId).join(', '));
            }
            if (missing.length > 0) {
              console.log('::error::' + missing.length + ' suite(s) produced no results: ' + missing.map(m => m.suiteId).join(', '));
              process.exit(1);
            }
          "

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: '${{ inputs.domain }} Tests - Run ${{ github.run_number }}'
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          list-suites: failed
          list-tests: failed
          # Render dorny's rich pass/fail report (shield badge + per-suite table
          # + expandable failed tests) directly in this run's Summary tab, so the
          # "Cucumber Tests" report is visible without opening the separate
          # check-run. The custom "Post Reports Summary" / "Reconcile" steps above
          # stay — they add the failed-scenario error list and undercount
          # reconciliation that dorny does not provide, so the two complement
          # rather than duplicate each other.
          use-actions-summary: true
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true
