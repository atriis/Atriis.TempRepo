name: Domain Suite (reusable)

# Reusable engine behind the four domain suites (Flights, Hotels, Shell,
# Transportation). A thin caller passes in the domain name, its matrix of suite
# legs, and the list of expected suite_ids; this workflow then runs two jobs:
#
#   test   - the matrix of cucumber runs (per-leg parallelism/retry/timeout).
#            Transient flakes are absorbed in-run by cucumber's --retry; a
#            scenario is only reported failed if it fails EVERY attempt. There
#            is no separate cross-job rerun — see the git history for why it was
#            removed (marginal value on top of --retry, and a self-timeout risk).
#   report - one per-domain report (Allure + Cucumber HTML + dorny check-run +
#            reconciliation) built from THIS run's artifacts only; the job
#            summary lists every failed scenario with its error
#
# Keeping the logic here means a fix or tweak lands once, not four times.

on:
  workflow_call:
    inputs:
      domain:
        description: Human-readable domain label used in job names (e.g. "Flights").
        required: true
        type: string
      matrix:
        description: JSON string with an `include:` array of suite legs.
        required: true
        type: string
      expected-suites:
        description: Whitespace-separated suite_id list, for undercount reconciliation.
        required: true
        type: string
      history-workflow:
        description: Caller workflow filename (e.g. "suite-flights.yml"), for Allure trend history.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: write

env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

jobs:
  test:
    name: '[${{ inputs.domain }}] ${{ matrix.suite_name }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-test-env
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Run ${{ matrix.suite_name }} Tests
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        # Lower parallelism than the legacy Test Suite (contention is a top flake
        # source) and --retry 3 (one more attempt than before) for stability.
        run: npx cucumber-js ${{ matrix.test_path }} --profile ci --parallel ${{ matrix.parallel }} --retry ${{ matrix.retry }}
        env:
          CI: "true"

      - name: Upload ${{ matrix.suite_name }} JUnit Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Allure Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload ${{ matrix.suite_name }} Traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite_id }}-traces
          path: test-results/traces/
          if-no-files-found: ignore

  report:
    name: '[${{ inputs.domain }}] Report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    # Report whenever the matrix actually ran (pass or fail). Skip only if the
    # matrix itself was skipped/cancelled (e.g. the chain was cancelled upstream).
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-results
        continue-on-error: true

      - name: Download Allure Results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      # Per-domain Allure trend history — scoped to this caller workflow so each
      # domain keeps its own trend line.
      - name: Download previous Allure history
        if: always()
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: allure-history
          path: previous-history
          workflow: ${{ inputs.history-workflow }}
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always()
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo "Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo "History copied"
          else
            echo "No previous history found (first run)"
          fi

      - name: Setup Node.js for Allure
        if: always()
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install allure@3

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            npx allure generate ./allure-results -o allure-report
            [ -f "allure-report/index.html" ] && echo "Allure report generated successfully" || echo "Allure report produced no index.html"
          else
            echo "No Allure result files found — skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1></body></html>" > allure-report/index.html
          fi

      - name: Generate Cucumber HTML Report
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          EXPECTED_SUITES: ${{ inputs.expected-suites }}
        run: |
          echo "Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find all-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);
            if (files.length === 0) { console.log('No cucumber JSON files found'); process.exit(0); }
            let merged = [];
            // Only expected suite reports feed the domain numbers — filter out
            // any non-suite report a broad artifact download might pull in.
            const expected = new Set((process.env.EXPECTED_SUITES || '').split(/\s+/).filter(Boolean));
            for (const file of files) {
              const suiteMatch = file.match(/all-results\/([^/]+)-report\//);
              const suiteId = suiteMatch ? suiteMatch[1] : '';
              if (expected.size > 0 && !expected.has(suiteId)) { console.log('Skipping non-suite report: ' + file); continue; }
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                for (const feature of (Array.isArray(data) ? data : [data])) {
                  feature.suiteId = suiteId;
                  merged.push(feature);
                }
              } catch(e) { console.log('Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log('Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            const failedScenarios = [];
            // pending/undefined/ambiguous fail the cucumber run (strict mode)
            // and land in rerun.txt + JUnit failures — count them as failed
            // here too, or the summary over-reports passes.
            const FAIL_STATUSES = { failed: 1, ambiguous: 1, pending: 1, undefined: 1 };
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const failStep = steps.find(s => s.result && FAIL_STATUSES[s.result.status]);
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped');
                if (failStep) {
                  failed++; ff++;
                  const rawErr = ((failStep.result && failStep.result.error_message) || '').split('\n')[0];
                  failedScenarios.push({
                    suite: feature.suiteId || '',
                    feature: name,
                    scenario: el.name || '',
                    location: (feature.uri || '') + ':' + (el.line || ''),
                    error: (rawErr || (failStep.result.status + ' step: ' + ((failStep.keyword || '') + (failStep.name || '')).trim())).slice(0, 300)
                  });
                }
                else if (allSkip) { skipped++; fsk++; }
                else { passed++; fp++; }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows, failedScenarios }));

            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const domain = process.env.DOMAIN || 'Domain';
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + domain + ' Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1>' + domain + ' Test Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] + '</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\">' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\">' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\">' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI — ' + domain + '</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log('Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Post Reports Summary
        if: always()
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          echo "## ${DOMAIN} — Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              const status = s.failed > 0 ? '🔴 SOME TESTS FAILED' : '🟢 ALL TESTS PASSED';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| 🏷️ **Status** | ' + status + ' |');
              console.log('| 🧪 Total Scenarios | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| 📊 Pass Rate | **' + passRate + '%** |');
              // Markdown-table-safe cell text: pipes/angle brackets swapped for
              // lookalikes so a scenario name can never break the table layout.
              const esc = t => String(t || '').slice(0, 220).split('\n').join(' ').split('|').join('¦').split('<').join('&lt;').split('>').join('&gt;');
              const failedList = s.failedScenarios || [];
              if (failedList.length > 0) {
                console.log('');
                console.log('### ❌ Failed Scenarios (' + failedList.length + ')');
                console.log('');
                console.log('| Suite | Scenario | Location | Error (last attempt) |');
                console.log('|-------|----------|----------|----------------------|');
                const MAX_ROWS = 100;
                for (const f of failedList.slice(0, MAX_ROWS)) {
                  console.log('| ' + esc(f.suite) + ' | ' + esc(f.scenario) + ' | ' + esc(f.location) + ' | ' + esc(f.error) + ' |');
                }
                if (failedList.length > MAX_ROWS) {
                  console.log('');
                  console.log('…and ' + (failedList.length - MAX_ROWS) + ' more — download the cucumber-html-report artifact for the full list.');
                }
              }
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Cucumber results summary available" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile Expected Suites
        if: always()
        shell: bash
        env:
          EXPECTED_SUITES: ${{ inputs.expected-suites }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const expectedSuites = (process.env.EXPECTED_SUITES || '').split(/\s+/).filter(Boolean);
            const missing = [];
            for (const suiteId of expectedSuites) {
              const reportPath = path.join('all-results', suiteId + '-report', 'cucumber-report.json');
              let reason = null;
              if (!fs.existsSync(reportPath)) {
                reason = 'no report artifact found';
              } else {
                const raw = fs.readFileSync(reportPath, 'utf8');
                if (raw.trim().length === 0) {
                  reason = 'empty report file (job likely hit its step timeout mid-run)';
                } else {
                  try {
                    const data = JSON.parse(raw);
                    const features = Array.isArray(data) ? data : [data];
                    const scenarioCount = features.reduce((sum, f) => sum + (f.elements || []).filter(e => e.type === 'scenario').length, 0);
                    if (scenarioCount === 0) reason = 'report contains no scenarios';
                  } catch (e) { reason = 'invalid JSON (' + e.message + ')'; }
                }
              }
              if (reason) missing.push({ suiteId, reason });
            }
            const lines = ['', '### Suite Reconciliation', ''];
            if (missing.length === 0) {
              lines.push('All ' + expectedSuites.length + ' expected suites produced results.');
            } else {
              lines.push(missing.length + ' of ' + expectedSuites.length + ' expected suites produced NO results — scenario totals above are UNDERCOUNTED:');
              lines.push('');
              lines.push('| Suite | Reason |');
              lines.push('|-------|--------|');
              for (const m of missing) lines.push('| ' + m.suiteId + ' | ' + m.reason + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            if (missing.length > 0) {
              console.log('::error::' + missing.length + ' suite(s) produced no results: ' + missing.map(m => m.suiteId).join(', '));
              process.exit(1);
            }
          "

      - name: Publish Cucumber Test Results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: '${{ inputs.domain }} Tests - Run ${{ github.run_number }}'
          reporter: java-junit
          path: 'all-results/**/cucumber-junit.xml'
          list-suites: failed
          list-tests: failed
          # Render dorny's rich pass/fail report (shield badge + per-suite table
          # + expandable failed tests) directly in this run's Summary tab, so the
          # "Cucumber Tests" report is visible without opening the separate
          # check-run. The custom "Post Reports Summary" / "Reconcile" steps above
          # stay — they add the failed-scenario error list and undercount
          # reconciliation that dorny does not provide, so the two complement
          # rather than duplicate each other.
          use-actions-summary: true
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true
