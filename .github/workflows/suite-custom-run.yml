name: Suite - Custom Run
run-name: 'Suite - Custom Run · ${{ github.ref_name }}'

# Manual-only: run a hand-picked set of tests in CI from a branch.
#
# ---------------------------------------------------------------------------
# HOW TO USE IT
# ---------------------------------------------------------------------------
#   1. Create a branch from main.
#   2. On that branch, set `test_path` in the matrix below to the tests to run:
#      a SPACE-SEPARATED list of .feature files and/or folders, exactly like a
#      suite leg's test_path (suite-runner.yml passes it as-is to
#      `npx cucumber-js <test_path>`). NEVER leave it empty: cucumber-js with no
#      path falls back to its default glob and runs the ENTIRE repo.
#   3. Commit and push the branch.
#   4. Actions → "Suite - Custom Run" → "Run workflow", and pick the branch
#      under "Use workflow from".
#   5. Do NOT merge the test_path change into main. Delete the branch when done.
#
# Not dispatched by suite-scheduler.yml and has no nightly rerun hand-off.
# Concurrency is per branch, so custom runs on different branches do not queue
# behind each other or behind the nightly domain suites. They DO share the
# staging environment and test accounts with those runs: booking tests started
# alongside another booking run (or the 21:00 Portugal-time nightly) can collide.

on:
  workflow_dispatch:
    inputs:
      parallel:
        description: 'Cucumber workers (keep at 1 for booking tests — bookings are real)'
        required: false
        type: choice
        default: '1'
        options: ['1', '2', '3', '4']
      retry:
        description: 'Retries per scenario'
        required: false
        type: choice
        default: '1'
        options: ['0', '1', '2', '3']

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-custom-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Custom Run
      history-workflow: suite-custom-run.yml
      expected-suites: custom-run
      # On main, test_path holds a single non-booking test as a harmless example.
      # Replace it on your branch (see HOW TO USE IT above).
      #
      # 200/190 minutes match the booking legs: a leg that times out uploads NO
      # results at all, so a custom run of a whole folder must not be cut short.
      matrix: |
        {
          "include": [
            {
              "suite_id": "custom-run",
              "suite_name": "Custom Run",
              "test_path": "tests/features/shell/shell_homepage/65552_upcoming_trips_per_persona.feature",
              "parallel": ${{ inputs.parallel }}, "retry": ${{ inputs.retry }}, "job_timeout_minutes": 200, "step_timeout_minutes": 190
            }
          ]
        }
