name: Suite Scheduler

# Starts ALL FOUR domain suites (Flights, Hotels, Shell, Transportation) in
# parallel every day at 21:10 Portugal time (Europe/Lisbon).
#
# GitHub cron is UTC-only and Lisbon alternates between UTC+0 (winter, WET)
# and UTC+1 (summer, WEST), so BOTH candidate slots are scheduled and a guard
# dispatches only from the slot that is 21:10 local:
#   - '10 20 * * *' is the right slot while Lisbon is UTC+1 (late Mar → late Oct)
#   - '10 21 * * *' is the right slot while Lisbon is UTC+0
# The other slot exits without doing anything.
#
# The schedule lives HERE (a dispatcher) instead of on the domain workflows on
# purpose: a schedule+guard on each suite would still produce a run on the decoy
# slot. Nothing chains off this dispatcher, so its decoy runs are inert.
#
# The domains used to run as a serial chain (Flights → Hotels → Shell →
# Transportation), each dispatching the next from its own `chain-next` job. They
# now all start at once from here, so the nightly wall-clock is the SLOWEST
# domain instead of the sum of all four. Consequences worth knowing:
#   - the four runs compete for the account's concurrent-job allowance; jobs over
#     the cap queue (they do not fail) and `timeout-minutes` only starts counting
#     once a job actually starts, so queueing cannot cause a false timeout
#   - they also compete for the shared staging environment, which the serial
#     chain used to spread out. Contention is the top flake source in this suite;
#     if pass rates drop after this change, the lever is per-leg `parallel`, not
#     going back to the chain.
#
# `gh workflow run` is a workflow_dispatch, which the built-in GITHUB_TOKEN IS
# allowed to trigger — so both this scheduler and every suite run on
# github.token, no PAT needed. We deliberately do NOT trigger via the
# `workflow_run` event: GitHub suppresses workflow_run cascades from runs created
# by GITHUB_TOKEN (recursion prevention), which silently killed the old chain
# after Flights on the first scheduled run (2026-07-16).

on:
  schedule:
    - cron: '10 20 * * *' # 21:10 Lisbon during summer time (WEST)
    - cron: '10 21 * * *' # 21:10 Lisbon during winter time (WET)
  workflow_dispatch: # manual: starts every domain immediately, no time guard

permissions:
  actions: write # gh workflow run needs to dispatch the domain suites

concurrency:
  group: suite-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch all domain suites at 21:10 Lisbon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start every domain suite if this slot is 21:10 in Lisbon
        env:
          GH_TOKEN: ${{ github.token }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Pick the correct slot from the CURRENT Lisbon UTC offset instead
            # of the current hour, so a delayed runner start can't misjudge.
            offset=$(TZ=Europe/Lisbon date +%z)
            if [ "$offset" = "+0100" ]; then
              want='10 20 * * *'
            else
              want='10 21 * * *'
            fi
            if [ "$FIRED_CRON" != "$want" ]; then
              echo "Decoy slot ($FIRED_CRON; Lisbon offset $offset) — nothing to do."
              exit 0
            fi
          fi

          echo "Dispatching all domain suites in parallel."
          failed=""
          for wf in suite-flights.yml suite-hotels.yml suite-shell.yml suite-transportation.yml; do
            dispatched=""
            # Retry: a transient GitHub API 5xx must not drop a domain
            # (run #29709388523 died on a one-off HTTP 503).
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$wf" --ref main --repo "$GITHUB_REPOSITORY"; then
                echo "Dispatched $wf (attempt $attempt)."
                dispatched="yes"
                break
              fi
              echo "Dispatch attempt $attempt for $wf failed; retrying in 30s…"
              sleep 30
            done
            # Keep going so one unreachable domain can't cost us the other three.
            if [ -z "$dispatched" ]; then
              echo "::error::Failed to dispatch $wf after 5 attempts."
              failed="$failed $wf"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::Domains not dispatched:$failed"
            exit 1
          fi
          echo "All four domain suites dispatched."
