name: Suite - Hotels

# One of the four nightly domain suites, dispatched in parallel with the others
# by suite-scheduler.yml at 21:10 Portugal time, and manually dispatchable on its
# own. It starts and finishes independently — no domain waits on another.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-hotels
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Hotels
      history-workflow: suite-hotels.yml
      expected-suites: >-
        hotels-non-booking hotels-booking
      matrix: |
        {
          "include": [
            { "suite_id": "hotels-non-booking", "suite_name": "Hotels Non Booking", "test_path": "tests/features/hotels/hotels_non_booking/", "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "hotels-booking",     "suite_name": "Hotels Booking",     "test_path": "tests/features/hotels/hotels_booking/",     "parallel": 1, "retry": 1, "job_timeout_minutes": 240, "step_timeout_minutes": 230 }
          ]
        }
