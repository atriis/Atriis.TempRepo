name: Suite - Hotels

# 2nd in the chain. Started by the previous domain's `chain-next` job (Flights
# dispatches this ~5 min after it finishes), and also manually dispatchable on
# its own. When this run finishes, its own `chain-next` job waits 5 min and
# dispatches "Suite - Shell". The chain self-dispatches instead of using the
# workflow_run event — see suite-scheduler.yml header for why.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-hotels
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Hotels
      history-workflow: suite-hotels.yml
      expected-suites: >-
        hotels-non-booking hotels-booking
      matrix: |
        {
          "include": [
            { "suite_id": "hotels-non-booking", "suite_name": "Hotels Non Booking", "test_path": "tests/features/hotels/hotels_non_booking/", "parallel": 2, "retry": 3, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "hotels-booking",     "suite_name": "Hotels Booking",     "test_path": "tests/features/hotels/hotels_booking/",     "parallel": 1, "retry": 3, "job_timeout_minutes": 240, "step_timeout_minutes": 230 }
          ]
        }

  # Advance the chain: 5 min after this domain finishes, dispatch Shell. Runs on
  # success OR failure; skipped only if cancelled. See suite-flights.yml for the
  # rationale (workflow_dispatch is allowed for github.token; workflow_run isn't).
  chain-next:
    name: Start next domain (Shell)
    needs: suite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Wait 5 min, then dispatch Suite - Shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cooldown 5 min before starting the next domain (Shell)…"
          sleep 300
          gh workflow run suite-shell.yml --ref main --repo "$GITHUB_REPOSITORY"
