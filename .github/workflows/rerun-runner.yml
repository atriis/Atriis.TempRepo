name: Rerun Failures (reusable)

# Reusable engine behind the four per-domain rerun workflows (Rerun - Flights,
# Rerun - Hotels, Rerun - Shell, Rerun - Transportation). Those are started
# automatically after every nightly by rerun-nightly-gate.yml, once all four
# domains have finished, and can also be dispatched by hand.
#
# EVERY failed scenario is rerun. Three jobs:
#   plan   - resolve the source run, collect its failures and its per-suite
#            totals, work out where each failure lives on the ref under test,
#            and shard them
#   rerun  - one matrix job per shard, running that shard's scenarios
#   report - two reports in the summary:
#              1. Rerun only - what the rerun did with the failures it reran
#              2. Combined   - the source run's pass rate with the rerun folded
#                 in. The total stays the SOURCE run's scenario count: a
#                 scenario is passed if it passed in the source run or on the
#                 rerun, so the rerun can only move failures to passes, never
#                 add scenarios. A failure that was not rerun (not found on
#                 the ref, or cut by max-scenarios) or that produced no rerun
#                 result stays failed.
#
# Sharding is BY SOURCE SUITE, not by an arbitrary slice count. Each shard holds
# exactly the failures that came out of one suite job of the source run, so the
# rerun inherits that run's concurrency contract unchanged: scenarios that ran
# serially in one suite job still run serially in one rerun job, and different
# suites run concurrently just as they did in the suite. That matters because
# bookings are real and suites are the unit that isolates test users — an
# arbitrary shard could put two scenarios sharing a login into parallel jobs.
#
# It also means a whole domain's worth of failures fits: 100 failures spread over
# 7 suites is 7 jobs, each well inside its own timeout, instead of one job trying
# to serialise 100 real bookings and dying at the step timeout with no report.
#
# Which ref (the `ref` input):
#   - `main` (default) — rerun the failures against the latest main, so a test
#     that was fixed since the suite ran is verified as fixed. This is the
#     normal "did my fix work?" path.
#   - `source-commit` — check out the exact commit the suite run used, which
#     reproduces the failure faithfully and does NOT pick up fixes pushed
#     since. Use it when investigating a flake rather than verifying a fix.
#
# Failures are collected as (feature file, scenario name) IDENTITIES, never as
# line numbers: the line numbers in the source report belong to that run's
# feature files, and reusing them against main would rerun whatever now sits on
# those lines — after any edit a different scenario, or none. So each failure is
# looked up by name in a `--dry-run` inventory of the checked-out feature files
# and its CURRENT line is taken from there. Scenario Outline example rows share
# one name, so same-named occurrences are matched in order (1st failing row ->
# 1st row on the ref, and so on).
#
# `main` is resolved to a concrete SHA in `plan` and every shard checks out THAT
# sha, so a push landing mid-rerun cannot shift the line numbers under the shards.
#
# Three hard safety rails, the first learned the expensive way:
#   - `cucumber-js` with no path arguments runs the ENTIRE suite, which fires
#     real bookings. Every shard refuses to start with an empty location list.
#   - a failure that no longer resolves on the ref (feature file moved, scenario
#     renamed or deleted, example row removed) is reported as unresolved rather
#     than dropped quietly. If NOTHING resolves, the plan fails instead of
#     reporting a green rerun of nothing.
#   - `max-scenarios` is an OPT-IN limit (0 = no limit, the default). When it is
#     set, whatever it drops is always printed — never silently truncated.
#
# The failure reports are read straight from the per-suite artifacts rather than
# the report job's summary.json, so a rerun still works when the source run's
# report job failed or was skipped.

on:
  workflow_call:
    inputs:
      domain:
        description: Human-readable domain label used in job names (e.g. "Flights").
        required: true
        type: string
      suite-workflow:
        description: Suite workflow filename to pull failures from (e.g. "suite-flights.yml").
        required: true
        type: string
      run-id:
        description: Specific run id of that suite workflow. Blank = its latest completed run on main.
        required: false
        type: string
        default: ''
      ref:
        description: >
          Which code to rerun against: "main" (latest main — verifies fixes) or
          "source-commit" (the commit the source run used — reproduces the failure).
        required: false
        type: string
        default: main
      parallel:
        description: Cucumber workers within a shard. Keep at 1 for booking suites.
        required: false
        type: number
        default: 1
      retry:
        description: Cucumber --retry for the rerun.
        required: false
        type: number
        default: 1
      max-scenarios:
        description: Optional limit on total scenarios rerun. 0 = no limit (rerun every failure).
        required: false
        type: number
        default: 0
      job-timeout-minutes:
        description: Timeout for one shard job.
        required: false
        type: number
        default: 180
      step-timeout-minutes:
        description: Timeout for one shard's cucumber step.
        required: false
        type: number
        default: 170

env:
  LOG_LEVEL: info
  LOG_FORMAT: pretty

jobs:
  plan:
    name: '[${{ inputs.domain }}] Plan the rerun'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # gh run list / view / download against the source run
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      shards: ${{ steps.resolve.outputs.shards }}
      sha: ${{ steps.resolve.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_url: ${{ steps.source.outputs.run_url }}
    steps:
      # Initial checkout is only needed to read the repo before the tree is
      # replaced with the ref under test.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate inputs
        shell: bash
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$REF_INPUT" in
            main|source-commit) ;;
            *)
              echo "::error::ref must be 'main' or 'source-commit', got '$REF_INPUT'."
              exit 1
              ;;
          esac

      - name: Resolve source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_WORKFLOW: ${{ inputs.suite-workflow }}
          REQUESTED_RUN_ID: ${{ inputs.run-id }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
            echo "Using the run id supplied on dispatch: $run_id"
          else
            # Latest run that actually finished producing results, restricted to
            # main. Every suite is workflow_dispatch-only, so without --branch a
            # suite someone dispatched from a feature branch would silently
            # become the source of "the failures on main".
            run_id=$(gh run list --workflow "$SUITE_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
              --branch main --limit 30 --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))][0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No completed run of $SUITE_WORKFLOW found on main to rerun failures from."
            exit 1
          fi

          meta=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json headSha,headBranch,displayTitle,conclusion,createdAt,url,workflowName)
          head_sha=$(jq -r '.headSha' <<<"$meta")
          run_url=$(jq -r '.url' <<<"$meta")

          # What the tests will actually be checked out at.
          if [ "$REF_INPUT" = "main" ]; then
            checkout_ref="main"
          else
            checkout_ref="$head_sha"
          fi

          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "run_url=$run_url"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ${{ inputs.domain }} — Rerun of failed scenarios"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source run | [$(jq -r '.workflowName' <<<"$meta") #$run_id]($run_url) |"
            echo "| Source branch | $(jq -r '.headBranch' <<<"$meta") |"
            echo "| Source conclusion | $(jq -r '.conclusion' <<<"$meta") |"
            echo "| Source started | $(jq -r '.createdAt' <<<"$meta") |"
            echo "| Source run commit | \`$head_sha\` |"
            echo "| Rerunning against | \`$checkout_ref\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything lands in RUNNER_TEMP, not the workspace: the checkout that
      # follows runs `git clean -ffdx` and would delete the collected failures.
      - name: Download failure reports from the source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-artifacts"
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
               -p '*-report' -D "$RUNNER_TEMP/source-artifacts"; then
            echo "::warning::No '*-report' artifacts could be downloaded from run $RUN_ID (expired, or the run produced none)."
          fi
          echo "Report files found: $(find "$RUNNER_TEMP/source-artifacts" -name cucumber-report.json | wc -l)"

      # Identity only — (feature file, scenario name, source line, suite). The
      # line is kept for reporting and for ordering same-named example rows,
      # never as the thing handed to cucumber-js.
      - name: Collect failed scenarios from the source run
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.join(process.env.RUNNER_TEMP, 'source-artifacts');
          const outFile = path.join(process.env.RUNNER_TEMP, 'failures.json');

          // Same semantics as the suite report: strict mode fails the run on
          // pending/undefined/ambiguous too, so those are failures to rerun.
          const FAIL_STATUSES = new Set(['failed', 'ambiguous', 'pending', 'undefined']);

          const walk = (dir) => !fs.existsSync(dir) ? [] :
            fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) =>
              e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)]);

          const reports = walk(root).filter((f) => path.basename(f) === 'cucumber-report.json');
          const found = [];
          // Per-suite totals of the source run, classified exactly like the
          // suite's own report (failed / all-steps-skipped / passed), so the
          // combined report starts from the same numbers the suite summary showed.
          const totals = {};
          for (const file of reports) {
            // artifact dir is "<suite_id>-report" — the suite_id becomes the shard
            const m = file.match(/source-artifacts[\\/]([^\\/]+)-report[\\/]/);
            const suiteId = m ? m[1] : 'unknown-suite';
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (e) { console.log('Skipping invalid JSON: ' + file); continue; }
            const t = totals[suiteId] || (totals[suiteId] = { total: 0, passed: 0, failed: 0, skipped: 0 });
            for (const feature of (Array.isArray(data) ? data : [data])) {
              // Reports written on a Windows dev box carry backslash uris.
              const uri = String(feature.uri || '').replace(/\\/g, '/');
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                const steps = el.steps || [];
                t.total++;
                if (!steps.some((s) => s.result && FAIL_STATUSES.has(s.result.status))) {
                  if (steps.every((s) => !s.result || s.result.status === 'skipped')) t.skipped++;
                  else t.passed++;
                  continue;
                }
                t.failed++;
                if (!uri) continue;
                found.push({ uri, line: el.line, name: el.name || '', suite: suiteId });
              }
            }
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'source-totals.json'), JSON.stringify(totals));

          // The json formatter omits attempts that will be retried, so a
          // scenario that failed then passed on retry is not in here. Dedupe is
          // only about the same scenario appearing in two suites' artifacts.
          const seen = new Set();
          const unique = found.filter((f) => {
            const key = f.uri + ' :: ' + f.line + ' :: ' + f.name;
            return !seen.has(key) && seen.add(key);
          });
          unique.sort((a, b) => a.uri.localeCompare(b.uri) || a.line - b.line);

          fs.writeFileSync(outFile, JSON.stringify(unique, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + unique.length + '\n');
          console.log('Collected ' + unique.length + ' failed scenario(s) from ' + reports.length + ' report file(s).');
          NODE

      - name: Nothing to rerun
        if: steps.collect.outputs.count == '0'
        shell: bash
        run: |
          echo "Source run ${{ steps.source.outputs.run_id }} had no failed scenarios — nothing to do."
          {
            echo "### Nothing to rerun"
            echo ""
            echo "The source run reported no failed scenarios."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # From here on the workspace IS the ref under test. Line numbers are read
      # back off THIS tree, never carried over from the source run.
      - name: Check out the ref under test
        if: steps.collect.outputs.count != '0'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.source.outputs.checkout_ref }}

      # Only cucumber is needed to build the inventory — no browsers, no ENV
      # secret. The shards do the full setup.
      - name: Install dependencies
        if: steps.collect.outputs.count != '0'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - name: npm ci
        if: steps.collect.outputs.count != '0'
        shell: bash
        run: npm ci

      # A cucumber `--dry-run` over just the affected feature files gives the
      # authoritative scenario -> line mapping for this tree, including the
      # per-row lines of Scenario Outline examples. The throwaway profile loads
      # no support code: undefined steps are irrelevant when all we want is the
      # pickle inventory, and skipping the requires keeps allure/module-alias out
      # of it entirely.
      - name: Resolve failed scenarios and shard them
        id: resolve
        if: steps.collect.outputs.count != '0'
        shell: bash
        env:
          MAX_SCENARIOS: ${{ inputs.max-scenarios }}
          CHECKOUT_REF: ${{ steps.source.outputs.checkout_ref }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Rerunning against $SHA ($CHECKOUT_REF)"
          echo "| Commit under test | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"

          # Phase 1 — write the dry-run profile and list the files to inventory.
          # The profile and its output stay in the WORKSPACE, not RUNNER_TEMP:
          # cucumber-js resolves --config as path.join(cwd, file), so an absolute
          # path turns into "<workspace>/home/runner/_temp/..." and fails to load.
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const tmp = process.env.RUNNER_TEMP;
          const failures = JSON.parse(fs.readFileSync(path.join(tmp, 'failures.json'), 'utf8'));

          const uris = [...new Set(failures.map((f) => f.uri))].sort();
          const present = uris.filter((u) => fs.existsSync(u));
          const missing = uris.filter((u) => !fs.existsSync(u));

          fs.writeFileSync('rerun-dryrun-profile.json', JSON.stringify({
            default: {
              dryRun: true,
              require: [],
              format: ['json:rerun-dryrun-report.json'],
            },
          }, null, 2));
          fs.writeFileSync(path.join(tmp, 'dryrun-files.txt'), present.join('\n') + (present.length ? '\n' : ''));
          fs.writeFileSync(path.join(tmp, 'missing-files.json'), JSON.stringify(missing));
          console.log('Feature files to inventory: ' + present.length + ' (missing on this ref: ' + missing.length + ')');
          NODE

          # Phase 2 — build the inventory. Empty only if every feature file the
          # failures came from is gone from this ref; phase 3 reports that.
          # Loading no support code means every step reads as undefined, which
          # the stdout formatter prints as a snippet — dozens of screens of noise
          # that means nothing here. Kept in a log and only shown if the dry-run
          # actually fails (a Gherkin parse error, say).
          mapfile -t DRY_FILES < "$RUNNER_TEMP/dryrun-files.txt"
          if [ "${#DRY_FILES[@]}" -gt 0 ]; then
            if ! npx cucumber-js "${DRY_FILES[@]}" --config rerun-dryrun-profile.json \
                 > "$RUNNER_TEMP/dryrun.log" 2>&1; then
              echo "::error::Could not build a scenario inventory for the failed features on $CHECKOUT_REF."
              cat "$RUNNER_TEMP/dryrun.log"
              exit 1
            fi
          else
            echo '[]' > rerun-dryrun-report.json
          fi

          # Phase 3 — match failures to current lines, shard by suite, report.
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const tmp = process.env.RUNNER_TEMP;
          const ref = process.env.CHECKOUT_REF;
          const limit = parseInt(process.env.MAX_SCENARIOS || '0', 10) || 0;

          const failures = JSON.parse(fs.readFileSync(path.join(tmp, 'failures.json'), 'utf8'));
          const missingFiles = new Set(JSON.parse(fs.readFileSync(path.join(tmp, 'missing-files.json'), 'utf8')));
          const inventory = JSON.parse(fs.readFileSync('rerun-dryrun-report.json', 'utf8'));

          // uri -> scenario name -> ascending lines as they are on THIS ref.
          const byUri = new Map();
          for (const feature of (Array.isArray(inventory) ? inventory : [inventory])) {
            const uri = String(feature.uri || '').replace(/\\/g, '/');
            if (!uri) continue;
            const names = byUri.get(uri) || new Map();
            for (const el of (feature.elements || [])) {
              if (el.type !== 'scenario') continue;
              const key = el.name || '';
              const lines = names.get(key) || [];
              lines.push(el.line);
              names.set(key, lines);
            }
            for (const lines of names.values()) lines.sort((a, b) => a - b);
            byUri.set(uri, names);
          }

          // Group the failures the same way so same-named Scenario Outline rows
          // can be paired by position: Nth failing row -> Nth row on the ref.
          const groups = new Map();
          for (const f of failures) {
            const key = f.uri + ' :: ' + f.name;
            const g = groups.get(key) || [];
            g.push(f);
            groups.set(key, g);
          }

          const resolved = [];
          const unresolved = [];
          for (const [, occurrences] of groups) {
            occurrences.sort((a, b) => a.line - b.line);
            const { uri, name } = occurrences[0];
            const available = (byUri.get(uri) || new Map()).get(name) || [];
            occurrences.forEach((f, i) => {
              if (missingFiles.has(uri)) {
                unresolved.push({ ...f, reason: 'feature file is not on ' + ref });
              } else if (available.length === 0) {
                unresolved.push({ ...f, reason: 'scenario not found on ' + ref + ' (renamed or deleted)' });
              } else if (i >= available.length) {
                unresolved.push({ ...f, reason: 'only ' + available.length + ' occurrence(s) of this scenario on ' + ref });
              } else {
                resolved.push({ ...f, loc: uri + ':' + available[i], sourceLine: f.line });
              }
            });
          }
          resolved.sort((a, b) => a.loc.localeCompare(b.loc));

          // A location list is passed to each shard as one newline-separated
          // string (feature filenames can contain spaces, e.g. 29744), so only a
          // path with a line break in it would split into two bad args.
          const broken = resolved.filter((s) => /[\r\n]/.test(s.loc));
          if (broken.length > 0) {
            console.log('::error::Feature paths contain line breaks, which the shard argument list cannot carry: ' +
              broken.map((s) => JSON.stringify(s.loc)).join(', '));
            process.exit(1);
          }

          // max-scenarios is opt-in: 0 means rerun every failure.
          const selected = limit > 0 ? resolved.slice(0, limit) : resolved;
          const dropped = limit > 0 ? resolved.slice(limit) : [];

          // One shard per source suite: the failures of one suite job stay in one
          // job, exactly as they ran in the source run.
          const shardOf = (suite) => String(suite || 'unknown-suite').replace(/[^A-Za-z0-9._-]/g, '-');
          const bySuite = new Map();
          for (const s of selected) {
            const id = shardOf(s.suite);
            const shard = bySuite.get(id) || [];
            shard.push(s);
            bySuite.set(id, shard);
          }
          const include = [...bySuite.entries()]
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([suite_id, items]) => ({
              suite_id,
              count: items.length,
              locations: items.map((s) => s.loc).join('\n'),
            }));

          // A skipped job must still have a syntactically valid matrix, so never
          // emit an empty include — the job's `if` is what stops it running.
          const matrix = { include: include.length > 0 ? include : [{ suite_id: 'none', count: 0, locations: '' }] };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify(matrix) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + selected.length + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'shards=' + include.length + '\n');

          const esc = (t) => String(t == null ? '' : t).slice(0, 220).split('\n').join(' ').split('|').join('¦');
          const out = [''];
          if (selected.length > 0) {
            out.push('### Rerunning ' + selected.length + ' of ' + failures.length +
              ' failed scenario(s) across ' + include.length + ' shard(s)', '');
            out.push('| Shard (source suite) | Scenarios |');
            out.push('|----------------------|-----------|');
            for (const s of include) out.push('| ' + esc(s.suite_id) + ' | ' + s.count + ' |');
            out.push('');
            out.push('<details><summary>Every scenario being rerun</summary>', '');
            out.push('| Shard | Scenario | Location on ' + esc(ref) + ' | Was |');
            out.push('|-------|----------|-------------|-----|');
            for (const s of selected) {
              out.push('| ' + esc(s.suite) + ' | ' + esc(s.name) + ' | `' + esc(s.loc) + '` | `:' + esc(s.sourceLine) + '` |');
            }
            out.push('', '</details>', '');
          }
          if (dropped.length > 0) {
            // Never truncate silently — a limited rerun that looks complete is
            // worse than one that says what it left behind.
            out.push('> **' + dropped.length + ' failed scenario(s) were NOT rerun** because max-scenarios was set to ' +
              limit + '. Dispatch with max_scenarios = 0 to rerun every failure.');
            out.push('>');
            for (const s of dropped) out.push('> - `' + esc(s.loc) + '` — ' + esc(s.name));
            out.push('');
            console.log('::warning::' + dropped.length + ' failed scenario(s) were dropped by max-scenarios = ' + limit + '.');
          }
          if (unresolved.length > 0) {
            // These are the ones a line-number-carrying rerun would have run
            // blind: the line still exists, but it is a different scenario now
            // (or none).
            out.push('> **' + unresolved.length + ' failed scenario(s) could not be located on `' + esc(ref) + '`** and were not rerun:');
            out.push('>');
            for (const s of unresolved) {
              out.push('> - `' + esc(s.uri) + ':' + esc(s.line) + '` — ' + esc(s.name) + ' — ' + esc(s.reason));
            }
            out.push('');
            console.log('::warning::' + unresolved.length + ' failed scenario(s) no longer exist on ' + ref + ' and were skipped.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');

          // Everything the report job needs for the combined pass rate: the
          // source run's per-suite totals, and what happened to each of its
          // failures here — rerun (at `loc` in shard `shard`), or not and why.
          const entry = (s, status, reason) => ({
            suite: s.suite, shard: shardOf(s.suite), name: s.name, uri: s.uri, line: s.line,
            loc: s.loc || '', status, reason: reason || '',
          });
          const plan = {
            ref,
            totals: JSON.parse(fs.readFileSync(path.join(tmp, 'source-totals.json'), 'utf8')),
            entries: [
              ...selected.map((s) => entry(s, 'rerun')),
              ...dropped.map((s) => entry(s, 'not-rerun', 'left out by max-scenarios = ' + limit)),
              ...unresolved.map((s) => entry(s, 'not-rerun', s.reason)),
            ],
          };
          fs.mkdirSync(path.join(tmp, 'rerun-plan'), { recursive: true });
          fs.writeFileSync(path.join(tmp, 'rerun-plan', 'plan.json'), JSON.stringify(plan));

          console.log('Resolved ' + resolved.length + ' of ' + failures.length + ' failed scenario(s) on ' + ref +
            '; rerunning ' + selected.length + ' in ' + include.length + ' shard(s).');
          if (resolved.length === 0) {
            // Every failure vanished from this ref. Possible (a whole feature
            // deleted), but far more often it means the reports and the tree
            // have nothing to do with each other — so fail loudly instead of
            // reporting a green rerun of zero scenarios.
            console.log('::error::None of the ' + failures.length + ' failed scenario(s) could be located on ' + ref +
              ' — nothing was rerun. Check that the source run belongs to this repo state, or rerun with ref=source-commit.');
            process.exit(1);
          }
          NODE

      # Read by the report job to build the combined (source run + rerun) report.
      - name: Upload the rerun plan
        if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-plan
          path: ${{ runner.temp }}/rerun-plan/plan.json
          if-no-files-found: error

  rerun:
    name: '[${{ inputs.domain }}] ${{ matrix.suite_id }} (${{ matrix.count }})'
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The exact sha the plan resolved the line numbers on, so a push landing
      # mid-rerun cannot move them under us.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/setup-test-env
        with:
          env-file-content: ${{ secrets.ENV }}

      - name: Rerun ${{ matrix.suite_id }} failures
        timeout-minutes: ${{ inputs.step-timeout-minutes }}
        shell: bash
        env:
          CI: "true"
          LOCATIONS: ${{ matrix.locations }}
        run: |
          set -euo pipefail
          # One location per line — split on newlines only, so a feature path
          # with a space in it stays a single argument.
          mapfile -t LOCS < <(printf '%s\n' "$LOCATIONS" | sed '/^[[:space:]]*$/d')
          # Hard stop: `cucumber-js` with no path arguments runs the WHOLE suite,
          # which means real bookings against staging. An empty list is a bug in
          # the plan job, never an instruction to run everything.
          if [ "${#LOCS[@]}" -eq 0 ]; then
            echo "::error::Shard ${{ matrix.suite_id }} got an empty location list — refusing to invoke cucumber-js with no arguments."
            exit 1
          fi
          echo "Rerunning ${#LOCS[@]} scenario(s) from ${{ matrix.suite_id }}:"
          printf '  %s\n' "${LOCS[@]}"
          npx cucumber-js "${LOCS[@]}" \
            --profile ci \
            --parallel ${{ inputs.parallel }} \
            --retry ${{ inputs.retry }}

      - name: Upload rerun JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-${{ matrix.suite_id }}-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload rerun Cucumber report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-${{ matrix.suite_id }}-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload rerun screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-${{ matrix.suite_id }}-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload rerun traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-${{ matrix.suite_id }}-traces
          path: test-results/traces/
          if-no-files-found: ignore

  report:
    name: '[${{ inputs.domain }}] Rerun report'
    needs: [plan, rerun]
    if: ${{ always() && needs.plan.outputs.count != '0' && (needs.rerun.result == 'success' || needs.rerun.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # GitHub's artifact service 403s intermittently ("Error from intermediary with
      # HTTP status code 403"), and the download action classes 403 as non-retryable
      # and gives up immediately - so the retry has to happen at the step level.
      # Without it a healthy rerun reports every shard as missing.
      - name: Download every shard's report and the rerun plan
        id: download-1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'rerun-{plan,*-report}'
          path: shard-reports
        continue-on-error: true

      - name: Back off before retrying the artifact download
        if: always() && steps.download-1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Download every shard's report and the rerun plan (retry)
        id: download-2
        if: always() && steps.download-1.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'rerun-{plan,*-report}'
          path: shard-reports
        continue-on-error: true

      - name: Back off before the final artifact download attempt
        if: always() && steps.download-2.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Download every shard's report and the rerun plan (final attempt)
        id: download-3
        if: always() && steps.download-2.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'rerun-{plan,*-report}'
          path: shard-reports
        continue-on-error: true

      # The downloads are continue-on-error, so without this the aggregation below
      # would blame the shards for results it simply could not fetch.
      - name: Fail loudly if no shard report could be downloaded
        if: always()
        shell: bash
        env:
          OUTCOME_1: ${{ steps.download-1.outcome }}
          OUTCOME_2: ${{ steps.download-2.outcome }}
          OUTCOME_3: ${{ steps.download-3.outcome }}
        run: |
          if [ "$OUTCOME_1" = "success" ] || [ "$OUTCOME_2" = "success" ] || [ "$OUTCOME_3" = "success" ]; then
            exit 0
          fi
          echo "::error::Could not download the shard reports after 3 attempts (attempts: $OUTCOME_1, $OUTCOME_2, $OUTCOME_3). The shards are NOT known to have failed - their artifacts are still attached to this run. Re-run this rerun report job alone."
          exit 1

      # Two reports in the summary:
      #   1. Rerun only - every rerun scenario and how it ended this time.
      #   2. Combined   - the source run's pass rate with the rerun folded in.
      #      The denominator is the SOURCE run's scenario count, never source +
      #      rerun: a rerun only re-attempts scenarios that are already in that
      #      count, so it can turn a failure into a pass but never adds a
      #      scenario. Passed = passed in the source run + failures that passed
      #      on the rerun.
      # A shard that produced no report at all (timed out, or crashed before
      # writing) is called out rather than quietly leaving its scenarios out;
      # in the combined report those scenarios stay failed.
      - name: Build the rerun and combined reports
        shell: bash
        env:
          EXPECTED_SHARDS: ${{ needs.plan.outputs.shards }}
          EXPECTED_SCENARIOS: ${{ needs.plan.outputs.count }}
          SOURCE_RUN_URL: ${{ needs.plan.outputs.run_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'shard-reports';
          const FAIL = new Set(['failed', 'ambiguous', 'pending', 'undefined']);
          const esc = (t) => String(t == null ? '' : t).slice(0, 220).split('\n').join(' ').split('|').join('¦')
            .split('<').join('&lt;').split('>').join('&gt;');
          const pct = (n, d) => (d > 0 ? ((n / d) * 100).toFixed(1) + '%' : '—');
          const ICON = { passed: '✅', failed: '❌', skipped: '⏭️' };

          const walk = (dir) => !fs.existsSync(dir) ? [] :
            fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) =>
              e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)]);

          // A scenario stopped by a known supplier booking error ends 'pending'
          // with no error message; the step attaches the supplier's own words as
          // a 'BOOKING_ERROR:' text embedding. Same read as the suite report.
          const bookingError = (el) => {
            for (const step of (el.steps || [])) {
              for (const emb of (step.embeddings || [])) {
                if (!emb || !emb.data) continue;
                const mt = emb.mime_type || emb.media_type || '';
                if (mt && mt.indexOf('text') === -1 && mt.indexOf('json') === -1) continue;
                let text = String(emb.data);
                if (text.indexOf('BOOKING_ERROR:') === -1) {
                  try { text = Buffer.from(emb.data, 'base64').toString('utf8'); } catch (e) { /* not base64 */ }
                }
                const m = text.match(/BOOKING_ERROR:([\s\S]+)/);
                if (m) return m[1].split('\n')[0].trim();
              }
            }
            return '';
          };

          // ---- Rerun results, classified like the suite report ----
          const files = walk(root).filter((f) => path.basename(f) === 'cucumber-report.json');
          const rows = [];
          const shards = new Set();
          for (const file of files) {
            // Anchor on the artifact DIRECTORY: a greedy match runs past it and
            // swallows "cucumber-report.json" too.
            const m = file.match(/[\\/]rerun-(.+?)-report[\\/]/);
            const shard = m ? m[1] : path.dirname(file);
            shards.add(shard);
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (e) { console.log('Skipping invalid JSON: ' + file); continue; }
            for (const feature of (Array.isArray(data) ? data : [data])) {
              const uri = String(feature.uri || '').replace(/\\/g, '/');
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                const steps = el.steps || [];
                const bad = steps.find((s) => s.result && FAIL.has(s.result.status));
                let status = 'passed';
                let err = '';
                if (bad) {
                  status = 'failed';
                  err = ((bad.result && bad.result.error_message) || '').split('\n')[0] || bookingError(el) ||
                    (bad.result.status + ' step: ' + ((bad.keyword || '') + (bad.name || '')).trim());
                } else if (steps.every((s) => !s.result || s.result.status === 'skipped')) {
                  status = 'skipped';
                }
                rows.push({ status, shard, name: el.name, loc: uri + ':' + el.line, err });
              }
            }
          }
          const ORDER = { failed: 0, skipped: 1, passed: 2 };
          rows.sort((a, b) => ORDER[a.status] - ORDER[b.status] || a.shard.localeCompare(b.shard) || a.loc.localeCompare(b.loc));

          const expectedShards = parseInt(process.env.EXPECTED_SHARDS || '0', 10);
          const expectedScenarios = parseInt(process.env.EXPECTED_SCENARIOS || '0', 10);
          const count = (st) => rows.filter((r) => r.status === st).length;
          const passed = count('passed');
          const failed = count('failed');
          const skipped = count('skipped');

          // ---- Report 1: rerun only ----
          const out = ['', '## Report 1 · Rerun only', ''];
          out.push('Only the scenarios that failed in the source run and were rerun here.', '');
          out.push('| Rerun | ✅ Passed | ❌ Failed again | ⏭️ Skipped | 📊 Rerun pass rate |');
          out.push('|-------|-----------|-----------------|------------|--------------------|');
          out.push('| ' + rows.length + ' | ' + passed + ' | ' + failed + ' | ' + skipped + ' | **' + pct(passed, rows.length) + '** |');
          out.push('');
          if (rows.length < expectedScenarios) {
            out.push('> **' + (expectedScenarios - rows.length) + ' of ' + expectedScenarios + ' planned scenario(s) produced no result.** ' +
              'A shard hit its timeout or crashed before writing a report — check the shard jobs above.', '');
            console.log('::warning::' + (expectedScenarios - rows.length) +
              ' planned scenario(s) produced no result; a shard did not finish.');
          }
          if (shards.size < expectedShards) {
            out.push('> Reports came back from ' + shards.size + ' of ' + expectedShards + ' shard(s).', '');
          }
          out.push('| | Shard | Scenario | Location | Error |');
          out.push('|---|-------|----------|----------|-------|');
          for (const r of rows) {
            out.push('| ' + ICON[r.status] + ' | ' + esc(r.shard) + ' | ' + esc(r.name) + ' | ' +
              esc(r.loc) + ' | ' + (r.status === 'failed' ? esc(r.err) : '—') + ' |');
          }
          out.push('');

          // ---- Report 2: source run + rerun combined ----
          out.push('## Report 2 · Source run + rerun combined', '');
          const planFile = walk(root).find((f) => path.basename(f) === 'plan.json');
          let plan = null;
          if (planFile) {
            try { plan = JSON.parse(fs.readFileSync(planFile, 'utf8')); }
            catch (e) { console.log('Invalid plan.json: ' + e.message); }
          }
          if (!plan) {
            out.push('> Not available: the rerun-plan artifact could not be read, so the source run\'s totals are unknown. ' +
              'Re-run this report job alone.', '');
            console.log('::warning::rerun-plan artifact missing or invalid; combined report skipped.');
          } else {
            const byKey = new Map(rows.map((r) => [r.shard + '|' + r.loc, r]));
            const recovered = {};
            const still = [];
            for (const e of plan.entries) {
              let why;
              if (e.status !== 'rerun') {
                why = 'not rerun — ' + e.reason;
              } else {
                const r = byKey.get(e.shard + '|' + e.loc);
                if (!r) why = 'no rerun result (its shard did not finish)';
                else if (r.status === 'passed') { recovered[e.suite] = (recovered[e.suite] || 0) + 1; continue; }
                else if (r.status === 'skipped') why = 'skipped on the rerun';
                else why = 'failed again — ' + r.err;
              }
              still.push({ ...e, why });
            }

            const suites = Object.keys(plan.totals).sort();
            const sum = { total: 0, passed: 0, failed: 0, skipped: 0, recovered: 0 };
            const suiteRows = suites.map((id) => {
              const t = plan.totals[id];
              // A failure can only be recovered once, and never beyond the
              // suite's own failure count.
              const rec = Math.min(recovered[id] || 0, t.failed);
              sum.total += t.total; sum.passed += t.passed; sum.failed += t.failed;
              sum.skipped += t.skipped; sum.recovered += rec;
              return { id, ...t, rec };
            });
            const combinedPassed = sum.passed + sum.recovered;
            const combinedFailed = sum.failed - sum.recovered;

            out.push('The total is the source run\'s own scenario count. A scenario counts as passed if it passed in the ' +
              'source run **or** on this rerun — rerun scenarios are not added to the total.', '');
            out.push('| | Scenarios | ✅ Passed | ❌ Failed | ⏭️ Skipped | 📊 Pass rate |');
            out.push('|---|-----------|-----------|-----------|------------|--------------|');
            out.push('| Source run | ' + sum.total + ' | ' + sum.passed + ' | ' + sum.failed + ' | ' + sum.skipped + ' | ' + pct(sum.passed, sum.total) + ' |');
            out.push('| **Source run + rerun** | ' + sum.total + ' | ' + combinedPassed + ' (' + sum.recovered + ' on the rerun) | ' +
              combinedFailed + ' | ' + sum.skipped + ' | **' + pct(combinedPassed, sum.total) + '** |');
            out.push('');
            out.push('| Suite | Scenarios | Passed in source run | Passed on rerun | Still failing | Skipped | Source run rate | Combined rate |');
            out.push('|-------|-----------|----------------------|-----------------|---------------|---------|-----------------|---------------|');
            for (const s of suiteRows) {
              out.push('| ' + esc(s.id) + ' | ' + s.total + ' | ' + s.passed + ' | ' + s.rec + ' | ' + (s.failed - s.rec) + ' | ' +
                s.skipped + ' | ' + pct(s.passed, s.total) + ' | ' + pct(s.passed + s.rec, s.total) + ' |');
            }
            out.push('');
            if (still.length > 0) {
              const MAX_ROWS = 150;
              out.push('### ❌ Still failing after the rerun (' + still.length + ')', '');
              out.push('| Suite | Scenario | Location in source run | Why |');
              out.push('|-------|----------|------------------------|-----|');
              for (const s of still.slice(0, MAX_ROWS)) {
                out.push('| ' + esc(s.suite) + ' | ' + esc(s.name) + ' | ' + esc(s.uri + ':' + s.line) + ' | ' + esc(s.why) + ' |');
              }
              if (still.length > MAX_ROWS) out.push('', '…and ' + (still.length - MAX_ROWS) + ' more.');
              out.push('');
            }
            console.log('Combined: ' + combinedPassed + '/' + sum.total + ' passed (' + pct(combinedPassed, sum.total) +
              '); source run alone ' + sum.passed + '/' + sum.total + ' (' + pct(sum.passed, sum.total) + ').');
          }

          out.push('Source run: ' + (process.env.SOURCE_RUN_URL || '(unknown)'));
          out.push('');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          console.log('Rerun: ' + passed + ' passed, ' + failed + ' failed, ' + skipped + ' skipped of ' + rows.length + ' reported.');
          NODE
