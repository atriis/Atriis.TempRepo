name: Rerun - Shell
# The gate finds an existing rerun of a suite run by this " · run <id>" suffix.
run-name: ${{ inputs.run_id && format('Rerun - Shell · run {0}', inputs.run_id) || 'Rerun - Shell' }}

# Reruns the scenarios that FAILED in a "Suite - Shell" run on main, against
# the latest main by default. Started automatically after every nightly by
# rerun-nightly-gate.yml (with that nightly's run id), and dispatchable by hand
# with any run id (blank = the latest completed run on main). Either way the
# summary carries two reports: the rerun on its own, and the combined pass rate
# of the source run and this rerun. All the logic lives in rerun-runner.yml —
# see its header.
#
# `rerun_against`: main (the default) reruns each failure at its CURRENT line on
# main, so a test fixed since the suite ran is verified as fixed; source-commit
# reproduces the failure on the commit that run used, picking up no fixes.
#
# Every failed scenario is rerun: the plan job shards them one job per source
# suite, so a suite's failures stay serial in one job the way they ran, and
# different suites run concurrently. No limit unless you set max_scenarios.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Suite - Shell run id to take failures from (blank = latest completed run on main)'
        required: false
        type: string
        default: ''
      rerun_against:
        description: 'main = verify fixes pushed since the run · source-commit = reproduce the failure as it was'
        required: false
        type: choice
        default: 'main'
        options: ['main', 'source-commit']
      parallel:
        description: 'Cucumber workers'
        required: false
        type: choice
        default: '1'
        options: ['1', '2', '3', '4']
      retry:
        description: 'Retries per scenario'
        required: false
        type: choice
        default: '1'
        options: ['0', '1', '2', '3']
      max_scenarios:
        description: 'Optional limit on how many failures to rerun — leave at 0 to rerun ALL of them'
        required: false
        type: string
        default: '0'

permissions:
  contents: read
  actions: read

concurrency:
  group: rerun-shell
  cancel-in-progress: false

jobs:
  rerun:
    uses: ./.github/workflows/rerun-runner.yml
    secrets: inherit
    with:
      domain: Shell
      suite-workflow: suite-shell.yml
      run-id: ${{ inputs.run_id }}
      ref: ${{ inputs.rerun_against }}
      parallel: ${{ fromJSON(inputs.parallel) }}
      retry: ${{ fromJSON(inputs.retry) }}
      max-scenarios: ${{ fromJSON(inputs.max_scenarios) }}
      job-timeout-minutes: 240
      step-timeout-minutes: 230
