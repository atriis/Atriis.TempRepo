name: Rerun Failed Tests

# Automatically re-runs ONLY the scenarios that failed in a scheduled or manually
# dispatched "Test Suite" run, 5 minutes after that run completes. The failing scenarios come from the
# per-suite rerun.txt files (Cucumber's `rerun` formatter, configured in
# cucumber.js) that Test Suite uploads as `<suite_id>-rerun` artifacts. rerun.txt
# lists only scenarios that failed EVERY attempt, so the in-run `--retry 2` has
# already filtered out transient flakes — this pass is a clean, isolated retry.
#
# This rerun produces the SAME full report set as test-suite.yml: JUnit XML,
# Cucumber JSON, screenshots, traces, Allure results + rendered Allure HTML
# report (with cross-rerun history), a Cucumber HTML report, and a published
# dorny check run. Because the rerun is a single job (not a matrix), all reports
# are generated inline in this job rather than in a separate download/merge job.

on:
  workflow_run:
    workflows: ["Test Suite"]
    types: [completed]

# Need actions:read to download artifacts from the triggering run, and
# checks:write so the rerun's own results can be published as a check run.
permissions:
  contents: read
  actions: read
  checks: write

# Keep reruns for the same source run from stacking up.
concurrency:
  group: rerun-failures-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failures:
    name: Rerun Failed Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only after a scheduled OR manually-dispatched Test Suite run that actually
    # FAILED (i.e. there are failures worth rerunning). Other trigger events (e.g.
    # push/pull_request, if ever enabled) are ignored.
    if: >
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Wait 5 minutes before rerun
        run: sleep 300

      # Check out the EXACT commit the scheduled run used so the feature:line
      # references in rerun.txt still point at the right scenarios.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      - run: mkdir -p test-results test-results/screenshots

      - name: Load environment variables
        uses: ./.github/actions/load-env-from-secret
        with:
          env-file-content: ${{ secrets.ENV }}

      # Pull the per-suite rerun.txt artifacts produced by the failed run.
      - name: Download rerun files from the failed run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-rerun'
          path: rerun-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Merge every suite's rerun.txt into one list. `awk 1` normalises trailing
      # newlines so two files never splice a `feature:3` + `feature:5` together;
      # the sed drops blank lines left by suites that had no failures.
      - name: Build combined rerun list
        id: combine
        shell: bash
        run: |
          mkdir -p test-results
          : > test-results/rerun-combined.txt
          if [ -d rerun-artifacts ]; then
            find rerun-artifacts -name 'rerun.txt' -type f -exec awk 1 {} + \
              | sed '/^[[:space:]]*$/d' > test-results/rerun-combined.txt || true
          fi
          count=$(grep -c . test-results/rerun-combined.txt || true)
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${count:-0} failed scenario(s) to rerun:"
          cat test-results/rerun-combined.txt || true

      - name: Rerun failed scenarios
        if: steps.combine.outputs.count != '0'
        shell: bash
        # cucumber-js 12 dropped the `@file` args-from-file syntax: `cucumber-js
        # @rerun.txt` is treated as a literal (non-matching) path and SILENTLY runs
        # 0 scenarios — so the auto-rerun was a no-op every time. Expand the list
        # into explicit `path:line` args instead (proven to match). The empty guard
        # is critical: with zero path args cucumber-js would run the ENTIRE default
        # suite — real bookings against staging. (The step `if` already gates on
        # count != 0; this is belt-and-suspenders.)
        run: |
          mapfile -t SCENARIOS < test-results/rerun-combined.txt
          if [ ${#SCENARIOS[@]} -eq 0 ]; then
            echo "Rerun list is empty — refusing to run the full suite."; exit 0
          fi
          npx cucumber-js "${SCENARIOS[@]}" --profile ci --parallel 2 --retry 1
        env:
          CI: "true"

      - name: Nothing to rerun
        if: steps.combine.outputs.count == '0'
        run: echo "No failed-scenario rerun files found in the source run — nothing to rerun."

      # ---- Raw result artifacts (mirror the per-suite uploads in test-suite.yml) ----

      - name: Upload Rerun JUnit Results
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-results
          path: test-results/cucumber-junit.xml
          if-no-files-found: ignore

      - name: Upload Rerun Cucumber Report
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-report
          path: test-results/cucumber-report.json
          if-no-files-found: ignore

      - name: Upload Rerun Allure Results
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Rerun Screenshots
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore

      - name: Upload Rerun Traces
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-traces
          path: test-results/traces/
          if-no-files-found: ignore

      # ---- Rendered HTML reports (mirror the `report` job in test-suite.yml) ----

      # Pull this rerun workflow's OWN previous Allure history so the report shows
      # a trend line across reruns (kept separate from the Test Suite history).
      - name: Download previous Allure history
        if: always() && steps.combine.outputs.count != '0'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: rerun-allure-history
          path: previous-history
          workflow: rerun-failures.yml
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Copy history into Allure results
        if: always() && steps.combine.outputs.count != '0'
        shell: bash
        run: |
          if [ -d "previous-history" ]; then
            echo "Found previous history, copying into allure-results/history..."
            mkdir -p allure-results/history
            cp -r previous-history/* allure-results/history/ 2>/dev/null || true
            echo "History copied"
          else
            echo "No previous history found (first rerun)"
          fi

      - name: Install Allure CLI
        if: always() && steps.combine.outputs.count != '0'
        run: npm install allure@3

      - name: Generate Allure Report
        if: always() && steps.combine.outputs.count != '0'
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*.json' -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            npx allure generate ./allure-results -o allure-report
            if [ -f "allure-report/index.html" ]; then
              echo "Allure report generated successfully"
            else
              echo "Allure report generation produced no index.html"
            fi
          else
            echo "No Allure result files found — skipping report generation"
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results available</h1><p>The rerun produced no Allure result files.</p></body></html>" > allure-report/index.html
          fi

      - name: Generate Cucumber HTML Report
        if: always() && steps.combine.outputs.count != '0'
        shell: bash
        run: |
          echo "Merging Cucumber JSON reports..."
          mkdir -p cucumber-html-report

          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find test-results -name cucumber-report.json -type f 2>/dev/null')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) { console.log('No cucumber JSON files found'); process.exit(0); }

            let merged = [];
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                merged = merged.concat(Array.isArray(data) ? data : [data]);
              } catch(e) { console.log('Skipping invalid JSON: ' + file); }
            }
            fs.writeFileSync('cucumber-html-report/merged-report.json', JSON.stringify(merged, null, 2));
            console.log('Merged ' + files.length + ' report(s) with ' + merged.length + ' feature(s)');

            let totalScenarios = 0, passed = 0, failed = 0, skipped = 0;
            const suiteRows = [];
            for (const feature of merged) {
              const name = feature.name || 'Unknown';
              let fp = 0, ff = 0, fsk = 0;
              for (const el of (feature.elements || [])) {
                if (el.type !== 'scenario') continue;
                totalScenarios++;
                const steps = el.steps || [];
                const hasFail = steps.some(s => s.result && s.result.status === 'failed');
                const allSkip = steps.every(s => !s.result || s.result.status === 'skipped' || s.result.status === 'undefined');
                if (hasFail) { failed++; ff++; }
                else if (allSkip) { skipped++; fsk++; }
                else { passed++; fp++; }
              }
              if (fp + ff + fsk > 0) suiteRows.push({ name, passed: fp, failed: ff, skipped: fsk });
            }
            fs.writeFileSync('cucumber-html-report/summary.json', JSON.stringify({ totalScenarios, passed, failed, skipped, suiteRows }));

            const passRate = totalScenarios > 0 ? ((passed / totalScenarios) * 100).toFixed(1) : '0.0';
            const rows = suiteRows.map(r =>
              '<tr><td>' + r.name + '</td><td class=\"pass\">' + r.passed + '</td><td class=\"fail\">' + r.failed +
              '</td><td class=\"skip\">' + r.skipped + '</td><td><span class=\"badge ' +
              (r.failed > 0 ? 'badge-fail\">FAIL' : 'badge-pass\">PASS') + '</span></td></tr>'
            ).join('\n');
            const html = '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Cucumber Rerun Report - Run #' +
              (process.env.GITHUB_RUN_NUMBER || '') + '</title><style>' +
              'body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:20px;background:#f6f8fa}' +
              'h1{color:#24292e}h2{color:#586069;margin-top:30px}' +
              '.summary{display:flex;gap:20px;margin:20px 0}' +
              '.card{background:white;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:center;flex:1}' +
              '.card .num{font-size:2em;font-weight:bold}.card .label{color:#586069;margin-top:5px}' +
              '.pass{color:#22863a}.fail{color:#cb2431}.skip{color:#b08800}.rate{color:#0366d6}' +
              'table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}' +
              'th{background:#24292e;color:white;padding:12px;text-align:left}td{padding:10px 12px;border-bottom:1px solid #e1e4e8}' +
              'tr:hover{background:#f6f8fa}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.85em;font-weight:600}' +
              '.badge-pass{background:#dcffe4;color:#22863a}.badge-fail{background:#ffdce0;color:#cb2431}' +
              '.footer{margin-top:30px;color:#586069;font-size:.9em}</style></head><body>' +
              '<h1>Cucumber Rerun Report</h1>' +
              '<p>Run #' + (process.env.GITHUB_RUN_NUMBER || 'N/A') + ' | ' + new Date().toISOString().split('T')[0] +
              ' | Rerun of failed scenarios</p>' +
              '<div class=\"summary\">' +
              '<div class=\"card\"><div class=\"num\">' + totalScenarios + '</div><div class=\"label\">Total Scenarios</div></div>' +
              '<div class=\"card\"><div class=\"num pass\">' + passed + '</div><div class=\"label\">Passed</div></div>' +
              '<div class=\"card\"><div class=\"num fail\">' + failed + '</div><div class=\"label\">Failed</div></div>' +
              '<div class=\"card\"><div class=\"num skip\">' + skipped + '</div><div class=\"label\">Skipped</div></div>' +
              '<div class=\"card\"><div class=\"num rate\">' + passRate + '%</div><div class=\"label\">Pass Rate</div></div>' +
              '</div><h2>Features</h2>' +
              '<table><tr><th>Feature</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Status</th></tr>' +
              rows + '</table>' +
              '<div class=\"footer\">Generated by Atriis Test Automation CI — Failure Rerun</div></body></html>';
            fs.writeFileSync('cucumber-html-report/index.html', html);
            console.log('Cucumber HTML report generated');
          "
        continue-on-error: true

      - name: Upload Cucumber HTML Report
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-cucumber-html-report
          path: cucumber-html-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure History
        if: always() && steps.combine.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rerun-allure-history
          path: allure-report/history/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Publish Rerun Test Results
        if: always() && steps.combine.outputs.count != '0'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Cucumber Rerun - Run ${{ github.run_number }}
          reporter: java-junit
          path: 'test-results/cucumber-junit.xml'
          list-suites: failed
          list-tests: failed
          use-actions-summary: false
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Post Rerun Summary
        if: always()
        shell: bash
        run: |
          echo "## 🔁 Failure Rerun" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by Test Suite run [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }}) (\`${{ github.event.workflow_run.conclusion }}\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed scenarios rerun: **${{ steps.combine.outputs.count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "cucumber-html-report/summary.json" ]; then
            node -e "
              const s = JSON.parse(require('fs').readFileSync('cucumber-html-report/summary.json', 'utf8'));
              const passRate = s.totalScenarios > 0 ? ((s.passed / s.totalScenarios) * 100).toFixed(1) : '0.0';
              const status = s.failed > 0 ? '🔴 SOME RERUNS STILL FAILED' : '🟢 ALL RERUNS PASSED';
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| 🏷️ **Status** | ' + status + ' |');
              console.log('| 🧪 Rerun Scenarios | ' + s.totalScenarios + ' |');
              console.log('| ✅ Passed | ' + s.passed + ' |');
              console.log('| ❌ Failed | ' + s.failed + ' |');
              console.log('| ⏭️ Skipped | ' + s.skipped + ' |');
              console.log('| 📊 Pass Rate | **' + passRate + '%** |');
            " >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Report | How to View |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Cucumber HTML** | Download **rerun-cucumber-html-report** artifact — open \`index.html\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Allure Report** | Download **rerun-allure-report** artifact — run \`npx allure open allure-report\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Screenshots** | Download **rerun-screenshots** artifact |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Traces** | Download **rerun-traces** artifact — run \`npx playwright show-trace <file>\` |" >> "$GITHUB_STEP_SUMMARY"
