name: Suite - Transportation

# LAST in the chain (Cars + Rails). Started by the previous domain's
# `chain-next` job (Shell dispatches this ~2 min after it finishes), and also
# manually dispatchable on its own. Being last, it has no `chain-next` job — the
# chain ends here.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-transportation
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Transportation
      history-workflow: suite-transportation.yml
      # cars-daily used to be ONE job for all 62 daily_cars scenarios. cucumber-js
      # only flushes its json/junit formatters at process exit, so a single step
      # timeout there wiped out every scenario's result, not just the slow ones
      # (run #31144616743: 3 sabre scenarios deterministically fail — Sabre
      # returns 0 results for LHR/Enterprise and LHR/Budget in this env — and
      # --retry 3 burns ~3 min per attempt on each, starving the other ~50
      # scenarios in the queue until the 130 min step timeout killed the job with
      # a 0-byte report). Sharded per supplier folder (mirrors Flights/Hotels) so
      # one bad supplier only blanks its own shard.
      #
      # cars_booking/ and daily_cars/ were later flattened into per-supplier
      # folders directly under the cars/ root (e.g. cars_booking's
      # 30463_amadeus_agreement_text_and_terms.feature now lives in the
      # amadeus/ folder), so the former standalone cars-booking
      # suite is folded into the supplier suites below (with a timeout bump to
      # cover the extra scenarios each absorbed).
      #
      # The whole cars/ and rails/ trees then moved under
      # tests/features/transportation/, and rails/daily_rails/ dissolved into
      # the per-supplier amtrak/, benerail/ and evolvi/ folders. evolvi_converted/
      # was later flattened into the evolvi/ root, so the nightly runs benerail,
      # evolvi, deutsche_bahn and distribusion as supplier folders; amtrak is
      # still dropped.
      #
      # Deliberately NOT run: cars/cars_blocked/, cars/payload_test/,
      # rails/benerail/benerail_blocked/ and rails/evolvi/evolvi_blocked/. Both
      # rail suites therefore glob *.feature at the folder root rather than
      # passing the folder, which would recurse into the _blocked/ subfolder —
      # for evolvi that would pull in 4 extra features carrying 2 undefined
      # steps, which fails the run outright rather than skipping them.
      #
      # The older warning about 37290's filename no longer applies: it was
      # renamed from `[merge]` to `_merge_`, so nothing in either folder is read
      # as a glob char-class. Parentheses in 37290/46290 are matched literally.
      # Re-verify with a --dry-run after ANY rename here: a glob that silently
      # matches nothing reports success with 0 scenarios.
      expected-suites: >-
        cars-amadeus cars-galileo cars-general
        cars-sabre cars-sunny-cars rails-benerail rails-evolvi
        rails-deutsche-bahn rails-distribusion
      matrix: |
        {
          "include": [
            { "suite_id": "cars-amadeus",    "suite_name": "Cars Amadeus",    "test_path": "tests/features/transportation/cars/amadeus/",                                                             "parallel": 2, "retry": 3, "job_timeout_minutes": 80,  "step_timeout_minutes": 75 },
            { "suite_id": "cars-galileo",    "suite_name": "Cars Galileo",    "test_path": "tests/features/transportation/cars/galileo/",                                                             "parallel": 2, "retry": 3, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "cars-general",    "suite_name": "Cars General",    "test_path": "tests/features/transportation/cars/general/",                                                             "parallel": 2, "retry": 3, "job_timeout_minutes": 110, "step_timeout_minutes": 105 },
            { "suite_id": "cars-sabre",      "suite_name": "Cars Sabre",      "test_path": "tests/features/transportation/cars/sabre/",                                                               "parallel": 2, "retry": 3, "job_timeout_minutes": 120, "step_timeout_minutes": 115 },
            { "suite_id": "cars-sunny-cars", "suite_name": "Cars Sunny Cars", "test_path": "tests/features/transportation/cars/sunny_cars/",                                                          "parallel": 2, "retry": 3, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "rails-benerail",  "suite_name": "Rails Benerail",  "test_path": "tests/features/transportation/rails/benerail/*.feature",                                                  "parallel": 3, "retry": 3, "job_timeout_minutes": 180, "step_timeout_minutes": 175 },
            { "suite_id": "rails-evolvi",    "suite_name": "Rails Evolvi",    "test_path": "tests/features/transportation/rails/evolvi/*.feature",                                                    "parallel": 2, "retry": 3, "job_timeout_minutes": 180, "step_timeout_minutes": 175 },
            { "suite_id": "rails-deutsche-bahn", "suite_name": "Rails Deutsche Bahn", "test_path": "tests/features/transportation/rails/deutsche_bahn/*.feature",                                     "parallel": 2, "retry": 3, "job_timeout_minutes": 45,  "step_timeout_minutes": 40 },
            { "suite_id": "rails-distribusion",  "suite_name": "Rails Distribusion",  "test_path": "tests/features/transportation/rails/distribusion/*.feature",                                      "parallel": 1, "retry": 3, "job_timeout_minutes": 45,  "step_timeout_minutes": 40 }
          ]
        }
