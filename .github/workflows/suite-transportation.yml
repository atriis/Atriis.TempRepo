name: Suite - Transportation

# LAST in the chain (Cars + Rails). Started by the previous domain's
# `chain-next` job (Shell dispatches this ~2 min after it finishes), and also
# manually dispatchable on its own. Being last, it has no `chain-next` job — the
# chain ends here.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-transportation
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Transportation
      history-workflow: suite-transportation.yml
      # cars-daily used to be ONE job for all 62 daily_cars scenarios. cucumber-js
      # only flushes its json/junit formatters at process exit, so a single step
      # timeout there wiped out every scenario's result, not just the slow ones
      # (run #31144616743: 3 sabre scenarios deterministically fail — Sabre
      # returns 0 results for LHR/Enterprise and LHR/Budget in this env — and
      # --retry 3 burns ~3 min per attempt on each, starving the other ~50
      # scenarios in the queue until the 130 min step timeout killed the job with
      # a 0-byte report). Sharded per supplier folder (mirrors Flights/Hotels) so
      # one bad supplier only blanks its own shard.
      #
      # cars_booking/ and daily_cars/ were later flattened into per-supplier
      # folders directly under tests/features/cars/ (e.g. cars_booking's
      # 30463_amadeus_agreement_text_and_terms.feature now lives in
      # tests/features/cars/amadeus/), so the former standalone cars-booking
      # suite is folded into the supplier suites below (with a timeout bump to
      # cover the extra scenarios each absorbed).
      expected-suites: >-
        cars-amadeus cars-galileo cars-general
        cars-sabre cars-sunny-cars rails-daily
      matrix: |
        {
          "include": [
            { "suite_id": "cars-amadeus",    "suite_name": "Cars Amadeus",    "test_path": "tests/features/cars/amadeus/",                                       "parallel": 2, "retry": 3, "job_timeout_minutes": 80,  "step_timeout_minutes": 75 },
            { "suite_id": "cars-galileo",    "suite_name": "Cars Galileo",    "test_path": "tests/features/cars/galileo/",                                       "parallel": 2, "retry": 3, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "cars-general",    "suite_name": "Cars General",    "test_path": "tests/features/cars/general/ tests/features/cars/payload_test/",     "parallel": 2, "retry": 3, "job_timeout_minutes": 110, "step_timeout_minutes": 105 },
            { "suite_id": "cars-sabre",      "suite_name": "Cars Sabre",      "test_path": "tests/features/cars/sabre/",                                         "parallel": 2, "retry": 3, "job_timeout_minutes": 120, "step_timeout_minutes": 115 },
            { "suite_id": "cars-sunny-cars", "suite_name": "Cars Sunny Cars", "test_path": "tests/features/cars/sunny_cars/",                                    "parallel": 2, "retry": 3, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "rails-daily",     "suite_name": "Rails Daily",     "test_path": "tests/features/rails/daily_rails/",                                  "parallel": 2, "retry": 3, "job_timeout_minutes": 90,  "step_timeout_minutes": 85 }
          ]
        }
