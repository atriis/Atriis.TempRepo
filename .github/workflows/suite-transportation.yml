name: Suite - Transportation

# One of the four nightly domain suites (Cars + Rails + Parking), dispatched in
# parallel with the others by suite-scheduler.yml at 21:10 Portugal time, and
# manually dispatchable on its own. It starts and finishes independently — no
# domain waits on another.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-transportation
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Transportation
      history-workflow: suite-transportation.yml
      # cars-daily used to be ONE job for all 62 daily_cars scenarios. cucumber-js
      # only flushes its json/junit formatters at process exit, so a single step
      # timeout there wiped out every scenario's result, not just the slow ones
      # (run #31144616743: 3 sabre scenarios deterministically fail — Sabre
      # returns 0 results for LHR/Enterprise and LHR/Budget in this env — and
      # --retry 3 burns ~3 min per attempt on each, starving the other ~50
      # scenarios in the queue until the 130 min step timeout killed the job with
      # a 0-byte report). Sharded per supplier folder (mirrors Flights/Hotels) so
      # one bad supplier only blanks its own shard.
      #
      # cars_booking/ and daily_cars/ were later flattened into per-supplier
      # folders directly under the cars/ root (e.g. cars_booking's
      # 30463_amadeus_agreement_text_and_terms.feature now lives in the
      # amadeus/ folder), so the former standalone cars-booking
      # suite is folded into the supplier suites below (with a timeout bump to
      # cover the extra scenarios each absorbed).
      #
      # The whole cars/ and rails/ trees then moved under
      # tests/features/transportation/, and rails/daily_rails/ dissolved into
      # the per-supplier amtrak/, benerail/ and evolvi/ folders. evolvi_converted/
      # was later flattened into the evolvi/ root, and amtrak_converted/ into the
      # amtrak/ root, so the nightly now runs amtrak, benerail, evolvi,
      # deutsche_bahn and distribusion as supplier folders.
      #
      # Deliberately NOT run: cars/cars_blocked/, cars/payload_test/,
      # cars/sunny_cars/sunny_cars_blocked/, rails/amtrak/amtrak_blocked/,
      # rails/benerail/benerail_blocked/ and rails/evolvi/evolvi_blocked/.
      # Those suites therefore glob *.feature at the folder root rather than
      # passing the folder, which would recurse
      # into the _blocked/ subfolder — for evolvi that would pull in 4 extra
      # features carrying 2 undefined steps, which fails the run outright rather
      # than skipping them; for amtrak it would add 3 blocked features (the
      # folder path dry-runs 8 scenarios, the glob 5). Sunny Cars is the same
      # case: sunny_cars_blocked/ holds 66119, so that suite globs the root too.
      #
      # The older warning about 37290's filename no longer applies: it was
      # renamed from `[merge]` to `_merge_`, so nothing in either folder is read
      # as a glob char-class. Parentheses in 37290/46290 are matched literally.
      # Re-verify with a --dry-run after ANY rename here: a glob that silently
      # matches nothing reports success with 0 scenarios.
      #
      # Parking joins as one suite of 5 scenarios. parking_converted/ was
      # flattened into the parking/ root, which now holds no subfolder at all —
      # so this one passes the FOLDER rather than globbing *.feature, with
      # nothing to recurse into.
      #
      # Ground transport (Transferz) joins as one suite of 6 scenarios, the last of
      # the transferz TODO conversions having landed. transferz_converted/ was
      # flattened into the transferz/ root, which now holds no subfolder — so, like
      # parking, this passes the FOLDER with nothing to recurse into (verified by
      # --dry-run: 6 scenarios, 68 steps).
      #
      # parallel 1, deliberately, unlike its sibling suites: all six scenarios log in
      # as the SAME user (betoribeiro@transferz.com) and two of them book and cancel
      # a real trip, so concurrent workers would race each other on that one user's
      # trip/cart state. Serial costs ~12 min, which is well inside the step timeout.
      # Raise it only after giving the suite per-worker users.
      #
      # Groundscope joins as one suite of 4 scenarios. Unlike transferz/parking it
      # DOES still hold a subfolder — groundscope_blocked/, deliberately not run —
      # so this one globs *.feature at the folder root instead of passing the
      # folder, which would recurse into it. The old warning about square brackets
      # in a filename no longer applies here: the one offending feature
      # (71037_[ground_transportation]_...) sits inside groundscope_blocked/, so the
      # root glob has no char-class to trip over (verified by --dry-run: 4
      # scenarios, 58 steps, nothing undefined).
      #
      # parallel 1, for the same reason as transferz: three of the four scenarios
      # log in as the SAME user (elisabete@groundscope.com) and one of those is a
      # @full_purchase, so concurrent workers would race on that user trip/cart
      # state.
      expected-suites: >-
        cars-amadeus cars-galileo cars-general
        cars-sabre cars-sunny-cars rails-amtrak rails-benerail rails-evolvi
        rails-deutsche-bahn rails-distribusion ground-transport-transferz
        ground-transport-groundscope parking
      matrix: |
        {
          "include": [
            { "suite_id": "cars-amadeus",    "suite_name": "Cars Amadeus",    "test_path": "tests/features/transportation/cars/amadeus/",                                                             "parallel": 2, "retry": 1, "job_timeout_minutes": 80,  "step_timeout_minutes": 75 },
            { "suite_id": "cars-galileo",    "suite_name": "Cars Galileo",    "test_path": "tests/features/transportation/cars/galileo/",                                                             "parallel": 2, "retry": 1, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "cars-general",    "suite_name": "Cars General",    "test_path": "tests/features/transportation/cars/general/",                                                             "parallel": 2, "retry": 1, "job_timeout_minutes": 110, "step_timeout_minutes": 105 },
            { "suite_id": "cars-sabre",      "suite_name": "Cars Sabre",      "test_path": "tests/features/transportation/cars/sabre/",                                                               "parallel": 2, "retry": 1, "job_timeout_minutes": 120, "step_timeout_minutes": 115 },
            { "suite_id": "cars-sunny-cars", "suite_name": "Cars Sunny Cars", "test_path": "tests/features/transportation/cars/sunny_cars/*.feature",                                                  "parallel": 2, "retry": 1, "job_timeout_minutes": 75,  "step_timeout_minutes": 70 },
            { "suite_id": "rails-amtrak",    "suite_name": "Rails Amtrak",    "test_path": "tests/features/transportation/rails/amtrak/*.feature",                                                    "parallel": 2, "retry": 1, "job_timeout_minutes": 60,  "step_timeout_minutes": 55 },
            { "suite_id": "rails-benerail",  "suite_name": "Rails Benerail",  "test_path": "tests/features/transportation/rails/benerail/*.feature",                                                  "parallel": 3, "retry": 1, "job_timeout_minutes": 180, "step_timeout_minutes": 175 },
            { "suite_id": "rails-evolvi",    "suite_name": "Rails Evolvi",    "test_path": "tests/features/transportation/rails/evolvi/*.feature",                                                    "parallel": 2, "retry": 1, "job_timeout_minutes": 180, "step_timeout_minutes": 175 },
            { "suite_id": "rails-deutsche-bahn", "suite_name": "Rails Deutsche Bahn", "test_path": "tests/features/transportation/rails/deutsche_bahn/*.feature",                                     "parallel": 2, "retry": 1, "job_timeout_minutes": 45,  "step_timeout_minutes": 40 },
            { "suite_id": "rails-distribusion",  "suite_name": "Rails Distribusion",  "test_path": "tests/features/transportation/rails/distribusion/*.feature",                                      "parallel": 1, "retry": 1, "job_timeout_minutes": 45,  "step_timeout_minutes": 40 },
            { "suite_id": "ground-transport-transferz", "suite_name": "Ground Transport Transferz", "test_path": "tests/features/transportation/ground_transport/transferz/",                    "parallel": 1, "retry": 1, "job_timeout_minutes": 60,  "step_timeout_minutes": 55 },
            { "suite_id": "ground-transport-groundscope", "suite_name": "Ground Transport Groundscope", "test_path": "tests/features/transportation/ground_transport/groundscope/*.feature",  "parallel": 1, "retry": 1, "job_timeout_minutes": 60,  "step_timeout_minutes": 55 },
            { "suite_id": "parking",         "suite_name": "Parking",         "test_path": "tests/features/transportation/parking/",                                                                  "parallel": 2, "retry": 1, "job_timeout_minutes": 45,  "step_timeout_minutes": 40 }
          ]
        }
