name: Rerun - Transportation

# Manual only. Reruns the scenarios that FAILED in the latest completed
# "Suite - Transportation" run on main (or in a specific run id you pass in),
# against the latest main by default. All the logic lives in rerun-runner.yml —
# see its header.
#
# `rerun_against`: main (the default) reruns each failure at its CURRENT line on
# main, so a test fixed since the suite ran is verified as fixed; source-commit
# reproduces the failure on the commit that run used, picking up no fixes.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Suite - Transportation run id to take failures from (blank = latest completed run on main)'
        required: false
        type: string
        default: ''
      rerun_against:
        description: 'main = verify fixes pushed since the run · source-commit = reproduce the failure as it was'
        required: false
        type: choice
        default: 'main'
        options: ['main', 'source-commit']
      parallel:
        description: 'Cucumber workers (keep at 1 — car/rail bookings are real)'
        required: false
        type: choice
        default: '1'
        options: ['1', '2', '3', '4']
      retry:
        description: 'Retries per scenario'
        required: false
        type: choice
        default: '1'
        options: ['0', '1', '2', '3']
      max_scenarios:
        description: 'Safety cap — failures beyond this are listed but not rerun'
        required: false
        type: string
        default: '40'

permissions:
  contents: read
  actions: read

concurrency:
  group: rerun-transportation
  cancel-in-progress: false

jobs:
  rerun:
    uses: ./.github/workflows/rerun-runner.yml
    secrets: inherit
    with:
      domain: Transportation
      suite-workflow: suite-transportation.yml
      run-id: ${{ inputs.run_id }}
      ref: ${{ inputs.rerun_against }}
      parallel: ${{ fromJSON(inputs.parallel) }}
      retry: ${{ fromJSON(inputs.retry) }}
      max-scenarios: ${{ fromJSON(inputs.max_scenarios) }}
      job-timeout-minutes: 240
      step-timeout-minutes: 230
