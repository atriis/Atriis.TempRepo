name: Test Suite (Optimized)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *'  # Daily at 21:00 UTC
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - bdd

env:
  LOG_LEVEL: info
  LOG_FORMAT: json
  NODE_VERSION: '20'
  # Shared environment variables for all jobs
  AUTOMATION_APP_BASEURL: ${{ secrets.AUTOMATION_APP_BASEURL }}
  GENERAL_PASSWORD: ${{ secrets.GENERAL_PASSWORD }}

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # ============================================================================
  # SETUP JOB: Install dependencies once, cache for all other jobs
  # ============================================================================
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.node }}
      pw-cache-key: ${{ steps.cache-keys.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "node=node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT
          echo "playwright=playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.cache-keys.outputs.node }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-keys.outputs.playwright }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

  # ============================================================================
  # SMOKE TESTS: Critical path validation - BLOCKS regression if it fails
  # ============================================================================
  smoke-tests:
    name: Smoke Tests (Critical Path)
    runs-on: ubuntu-latest
    needs: setup
    env:
      AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.pw-cache-key }}

      - name: Run Smoke Tests
        run: npx playwright test --project=smoke --reporter=html,json,junit
        timeout-minutes: 15

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================================================
  # PLAYWRIGHT REGRESSION: Matrix strategy for parallel execution
  # ============================================================================
  playwright-regression:
    name: PW Regression - ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    needs: [setup, smoke-tests]
    if: success() || failure() # Run even if smoke fails (for visibility)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'flights-general', project: 'flights:general', path: 'tests/regression/flights/general', user: 'AMADEUS_USER_ONE_EMAIL' }
          - { name: 'flights-lufthansa', project: 'flights:lufthansa', path: 'tests/regression/flights/lufthansa', user: 'LUFTHANSA_USER_ONE_EMAIL' }
          - { name: 'hotels-general', project: 'hotels:general', path: 'tests/regression/hotels/general', user: 'RATEHAWK_USER_ONE_EMAIL' }
          - { name: 'hotels-galileo', project: 'hotels:galileo', path: 'tests/regression/hotels/galileo', user: 'GALILEO_USER_ONE_EMAIL' }
          - { name: 'cars-galileo', project: 'cars:galileo', path: 'tests/regression/cars/galileo', user: 'GALILEO_USER_ONE_EMAIL' }
          - { name: 'manual-quote', project: 'manual-quote', path: 'tests/regression/manual-quote', user: 'AMADEUS_USER_ONE_EMAIL' }
          - { name: 'travel-policy', project: 'travel-policy', path: 'tests/regression/travel-policy', user: 'TRAVEL_POLICY_USER_ONE_EMAIL' }
    env:
      # Set all possible user emails - each test will use the one it needs
      AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
      LUFTHANSA_USER_ONE_EMAIL: ${{ secrets.LUFTHANSA_USER_ONE_EMAIL }}
      RATEHAWK_USER_ONE_EMAIL: ${{ secrets.RATEHAWK_USER_ONE_EMAIL }}
      GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
      TRAVEL_POLICY_USER_ONE_EMAIL: ${{ secrets.TRAVEL_POLICY_USER_ONE_EMAIL }}
      SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
      SABRE_USER_TWO_EMAIL: ${{ secrets.SABRE_USER_TWO_EMAIL }}
      CHRIS_TREE_USER_EMAIL: ${{ secrets.CHRIS_TREE_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.pw-cache-key }}

      - name: Run ${{ matrix.suite.name }} tests
        run: npx playwright test ${{ matrix.suite.path }} --reporter=json,junit

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-${{ matrix.suite.name }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================================================
  # CROSS-SUPPLIER TESTS: Run with sharding for speed
  # ============================================================================
  cross-supplier-tests:
    name: Cross-Supplier - ${{ matrix.product }} (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [setup, smoke-tests]
    if: success() || failure()
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: ['cars']
        shard: [1, 2] # Split into 2 parallel shards
    env:
      AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
      GALILEO_USER_ONE_EMAIL: ${{ secrets.GALILEO_USER_ONE_EMAIL }}
      SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
      SUNNY_CARS_USER_ONE_EMAIL: ${{ secrets.SUNNY_CARS_USER_ONE_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.pw-cache-key }}

      - name: Run cross-supplier ${{ matrix.product }} tests (shard ${{ matrix.shard }}/2)
        run: |
          npx playwright test tests/regression/${{ matrix.product }}/cross-supplier \
            --shard=${{ matrix.shard }}/2 \
            --reporter=json,junit

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.product }}-shard-${{ matrix.shard }}-results
          path: |
            test-results/
          retention-days: 7

  # ============================================================================
  # BDD (CUCUMBER) TESTS: Parallel execution by feature area
  # ============================================================================
  bdd-tests:
    name: BDD - ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    needs: [setup, smoke-tests]
    if: success() || failure()
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'cars', path: 'tests/features/cars/daily_cars/', user: 'AMADEUS_USER_ONE_EMAIL' }
          - { name: 'flights', path: 'tests/features/flights/daily_flights/', user: 'AMADEUS_USER_ONE_EMAIL' }
    env:
      AMADEUS_USER_ONE_EMAIL: ${{ secrets.AMADEUS_USER_ONE_EMAIL }}
      AMADEUS_RUI_MENDES_USER: ${{ secrets.AMADEUS_RUI_MENDES_USER }}
      SABRE_USER_ONE_EMAIL: ${{ secrets.SABRE_USER_ONE_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.pw-cache-key }}

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run BDD ${{ matrix.suite.name }} tests
        run: npx cucumber-js ${{ matrix.suite.path }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-${{ matrix.suite.name }}-results
          path: test-results/
          retention-days: 7

  # ============================================================================
  # REPORTING & SUMMARY: Aggregate all results, publish unified report
  # ============================================================================
  test-report:
    name: Test Report & Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, playwright-regression, cross-supplier-tests, bdd-tests]
    if: always()
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Merge Playwright HTML reports
        run: |
          npx playwright merge-reports --reporter html ./all-results/pw-*/
        continue-on-error: true

      - name: Upload unified HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-html-report
          path: playwright-report/
          retention-days: 30

      - name: Publish Playwright test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests - ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/pw-*/test-results/*.xml'
          fail-on-error: false
        continue-on-error: true

      - name: Publish Cucumber test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests - ${{ github.run_number }}
          reporter: java-junit
          path: 'all-results/bdd-*/cucumber-junit.xml'
          fail-on-error: false
          fail-on-empty: false
        continue-on-error: true

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count result files
          pw_count=$(find all-results -name "results.xml" 2>/dev/null | wc -l)
          bdd_count=$(find all-results -name "cucumber-junit.xml" 2>/dev/null | wc -l)
          
          echo "- **Playwright Test Suites:** $pw_count" >> $GITHUB_STEP_SUMMARY
          echo "- **BDD Test Suites:** $bdd_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View detailed HTML report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Check critical path
        if: needs.smoke-tests.result == 'failure'
        run: |
          echo "::error::❌ Smoke tests FAILED - Critical path is broken!"
          echo "## ⚠️ CRITICAL PATH FAILURE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests failed. This blocks deployment." >> $GITHUB_STEP_SUMMARY
          exit 1
