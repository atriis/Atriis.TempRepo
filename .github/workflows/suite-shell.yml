name: Suite - Shell

# One of the four nightly domain suites, dispatched in parallel with the others
# by suite-scheduler.yml at 21:10 Portugal time, and manually dispatchable on its
# own. It starts and finishes independently — no domain waits on another.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: suite-shell
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/suite-runner.yml
    secrets: inherit
    with:
      domain: Shell
      history-workflow: suite-shell.yml
      # Every folder under tests/features/shell/ EXCEPT shell_blocked (blocked /
      # known-app-bug tests, deliberately never run in the nightly suite).
      expected-suites: >-
        shell-administration shell-agent-assistance-and-suggestions
        shell-approval-flows shell-chat-iframe-genesys shell-compensations
        shell-conversation shell-copy-trip shell-email shell-expense shell-fop-issues
        shell-frequent-programs shell-homepage shell-joy-search-defaults
        shell-login-page-and-password shell-manual-quote shell-multiproducts
        shell-per-diem shell-push-notifications shell-reference-fields shell-roles
        shell-share-quote-or-itinerary shell-squake shell-travel-arranger
        shell-travel-policy shell-travel-req-remark shell-trip-monitor shell-ui-issues
        shell-user-profile
      # shell-travel-arranger runs at "parallel": 1, not 2. All three of its features sign in as
      # the same Stuart@Stuart.com, and 63996 empties that user's "who I can book for" list and
      # rebuilds it, while 84857 asserts the exact set of profiles that same list produces. Two
      # workers put the mutation and the assertion in one window, and 84857 then fails as a
      # privilege-scoping regression that never happened. Serial keeps them apart — the same
      # reason the booking suites run at 1 (rerun-runner.yml: suites are the unit that isolates
      # test users).
      matrix: |
        {
          "include": [
            { "suite_id": "shell-administration",                   "suite_name": "Shell Administration",                   "test_path": "tests/features/shell/shell_administration/",                   "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-agent-assistance-and-suggestions", "suite_name": "Shell Agent Assistance And Suggestions", "test_path": "tests/features/shell/shell_agent_assistance_and_suggestions/", "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-approval-flows",                   "suite_name": "Shell Approval Flows",                   "test_path": "tests/features/shell/shell_approval_flows/",                   "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-chat-iframe-genesys",              "suite_name": "Shell Chat Iframe Genesys",              "test_path": "tests/features/shell/shell_chat_iframe_genesys/",              "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-compensations",                    "suite_name": "Shell Compensations",                    "test_path": "tests/features/shell/shell_compensations/",                    "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-conversation",                     "suite_name": "Shell Conversation",                     "test_path": "tests/features/shell/shell_conversation/",                     "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-copy-trip",                        "suite_name": "Shell Copy Trip",                        "test_path": "tests/features/shell/shell_copy_trip/",                        "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-email",                            "suite_name": "Shell Email",                            "test_path": "tests/features/shell/shell_email/",                            "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-expense",                          "suite_name": "Shell Expense",                          "test_path": "tests/features/shell/shell_expense/",                          "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-fop-issues",                       "suite_name": "Shell FOP Issues",                       "test_path": "tests/features/shell/shell_fop_issues/",                       "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-frequent-programs",                "suite_name": "Shell Frequent Programs",                "test_path": "tests/features/shell/shell_frequent_programs/",                "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-homepage",                         "suite_name": "Shell Homepage",                         "test_path": "tests/features/shell/shell_homepage/",                         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-joy-search-defaults",              "suite_name": "Shell Joy Search Defaults",              "test_path": "tests/features/shell/shell_joy_search_defaults/",              "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-login-page-and-password",          "suite_name": "Shell Login Page And Password",          "test_path": "tests/features/shell/shell_login_page_and_password/",          "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-manual-quote",                     "suite_name": "Shell Manual Quote",                     "test_path": "tests/features/shell/shell_manual_quote/",                     "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-multiproducts",                    "suite_name": "Shell Multiproducts",                    "test_path": "tests/features/shell/shell_multiproducts/",                    "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-per-diem",                         "suite_name": "Shell Per Diem",                         "test_path": "tests/features/shell/shell_per_diem/",                         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-push-notifications",               "suite_name": "Shell Push Notifications",               "test_path": "tests/features/shell/shell_push_notifications/",               "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-reference-fields",                 "suite_name": "Shell Reference Fields",                 "test_path": "tests/features/shell/shell_reference_fields/",                 "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-roles",                            "suite_name": "Shell Roles",                            "test_path": "tests/features/shell/shell_roles/",                            "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-share-quote-or-itinerary",         "suite_name": "Shell Share Quote Or Itinerary",         "test_path": "tests/features/shell/shell_share_quote_or_itinerary/",         "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-squake",                           "suite_name": "Shell Squake",                           "test_path": "tests/features/shell/shell_squake/",                           "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-travel-arranger",                  "suite_name": "Shell Travel Arranger",                  "test_path": "tests/features/shell/shell_travel_arranger/",                  "parallel": 1, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-travel-policy",                    "suite_name": "Shell Travel Policy",                    "test_path": "tests/features/shell/shell_travel_policy/",                    "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-travel-req-remark",                "suite_name": "Shell Travel Req Remark",                "test_path": "tests/features/shell/shell_travel_req_remark/",                "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-trip-monitor",                     "suite_name": "Shell Trip Monitor",                     "test_path": "tests/features/shell/shell_trip_monitor/",                     "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-ui-issues",                        "suite_name": "Shell UI Issues",                        "test_path": "tests/features/shell/shell_ui_issues/",                        "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 },
            { "suite_id": "shell-user-profile",                     "suite_name": "Shell User Profile",                     "test_path": "tests/features/shell/shell_user_profile/",                     "parallel": 2, "retry": 1, "job_timeout_minutes": 100, "step_timeout_minutes": 95 }
          ]
        }
